<div class="g-page page">
  <fl-section class="g-flex-auto" [object]="noteTemplate" [isLoading]="isLoading">
    <ng-container *flSectionBody>
      <div class="g-layout-row g-layout-start-center">
        <fl-text-icon>
          <mat-icon flIcon="note_template" class="g-icon-big"></mat-icon>
          <h2>{{ 'biox.note_template' | translate }} :</h2>
        </fl-text-icon>
        <div class="g-flex-auto g-flex">
          <h2 flElementEditable (flElementValueChange)="updateTitle($event)">
            {{ noteTemplate.title }}
          </h2>
        </div>

        <div class="g-print-hide action-buttons">
          <button mat-icon-button [matMenuTriggerFor]="menu">
            <mat-icon>more_vert</mat-icon>
          </button>
          <mat-menu #menu="matMenu" xPosition="before" class="g-print-hide">
            <button mat-menu-item type="button" (click)="printDocument()">
              <mat-icon>print</mat-icon>
              <span>{{ 'biox.print_note_template' | translate }}</span>
            </button>

            <button mat-menu-item type="button" (click)="delete()" class="warn">
              <mat-icon>delete</mat-icon>
              <span>{{ 'biox.delete_note_template' | translate }}</span>
            </button>
          </mat-menu>
        </div>
      </div>

      <!--   Content   -->
      <fl-article-container>
        <fl-article-left-side>
          <te-text-editor-save
            [textEditor]="textEditor"
            [saveFunc]="saveContentFunc"
            class="editor-save"></te-text-editor-save>

          <!--  Created by & Last modified bt  -->
          <p class="g-text-small g-text-light separator">
            <fl-creation-info
              [user]="noteTemplate.createdBy"
              [date]="noteTemplate.createdAt"></fl-creation-info>
          </p>
          <p class="g-text-small g-text-light">
            <fl-last-modification-info
              [user]="noteTemplate.lastModifiedBy"
              [date]="noteTemplate.lastModifiedAt"></fl-last-modification-info>
          </p>
        </fl-article-left-side>
        <fl-article>
          <te-text-editor
            #textEditor
            [formControl]="formControl"
            class="g-full-height g-print-section"
            [config]="textEditorConfig"
            [placeholder]="'biox.note_placeholder' | translate"></te-text-editor>
        </fl-article>
      </fl-article-container>
    </ng-container>
  </fl-section>
</div>
