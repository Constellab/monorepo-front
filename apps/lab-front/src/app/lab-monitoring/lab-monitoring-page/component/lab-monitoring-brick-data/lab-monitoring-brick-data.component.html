<fl-card>
  <fl-card-header>
    <fl-text-icon>
      <mat-icon class="g-icon-big">source</mat-icon>
      <h2>{{'monitoring.bricks_data' | translate}}</h2>
    </fl-text-icon>

    <fl-card-actions>
      <button mat-stroked-button type="button" color="warn"
              class="g-button-small" (click)="openDeleteAllBrickData()">
        {{'monitoring.delete_all_brick_data' | translate}}
      </button>
    </fl-card-actions>
  </fl-card-header>

  <fl-card-body>

    <fl-async-section [object]="brickDataList">

      <ng-container *flSectionBody>

        {{'monitoring.bricks_data_help' | translate}}

        <lab-brick-data-table [datasource]="brickDataList"></lab-brick-data-table>
      </ng-container>
    </fl-async-section>
  </fl-card-body>
</fl-card>
