<fl-card>
  <fl-card-header>
    <fl-text-icon>
      <mat-icon class="g-icon-big">share</mat-icon>
      <h2>{{ 'biox.share_links' | translate }}</h2>
    </fl-text-icon>

    <fl-card-actions>
      <button mat-stroked-button type="button" class="g-button-small" (click)="cleanLinks()">
        {{ 'monitoring.clean_share_links' | translate }}
      </button>
    </fl-card-actions>
  </fl-card-header>

  <fl-card-body>
    <fl-infinite-scroll [datasource]="shareLinks" class="g-infinite-table">
      <lab-share-link-table [datasource]="shareLinks" [columns]="columns"></lab-share-link-table>
    </fl-infinite-scroll>
  </fl-card-body>
</fl-card>
