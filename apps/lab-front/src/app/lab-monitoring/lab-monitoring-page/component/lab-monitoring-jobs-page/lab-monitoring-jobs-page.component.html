<fl-card>
  <fl-card-header>
    <fl-text-icon>
      <mat-icon class="g-icon-big">work</mat-icon>
      <h2>{{ 'monitoring.jobs_list' | translate }}</h2>
    </fl-text-icon>
  </fl-card-header>

  <fl-card-body>
    <fl-async-section [object]="jobs$">
      <ng-container *flSectionBody="jobs$ as jobs">
        <li-triggered-job-table [datasource]="jobsList"></li-triggered-job-table>
      </ng-container>
    </fl-async-section>
  </fl-card-body>
</fl-card>
