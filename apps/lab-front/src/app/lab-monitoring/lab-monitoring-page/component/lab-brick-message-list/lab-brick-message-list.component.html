<fl-section [object]="messages" [emptyText]="'monitoring.lab_no_brick_message' | translate">

  <ng-container *flSectionBody>

    <div>
      <div *ngFor="let message of messages">
        <div class="g-layout-row g-layout-start-center g-layout-gap-1em">
          <fl-status-chip mode="iconText" [status]="message.status"></fl-status-chip>
          <p>{{message.message}}</p>
        </div>
        <mat-divider></mat-divider>
      </div>
    </div>
  </ng-container>
</fl-section>
