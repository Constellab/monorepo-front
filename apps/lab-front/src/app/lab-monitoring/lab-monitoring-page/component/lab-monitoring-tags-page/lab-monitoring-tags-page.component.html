<fl-card>
  <fl-card-header>
    <fl-text-icon>
      <mat-icon class="g-icon-big">local_offer</mat-icon>
      <h2>{{'tags' | translate}}</h2>
    </fl-text-icon>

    <fl-card-actions>
      <button mat-icon-button type="button" (click)="openAddTagDialog()"
              [matTooltip]="'tag_create' | translate">
        <mat-icon>add</mat-icon>
      </button>

      <button mat-icon-button type="button" (click)="openTagHelpDialog()"
              [matTooltip]="'tag_help_tooltip' | translate">
        <mat-icon>help</mat-icon>
      </button>
    </fl-card-actions>
  </fl-card-header>

  <fl-card-body>
    <fl-infinite-scroll [datasource]="tagKeys">
      <lab-tag-entity-detail *ngFor="let tagKey of tagKeys | flDatasourceConnect | async"
                             [tagEntity]="tagKey"
                             (lastTagValueDeleted)="lastTagValueDeleted(tagKey)">
      </lab-tag-entity-detail>
    </fl-infinite-scroll>
  </fl-card-body>
</fl-card>
