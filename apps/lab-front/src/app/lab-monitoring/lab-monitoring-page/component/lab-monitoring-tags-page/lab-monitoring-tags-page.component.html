<fl-card>
  <fl-card-header>
    <fl-text-icon>
      <mat-icon class="g-icon-big" flIcon="tag"></mat-icon>
      <h2>{{ 'g.tags' | translate }}</h2>
    </fl-text-icon>

    <fl-card-actions>
      <button
        mat-icon-button
        type="button"
        (click)="openAddTagDialog()"
        [matTooltip]="'g.tag_create' | translate">
        <mat-icon>add</mat-icon>
      </button>

      <button
        mat-icon-button
        type="button"
        (click)="openTagHelpDialog()"
        [matTooltip]="'g.tag_help_tooltip' | translate">
        <mat-icon>help</mat-icon>
      </button>
    </fl-card-actions>
  </fl-card-header>

  <fl-card-body>
    <p class="g-text-light help-text">{{ 'g.tag_dashboard_help' | translate }}</p>
    <fl-infinite-scroll [datasource]="tagKeys" [textNoResult]="'g.no_tags_dashboard' | translate">
      @for (tagKey of tagKeys | flDatasourceConnect | async; track tagKey) {
        <li-tag-entity-detail [tagEntity]="tagKey" (lastTagValueDeleted)="lastTagValueDeleted(tagKey)">
        </li-tag-entity-detail>
      }
    </fl-infinite-scroll>
  </fl-card-body>
</fl-card>
