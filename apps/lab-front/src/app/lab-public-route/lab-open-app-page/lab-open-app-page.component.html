<div class="container">
  <rv-app-progress
    [status]="displayStatus()"
    [statusText]="errorMessageKey() ? (errorMessageKey()! | translate) : statusText()"
  ></rv-app-progress>

  <!-- No Retry on a terminal error: the app does not exist, so retrying would just fail again. -->
  @if (status() === 'STOPPED' && !errorMessageKey()) {
    <button mat-flat-button type="button" class="primary retry" (click)="retry()">
      {{ 'g.open_app_retry' | translate }}
    </button>
  }
</div>
