<button mat-stroked-button type="button"
        class="g-button-small" [matMenuTriggerFor]="menu" (click)="stopPropagation($event)"
        *ngIf="mode === 'text';else icon">
  {{'biox.view_settings' | translate}}
</button>

<ng-template #icon>
  <button mat-icon-button [matMenuTriggerFor]="menu" (click)="stopPropagation($event)"
          [matTooltip]="'biox.view_settings' | translate">
    <mat-icon>more_vert</mat-icon>
  </button>
</ng-template>

<mat-menu #menu="matMenu" xPosition="before">

  <ng-content></ng-content>

  <button mat-menu-item type="button" *ngIf="tags" (click)="openTagFormDialog()">
    <mat-icon>local_offer</mat-icon>
    <span>{{'biox.update_view_tags' | translate }}</span>
  </button>

  <button mat-menu-item type="button" (click)="openUpdateName()">
    <mat-icon>edit</mat-icon>
    <span>{{'biox.update_view_config_title' | translate}}</span>
  </button>

  <button mat-menu-item type="button" (click)="openSelectReport()">
    <mat-icon flIcon="report"></mat-icon>
    <span>{{'biox.add_view_to_report' | translate}}</span>
    <fl-button-loader *ngIf="addToReportIsLoading"></fl-button-loader>
  </button>

  <button mat-menu-item type="button" (click)="showViewConfig()">
    <mat-icon>settings</mat-icon>
    <span>{{'biox.show_view_config' | translate}}</span>
  </button>

  <button mat-menu-item type="button" (click)="downloadViewJsonFile()">
    <mat-icon>cloud_download</mat-icon>
    <span>{{'biox.download_view_json_file' | translate}}</span>
  </button>

  <a mat-menu-item type="button" target="_blank"
     [routerLink]="viewRoute.route" [queryParams]="viewRoute.queryParams">
    <mat-icon>open_in_new</mat-icon>
    <span>{{'biox.open_in_new_tab' | translate}}</span>
  </a>
</mat-menu>
