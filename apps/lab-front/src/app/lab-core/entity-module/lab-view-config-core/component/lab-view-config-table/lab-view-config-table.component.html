<mat-table mat-table [dataSource]="datasource">

  <!-- Title -->
  <ng-container matColumnDef="title">
    <mat-header-cell *matHeaderCellDef>
      <span> {{'title' | translate}}</span>
    </mat-header-cell>
    <mat-cell *matCellDef="let viewConfig">
      <div class="g-layout-row g-layout-start-center">
        <rv-view-type-image [viewType]="viewConfig.viewType" size="2em"
                            class="view-image" [viewTypesInfos]="labConstResourceViewTypeInfos"></rv-view-type-image>
        <div>{{viewConfig.title}}</div>
      </div>
    </mat-cell>
  </ng-container>

  <!-- Resource -->
  <ng-container matColumnDef="resource">
    <mat-header-cell *matHeaderCellDef>
      <span>{{'resource' | translate}}</span>
    </mat-header-cell>
    <mat-cell *matCellDef="let viewConfig">
      <div>
        <div class="name">{{viewConfig.resource.name}}</div>
        <fl-text-icon class="g-text-tiny g-text-light" *ngIf="viewConfig.experiment"
                      gap="0">
          <mat-icon flIcon="experiment" class="g-icon-tiny"></mat-icon>
          {{viewConfig.experiment.title}}
        </fl-text-icon>
      </div>
    </mat-cell>
  </ng-container>

  <!-- Tags -->
  <ng-container matColumnDef="tags">
    <mat-header-cell *matHeaderCellDef>
      <span> {{'tags' | translate}}</span>
    </mat-header-cell>
    <mat-cell *matCellDef="let resource" class="tags">
      <lab-tag-list [tags]="resource | labGetEntityTags"
                   [tagSelectable]="tagSelectable" (tagSelected)="onTagSelected($event)"></lab-tag-list>
    </mat-cell>
  </ng-container>

  <!-- Datetime -->
  <ng-container matColumnDef="lastModifiedAt">
    <mat-header-cell *matHeaderCellDef>
      <span>{{'biox.view_config_date' | translate}}</span>
    </mat-header-cell>
    <mat-cell *matCellDef="let viewConfig">
      <fl-user-with-date [user]="viewConfig.lastModifiedBy" [date]="viewConfig.lastModifiedAt"></fl-user-with-date>
    </mat-cell>
  </ng-container>

  <!-- Preview -->
  <ng-container matColumnDef="preview">
    <mat-header-cell *matHeaderCellDef class="g-table-icon-button-cell">
    </mat-header-cell>
    <mat-cell *matCellDef="let viewConfig" class="g-table-icon-button-cell">

      <lab-view-config-preview [viewConfigId]="viewConfig.id"></lab-view-config-preview>
    </mat-cell>
  </ng-container>

  <!-- Flagged -->
  <ng-container matColumnDef="flagged">
    <mat-header-cell *matHeaderCellDef class="g-table-icon-button-cell">
    </mat-header-cell>
    <mat-cell *matCellDef="let viewConfig" class="g-table-icon-button-cell">
      <lab-view-config-favorite [viewConfig]="viewConfig"></lab-view-config-favorite>
    </mat-cell>
  </ng-container>

  <!-- Action -->
  <ng-container matColumnDef="action">
    <mat-header-cell *matHeaderCellDef class="g-table-icon-button-cell">
    </mat-header-cell>
    <mat-cell *matCellDef="let viewConfig" class="g-table-icon-button-cell">

      <lab-view-config-actions-menu [viewConfig]="viewConfig"
                                    (update)="onUpdate($event)"
                                    mode="icon">
      </lab-view-config-actions-menu>
    </mat-cell>
  </ng-container>

  <mat-header-row *matHeaderRowDef="columns; sticky: true"></mat-header-row>


  <!-- Mode selectable -->
  <ng-container *ngIf="selectableRow; else notSelectable">
    <mat-row *matRowDef="let row; columns: columns;" class="g-table-row-selectable"
             (click)="rowClicked(row)">
    </mat-row>
  </ng-container>

  <!-- Mode link -->
  <ng-template #notSelectable>
    <mat-row *matRowDef="let row; columns: columns;" class="g-table-row-selectable"
             (click)="navigateToViewConfigPage(row)">
    </mat-row>
  </ng-template>


</mat-table>
