<fl-form-field>
  <lab-select-note-template
    [formControl]="formCtrl"
    [placeholder]="placeholder"
  [required]="required"></lab-select-note-template>

  @if (formCtrl.hasError('required')) {
    <mat-error class="g-warn-text g-text-small">
      {{ placeholder | flErrorRequired }}
    </mat-error>
  }

  @if (hint) {
    <mat-hint>{{ hint }}</mat-hint>
  }
</fl-form-field>
