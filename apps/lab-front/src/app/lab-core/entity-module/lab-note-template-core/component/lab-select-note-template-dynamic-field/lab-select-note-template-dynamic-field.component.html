<fl-form-field>
  <lab-select-note-template
    [formControl]="formCtrl"
    [placeholder]="placeholder"
    [required]="required"></lab-select-note-template>

  <mat-error class="g-warn-text g-text-small" *ngIf="formCtrl.hasError('required')">
    {{ placeholder | flErrorRequired }}
  </mat-error>

  <mat-hint *ngIf="hint">{{ hint }}</mat-hint>
</fl-form-field>
