<fl-dialog-header>
  {{ title | translate }}
</fl-dialog-header>

<mat-dialog-content>
  <form (ngSubmit)="submit()" id="doc-template-form" [formGroup]="formGp">
    <!--  Title  -->
    <mat-form-field class="g-form-input">
      <mat-label>{{ 'title' | translate }}</mat-label>
      <input
        matInput
        formControlName="title"
        required
        flInputMaxLength="255"
        placeholder="{{ 'title' | translate }}" />
      <mat-error *ngIf="formGp.get('title').hasError('required')">
        {{ 'title' | flErrorRequired }}
      </mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-flat-button color="primary" type="submit" form="doc-template-form" class="g-centered-forced">
    {{ 'save' | translate }}
    <fl-button-loader *ngIf="isLoading"></fl-button-loader>
  </button>
</div>
