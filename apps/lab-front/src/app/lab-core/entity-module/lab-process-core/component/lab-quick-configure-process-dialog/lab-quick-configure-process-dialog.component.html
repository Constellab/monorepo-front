<fl-dialog-header>
  {{ input.title | flTranslatableText | async }}
</fl-dialog-header>

<mat-dialog-content>
  @if (input.helpText) {
    <p class="help-text">{{ input.helpText | flTranslatableText | async }}</p>
  }
  <fl-section [object]="formGp" [isLoading]="getIsLoading">
    <ng-container *flSectionBody>
      <form (ngSubmit)="submit()" id="upload-scenario-from-link" [formGroup]="formGp">
        <fl-dynamic-abstract-form [control]="formGp" [config]="dataConfig"></fl-dynamic-abstract-form>
      </form>
    </ng-container>
  </fl-section>
</mat-dialog-content>

<div mat-dialog-actions>
  <button
    mat-flat-button
    color="primary"
    type="submit"
    form="upload-scenario-from-link"
    class="g-centered-forced">
    {{ 'save' | translate }}
  </button>
</div>
