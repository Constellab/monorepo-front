<fl-text-icon>
  <mat-icon flIcon="folder"></mat-icon>

  <div class="container" *ngIf="value; else noFolder" (click)="openPortal($event)">
    <lab-folder-inline [folder]="value"></lab-folder-inline>
  </div>

  <ng-template #noFolder>
    <button
      mat-stroked-button
      type="button"
      [disabled]="disabled"
      (click)="openPortal($event)"
      class="g-button-small">
      {{ 'biox.select_folder' | translate }}
    </button>
  </ng-template>
</fl-text-icon>
