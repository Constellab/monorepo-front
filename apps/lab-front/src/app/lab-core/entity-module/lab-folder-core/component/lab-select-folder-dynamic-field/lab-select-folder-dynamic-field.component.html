<fl-form-field>
  <div>{{placeholder}}</div>
  <lab-folder-inline-select
    [formControl]="formCtrl"
    [placeholder]="{ text: placeholder, translateText: false }"
    [required]="required"></lab-folder-inline-select>

  @if (formCtrl.hasError('required')) {
    <mat-error class="g-warn-text g-text-small">{{ placeholder | flErrorRequired:false }}</mat-error>
  }

  @if (hint) {
    <mat-hint class="g-text-small">{{ hint }}</mat-hint>
  }
</fl-form-field>
