<fl-form-field>
  <lab-select-credentials
    [formControl]="formCtrl"
    [type]="type"
    [placeholder]="{ text: placeholder, translateText: false }"
    [required]="required"></lab-select-credentials>

  @if (formCtrl.hasError('required')) {
    <mat-error class="g-warn-text g-text-small">
      {{ 'biox.select_credentials' | flErrorRequired }}
    </mat-error>
  }

  @if (hint) {
    <mat-hint class="g-text-small">{{ hint }}</mat-hint>
  }
  <mat-hint class="g-text-small g-text-link">
    <a [routerLink]="credentialsRoute" target="_blank">{{ 'biox.manage_credentials' | translate }}</a>
  </mat-hint>
</fl-form-field>
