<fl-form-field>
  <lab-select-credentials [formControl]="formCtrl" [type]="type"
                          [placeholder]="placeholder"
                          [required]="required"></lab-select-credentials>

  <mat-error class="g-warn-text g-text-small"
             *ngIf="formCtrl.hasError('required')">
    {{'biox.select_credentials' | flErrorRequired}}
  </mat-error>

  <mat-hint *ngIf="hint">{{hint}}</mat-hint>
  <mat-hint class="g-text-small g-text-link">
    <a [routerLink]="credentialsRoute">{{'biox.manage_credentials' | translate}}</a>
  </mat-hint>

</fl-form-field>
