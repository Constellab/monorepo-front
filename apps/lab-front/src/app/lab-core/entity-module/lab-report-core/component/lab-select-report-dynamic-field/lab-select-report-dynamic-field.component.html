<fl-form-field>
  <lab-select-report [formControl]="formCtrl"
                     [placeholder]="placeholder"
                     [required]="required"></lab-select-report>

  <mat-error class="g-warn-text g-text-small"
             *ngIf="formCtrl.hasError('required')">
    {{placeholder | flErrorRequired}}
  </mat-error>

  <mat-hint *ngIf="hint">{{hint}}</mat-hint>

</fl-form-field>
