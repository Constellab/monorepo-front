<fl-form-field>
  <lab-select-scenario
    [formControl]="formCtrl"
    [placeholder]="{ text: placeholder, translateText: false }"
    [required]="required"></lab-select-scenario>

  @if (formCtrl.hasError('required')) {
    <mat-error class="g-warn-text g-text-small">{{ 'biox.scenario_select' | flErrorRequired }}</mat-error>
  }

  @if (hint) {
    <mat-hint class="g-text-small">{{ hint }}</mat-hint>
  }
</fl-form-field>
