<fl-search class="g-full-height">

  <!-- Advanced section in the right in a drawer -->
  <fl-search-advanced-form>
    <lab-scenario-template-search-form></lab-scenario-template-search-form>
  </fl-search-advanced-form>


  <!--  Center header  -->
  <fl-search-header>
    <fl-text-icon>
      <mat-icon flIcon="scenario_template"></mat-icon>
      <h2>{{'biox.scenario_templates' | translate}}</h2>
    </fl-text-icon>

    <fl-search-header-actions>
      <!--   Import scenario template     -->
      <fl-input-file-icon-container [matTooltip]="'biox.import_scenario_template' | translate"
                                    icon="upload_file" color="accent">
        <input flInputFile [multiple]="false" type="file" accept="application/json"
               (fileChange)="createFromFile($any($event))" [autoClearHtmlInput]="true">
      </fl-input-file-icon-container>
    </fl-search-header-actions>
  </fl-search-header>


  <fl-search-result>
    <lab-scenario-template-table [datasource]="datasource" [rowSelectable]="rowSelectable"
                                 (templateSelected)="selectTemplate($event)"></lab-scenario-template-table>
  </fl-search-result>


</fl-search>
