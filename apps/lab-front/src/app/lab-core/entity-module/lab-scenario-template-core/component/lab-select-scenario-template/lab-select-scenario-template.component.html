<fl-input-search
  [selectedItem]="selectedTemplate"
  (selectedItemChange)="setAndEmitValue($event)"
  [datasource]="datasource"
  [placeholder]="placeholder"
  [required]="required"
  [disabled]="disabled"
  [minInputSearchLength]="0"
  [advancedButton]="advancedButton">
  <div class="photo" *flInputSearchPrefix="datasource as scenarioTemplate">
    <fl-user-profile-picture
      *ngIf="scenarioTemplate"
      [user]="scenarioTemplate.createdBy"
      size="small"></fl-user-profile-picture>
  </div>

  <lab-scenario-template-inline
    *flInputSearchOption="datasource as scenarioTemplate"
    [scenarioTemplate]="scenarioTemplate">
  </lab-scenario-template-inline>
</fl-input-search>
