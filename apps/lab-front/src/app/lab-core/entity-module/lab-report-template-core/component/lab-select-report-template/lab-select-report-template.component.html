<fl-input-search [selectedItem]="selectedReportTemplate"
                 (selectedItemChange)="setAndEmitValue($event)"
                 [datasource]="datasource"
                 [placeholder]="placeholder"
                 [required]="required"
                 [disabled]="disabled"
                 [minInputSearchLength]="0"
                 [advancedButton]="advancedButton">

  <div class="photo" *flInputSearchPrefix="datasource as reportTemplate">
    <fl-user-profile-picture *ngIf="reportTemplate" [user]="reportTemplate.createdBy"
                             size="small"></fl-user-profile-picture>

  </div>


  <lab-report-template-inline *flInputSearchOption="datasource as reportTemplate" [reportTemplate]="reportTemplate">
  </lab-report-template-inline>
</fl-input-search>
