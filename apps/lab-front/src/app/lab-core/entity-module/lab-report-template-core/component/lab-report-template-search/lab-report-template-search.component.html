<fl-search class="g-full-height">

  <!-- Advanced section in the right in a drawer -->
  <fl-search-advanced-form>
    <lab-report-template-search-form></lab-report-template-search-form>
  </fl-search-advanced-form>


  <!--  Center header  -->
  <fl-search-header>
    <fl-text-icon>
      <mat-icon flIcon="report"></mat-icon>
      <h2>{{'biox.report_templates' | translate}}</h2>
    </fl-text-icon>
  </fl-search-header>


  <fl-search-result>
    <lab-report-template-table [datasource]="datasource"
                               [rowSelectable]="reportTemplateSelectable"
                               (reportTemplateSelected)="selectReport($event)"></lab-report-template-table>
  </fl-search-result>

</fl-search>
