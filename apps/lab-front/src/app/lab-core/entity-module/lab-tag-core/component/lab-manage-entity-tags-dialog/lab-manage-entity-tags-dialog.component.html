<fl-dialog-header>
  <fl-text-icon>
    <mat-icon>local_offer</mat-icon>
    {{ 'tags' | translate }}
  </fl-text-icon>
</fl-dialog-header>

<mat-dialog-content>
  <!-- Existing/Delete section -->
  <h2>{{ 'existing_tags' | translate }}</h2>
  <lab-tag-list
    [tags]="currentTags"
    class="tag-list"
    mode="edit"
    [showNoTagMessage]="true"
    (tagDeleted)="deleteExistingTag($event)"></lab-tag-list>

  <mat-divider class="divider"></mat-divider>

  <!-- Add section -->
  <h2>{{ 'add_tags_to_entity' | translate }}</h2>

  <fl-add-tag-input class="section" (addTag)="addTag($event)"></fl-add-tag-input>

  <lab-tag-list
    [tags]="newTags"
    class="tag-list"
    mode="edit"
    (tagDeleted)="removeNewTag($event)"></lab-tag-list>

  <mat-checkbox [(ngModel)]="isPropagable" class="section">
    {{ 'propagate_tags' | translate }}
  </mat-checkbox>

  <button
    mat-flat-button
    type="button"
    (click)="saveTags()"
    class="g-centered-forced add-button primary">
    {{ 'add_tags_to_entity' | translate }}
  </button>
</mat-dialog-content>
