<mat-expansion-panel [expanded]="true">

  <mat-expansion-panel-header>
    <mat-panel-title>
      {{'tags' | translate}}
    </mat-panel-title>
  </mat-expansion-panel-header>

  <fl-tag-list [tags]="selectedTags" class="g-text-small"
               [showDeleteIcon]="true"
               (tagDeleted)="removeTag($event)"></fl-tag-list>

  <fl-add-tag-input class="global-input" (addTag)="addTag($event)"
                    [allowUnknownTag]="false"></fl-add-tag-input>

  <fl-infinite-scroll [datasource]="tagKeys" class="tag-key-list g-infinite-table"
                      textNoMoreResult="">
    <div class="g-layout-row-wrap g-layout-gap-05em g-text-small">
      <ng-container *ngFor="let tagKey of tagKeys | flDatasourceConnect | async">

        <fl-tag class="chip" [flTag]="{'key': tagKey.key}" (click)="onKeyClick(tagKey)"></fl-tag>
      </ng-container>

    </div>
  </fl-infinite-scroll>
</mat-expansion-panel>
