<div class="g-full-height g-max-article-width container g-layout-col">
  @if (view.data.title) {
    <h2 class="title">{{ view.data.title }}</h2>
  }
  <te-text-editor
    [(ngModel)]="richText"
    [disabled]="true"
    class="text-editor g-scrollable-element"
    [config]="textEditorConfig"></te-text-editor>
</div>
