<fl-search class="g-full-height drop-zone" flDragHover="drag-file-hover" (flDrop)="onFileDrop($event)">
  <!-- Advanced section in the right in a drawer -->
  <fl-search-advanced-form>
    <lab-resource-search-form></lab-resource-search-form>
  </fl-search-advanced-form>

  <!--  Center header  -->
  <fl-search-header>
    <fl-text-icon>
      <mat-icon flIcon="resource"></mat-icon>
      <h2>{{ 'resources' | translate }}</h2>
    </fl-text-icon>

    <fl-search-header-actions class="g-layout-row">
      <!--   Upload files     -->
      <fl-input-file-icon-container
        [matTooltip]="'databox.upload_file' | translate"
        icon="upload_file"
        class="upload-button"
        color="accent">
        <input
          flInputFile
          [multiple]="true"
          type="file"
          (fileChange)="openUploadFiles($event)"
          [(ngModel)]="files" />
      </fl-input-file-icon-container>

      <!--   Upload folders     -->
      <fl-input-file-icon-container
        [matTooltip]="'databox.upload_folder' | translate"
        icon="drive_folder_upload"
        class="upload-button"
        color="accent">
        <input
          flInputFile
          type="file"
          (fileChange)="openUploadFolder($event)"
          [multiple]="true"
          [(ngModel)]="files"
          webkitdirectory
          mozdirectory
          [strictMode]="false" />
      </fl-input-file-icon-container>

      <button
        mat-icon-button
        type="button"
        color="accent"
        (click)="openImportFromUrlDialog()"
        [matTooltip]="'biox.import_resource_from_link' | translate">
        <mat-icon>cloud_download</mat-icon>
      </button>
    </fl-search-header-actions>
  </fl-search-header>

  <fl-search-result>
    <lab-resource-table
      class="card-table"
      [datasource]="datasource"
      [columns]="columns"
      [selectableRow]="resourceSelectable"
      (resourceSelected)="selectResource($event)"
      (tagSelected)="searchOnTag($event)"></lab-resource-table>

    <div class="drop-info g-layout-col g-layout-center-center g-text-centered">
      <mat-icon>upload_file</mat-icon>
      <div class="g-text-big">{{ 'databox.upload_file_drop' | translate }}</div>
    </div>
  </fl-search-result>
</fl-search>
