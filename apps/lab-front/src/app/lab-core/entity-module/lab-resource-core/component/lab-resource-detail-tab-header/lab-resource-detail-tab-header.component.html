<div *ngIf="isLoading; else notLoading"
     class="g-layout-row g-layout-start-center">
  {{'biox.resource_tab_loading' | translate}}
  <fl-loader [size]="20" class="loader"></fl-loader>
</div>

<ng-template #notLoading>

  <div (auxclick)="onTabClick($event)"
       class="parent g-layout-row g-layout-start-center">
    <ng-container *ngIf="isError; else notError">{{'biox.resource_tab_error' | translate}}</ng-container>
    <ng-template #notError>
      <mat-icon [flIcon]="icon"></mat-icon>
      <div>{{title}}</div>
    </ng-template>

    <button mat-icon-button (click)="closeTab()" class="g-button-icon-small" *ngIf="showCloseButton">
      <mat-icon>close</mat-icon>
    </button>
  </div>

</ng-template>
