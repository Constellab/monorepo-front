<fl-dialog-header>
  {{ 'biox.update_resource_type' | translate }}
</fl-dialog-header>

<mat-dialog-content>
  <p class="g-text-light help-text">{{ 'biox.update_resource_type_help' | translate }}</p>

  <fl-async-section [object]="fsNodeTypes">
    <ng-container *flSectionBody="fsNodeTypes as fileTypes">
      <form (ngSubmit)="submit()" id="resource-type-form">
        <!--  File type  -->
        <mat-form-field class="g-form-input">
          <mat-label>{{ 'biox.resource_type' | translate }}</mat-label>
          <mat-select
            [formControl]="formControl"
            placeholder="{{ 'biox.resource_type' | translate }}"
            required>
            @for (fileType of fileTypes; track fileType) {
              <mat-option [value]="fileType.typingName">
                {{ fileType.name }}
              </mat-option>
            }
          </mat-select>
          @if (formControl.hasError('required')) {
            <mat-error>
              {{ 'biox.resource_type' | flErrorRequired }}
            </mat-error>
          }
        </mat-form-field>
      </form>
    </ng-container>
  </fl-async-section>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-flat-button type="submit" form="resource-type-form" class="g-centered-forced primary">
    {{ 'save' | translate }}
    @if (isLoading) {
      <fl-button-loader></fl-button-loader>
    }
  </button>
</div>
