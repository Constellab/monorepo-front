<div class="container g-scrollable-element">
  @if (dataSource) {
    <mat-tree [dataSource]="dataSource" [treeControl]="treeControl">
      <mat-tree-node
        *matTreeNodeDef="let node"
        [matTreeNodePadding]="node.level"
        [matTreeNodePaddingIndent]="20">
        <div
          class="leaf-container node-container g-layout-row-wrap g-layout-start-center"
          (contextmenu)="openMenu(node, $event)">
          <span>{{ node.name }}</span>
          @if (node.isLoading) {
            <fl-loader size="small" class="loader"></fl-loader>
          }
          @if (!node.isLoading) {
            <button mat-icon-button class="g-button-icon-tiny action-button" (click)="openMenu(node, $event)">
              <mat-icon>more_vert</mat-icon>
            </button>
          }
        </div>
      </mat-tree-node>
      <!-- This is the tree node template for expandable nodes -->
      <mat-tree-node
        *matTreeNodeDef="let node; when: hasChild"
        [matTreeNodePadding]="node.level"
        [matTreeNodePaddingIndent]="20">
        <div matTreeNodeToggle class="g-layout-row g-layout-start-center">
          <!--      Arrow icon      -->
          <mat-icon>{{ treeControl.isExpanded(node) ? 'arrow_drop_down' : 'arrow_right' }}</mat-icon>
          <div
            class="node-container g-layout-row-wrap g-layout-start-center"
            (contextmenu)="openMenu(node, $event)">
            <span>{{ node.name }}</span>
            @if (node.isLoading) {
              <fl-loader size="small" class="loader"></fl-loader>
            }
            @if (!node.isLoading) {
              <button
                mat-icon-button
                class="g-button-icon-tiny action-button"
                (click)="openMenu(node, $event)">
                <mat-icon>more_vert</mat-icon>
              </button>
            }
          </div>
        </div>
      </mat-tree-node>
    </mat-tree>
  }
</div>
