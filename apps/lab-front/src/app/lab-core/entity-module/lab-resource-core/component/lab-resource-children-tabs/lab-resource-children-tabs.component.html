<div class="container g-layout-row-wrap g-layout-start-center g-layout-gap-05em">
  <div class="card g-text-small" matRipple (click)="selectResource(resource())"
       [ngClass]="{'selected-card': resource()?.id === selectedResource()?.id}">
    {{resource().name}}
  </div>

  <div *ngFor="let child of children()" class="card g-text-small" matRipple
       (click)="selectResource(child)"
       [ngClass]="{'selected-card': child.id === selectedResource()?.id}">
    {{child.name}}
  </div>
</div>
