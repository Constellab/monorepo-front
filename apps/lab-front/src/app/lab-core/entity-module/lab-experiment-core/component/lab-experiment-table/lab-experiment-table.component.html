<mat-table mat-table [dataSource]="datasource" class="table">


  <!-- Title -->
  <ng-container matColumnDef="title">
    <mat-header-cell *matHeaderCellDef class="g-cell-header-with-left-border">
      <span> {{ 'title' | translate }}</span>
    </mat-header-cell>
    <mat-cell *matCellDef="let experiment" class="g-cell-with-left-border"
              [style.border-left-color]="experiment.project?.id | flStringToRgb">
      <div>
        <div class="title">{{ experiment.title }}</div>
        <fl-text-icon class="g-text-tiny g-text-light" *ngIf="experiment.project"
                      gap="0">
          <mat-icon flIcon="project" class="g-icon-tiny"></mat-icon>
          {{ experiment.project.title }}
        </fl-text-icon>
      </div>
    </mat-cell>
  </ng-container>

  <!-- score-->
  <ng-container matColumnDef="score">
    <mat-header-cell *matHeaderCellDef>
      <span>{{ 'biox.score' | translate }}</span>
    </mat-header-cell>
    <mat-cell *matCellDef="let experiment">
      <span>{{ experiment.score }}</span>
    </mat-cell>
  </ng-container>

  <!-- Status -->
  <ng-container matColumnDef="status">
    <mat-header-cell *matHeaderCellDef>
      <span>{{ 'status' | translate }}</span>
    </mat-header-cell>
    <mat-cell *matCellDef="let experiment">
      <mat-icon *ngIf="experiment.isValidated"
                [matTooltip]="'biox.experiment_validated' | translate"
                class="status-icon" flIcon="validated">
      </mat-icon>

      <mat-icon *ngIf="experiment.isArchived"
                [matTooltip]="'biox.experiment_archived' | translate"
                class="status-icon" flIcon="archive">
      </mat-icon>

      <fl-status-chip [status]="experiment.status" mode="iconText" size="small">
      </fl-status-chip>
    </mat-cell>
  </ng-container>

  <!-- Created -->
  <ng-container matColumnDef="createdAt">
    <mat-header-cell *matHeaderCellDef>
      <span>{{ 'creation_info' | translate }}</span>
    </mat-header-cell>
    <mat-cell *matCellDef="let experiment">
      <fl-user-with-date [user]="experiment.createdBy" [date]="experiment.createdAt"></fl-user-with-date>
    </mat-cell>
  </ng-container>

  <!-- Tags -->
  <ng-container matColumnDef="tags">
    <mat-header-cell *matHeaderCellDef class="g-column-width-2">
      <span> {{ 'tags' | translate }}</span>
    </mat-header-cell>
    <mat-cell *matCellDef="let experiment" class="g-column-width-2 tags">
      @defer (on viewport) {
        <lab-tag-list [tags]="experiment | labGetEntityTags"
                      [tagSelectable]="true"></lab-tag-list>
      } @placeholder {
        <div></div>
      }
    </mat-cell>
  </ng-container>

  <!-- Unlinked experiment -->
  <ng-container matColumnDef="unlinked">
    <mat-header-cell *matHeaderCellDef class="g-table-icon-button-cell">
    </mat-header-cell>
    <mat-cell *matCellDef="let experiment" class="g-table-icon-button-cell">
      <button mat-icon-button type="button" (click)="unlinkedExperiment(experiment, $event)"
              [matTooltip]="'biox.report_unlinked_experiment' | translate">
        <mat-icon>clear</mat-icon>
      </button>
    </mat-cell>
  </ng-container>

  <mat-header-row *matHeaderRowDef="columns; sticky: true"></mat-header-row>

  <!-- Mode selectable -->
  <ng-container *ngIf="rowSelectable; else notSelectable">
    <mat-row *matRowDef="let row; columns: columns;" class="g-table-row-selectable"
             (click)="rowClicked(row)">
    </mat-row>
  </ng-container>

  <!-- Mode link -->
  <ng-template #notSelectable>
    <mat-row *matRowDef="let row; columns:columns;" class="g-table-row-selectable"
             [routerLink]="row | labDetailRoute">
    </mat-row>
  </ng-template>
</mat-table>
