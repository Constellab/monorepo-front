<mat-table mat-table [dataSource]="datasource">


  <!-- Title -->
  <ng-container matColumnDef="title">
    <mat-header-cell *matHeaderCellDef class="g-cell-header-with-left-border">
      <span> {{ 'title' | translate }}</span>
    </mat-header-cell>
    <mat-cell *matCellDef="let experiment" class="g-cell-with-left-border"
              [style.border-left-color]="experiment.project?.id | flStringToRgb">

      <!--    Invisible link  -->
      <a *ngIf="!rowSelectable" [routerLink]="experiment | labDetailRoute"
         [target]="rowLinkTarget" class="g-row-link"></a>

      <div>
        <div class="text g-text-dense-height">{{ experiment.title }}</div>

        @if (experiment.project) {
          <fl-text-icon class="g-text-tiny g-text-light project" gap="3px">
            <mat-icon flIcon="project" class="g-icon-tiny"></mat-icon>
            <div class="text g-text-dense-height">{{ experiment.project.title }}</div>
          </fl-text-icon>
        }
      </div>
    </mat-cell>
  </ng-container>

  <!-- Status -->
  <ng-container matColumnDef="status">
    <mat-header-cell *matHeaderCellDef>
      <span>{{ 'status' | translate }}</span>
    </mat-header-cell>
    <mat-cell *matCellDef="let experiment">
      <fl-status-chip [status]="experiment.status" mode="iconText" size="small">
      </fl-status-chip>

      <mat-icon *ngIf="experiment.isValidated"
                [matTooltip]="'biox.experiment_validated' | translate"
                class="status-icon over-link" flIcon="validated">
      </mat-icon>

      <mat-icon *ngIf="experiment.isArchived"
                [matTooltip]="'biox.experiment_archived' | translate"
                class="status-icon over-link" flIcon="archive">
      </mat-icon>

      <mat-icon *ngIf="experiment.isAuto()"
                [matTooltip]="'biox.experiment_creation_type_help_AUTO' | translate"
                class="status-icon over-link">
        smart_toy
      </mat-icon>

    </mat-cell>
  </ng-container>

  <!-- Created -->
  <ng-container matColumnDef="createdAt">
    <mat-header-cell *matHeaderCellDef>
      <span>{{ 'creation_info' | translate }}</span>
    </mat-header-cell>
    <mat-cell *matCellDef="let experiment">
      <fl-user-with-date [user]="experiment.createdBy" [date]="experiment.createdAt"
                         class="over-link"></fl-user-with-date>
    </mat-cell>
  </ng-container>

  <!-- Tags -->
  <ng-container matColumnDef="tags">
    <mat-header-cell *matHeaderCellDef class="g-column-width-2">
      <span> {{ 'tags' | translate }}</span>
    </mat-header-cell>
    <mat-cell *matCellDef="let experiment" class="g-column-width-2">
      @defer (on viewport) {
        <lab-tag-list [tags]="experiment | labGetEntityTags"
                      [tagSelectable]="true"></lab-tag-list>
      } @placeholder {
        <div></div>
      }
    </mat-cell>
  </ng-container>

  <!-- Unlinked experiment -->
  <ng-container matColumnDef="unlinked">
    <mat-header-cell *matHeaderCellDef class="g-table-icon-button-cell">
    </mat-header-cell>
    <mat-cell *matCellDef="let experiment" class="g-table-icon-button-cell">
      <button mat-icon-button type="button" (click)="unlinkedExperiment(experiment, $event)"
              class=" over-link"
              [matTooltip]="'biox.report_unlink_experiment' | translate">
        <mat-icon>clear</mat-icon>
      </button>
    </mat-cell>
  </ng-container>

  <mat-header-row *matHeaderRowDef="columns; sticky: true"></mat-header-row>

  <mat-row *matRowDef="let row; columns: columns;" class="g-table-row-selectable g-row-link-container"
           (click)="rowClicked(row)">
  </mat-row>

</mat-table>
