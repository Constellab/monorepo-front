<fl-input-search [selectedItem]="selectedExperiment"
                 (selectedItemChange)="setAndEmitValue($event)"
                 [datasource]="datasource"
                 [placeholder]="'biox.experiment_select' | translate"
                 [required]="required"
                 [disabled]="disabled"
                 [minInputSearchLength]="0"
                 [advancedButton]="advancedButton">

  <div class="photo" *flInputSearchPrefix="datasource as experiment">
    <fl-user-profile-picture *ngIf="experiment" [user]="experiment.createdBy"
                             size="small"></fl-user-profile-picture>

  </div>

  <lab-experiment-inline *flInputSearchOption="datasource as experiment" [experiment]="experiment">
  </lab-experiment-inline>
</fl-input-search>
