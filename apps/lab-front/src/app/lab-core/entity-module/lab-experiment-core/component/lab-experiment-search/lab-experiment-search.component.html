<fl-search class="g-full-height">

  <!-- Advanced section in the right in a drawer -->
  <fl-search-advanced-form>
    <lab-experiment-search-form></lab-experiment-search-form>
  </fl-search-advanced-form>


  <!--  Center header  -->
  <fl-search-header>

    <fl-text-icon>
      <mat-icon flIcon="experiment"></mat-icon>
      <h2>{{ 'biox.biox' | translate }}</h2>
    </fl-text-icon>

    <fl-search-header-actions class="g-layout-row g-layout-start-center">
      <button mat-icon-button type="button" color="accent"
              [matTooltip]="'biox.new_experiment' | translate" matTooltipPosition="before"
              (click)="createExperiment()">
        <mat-icon>add</mat-icon>
      </button>
    </fl-search-header-actions>
  </fl-search-header>


  <fl-search-result>
    <lab-experiment-table [datasource]="datasource"
                          [rowSelectable]="experimentSelectable"
                          (experimentSelected)="selectExperiment($event)"
                          (tagSelected)="searchOnTag($event)"></lab-experiment-table>
  </fl-search-result>


</fl-search>
