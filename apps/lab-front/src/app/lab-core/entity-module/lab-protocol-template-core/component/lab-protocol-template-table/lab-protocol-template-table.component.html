<mat-table mat-table [dataSource]="datasource">

  <!-- Name -->
  <ng-container matColumnDef="name">
    <mat-header-cell *matHeaderCellDef>
      <span> {{ 'name' | translate }}</span>
    </mat-header-cell>
    <mat-cell *matCellDef="let template">
      <!--    Invisible link  -->
      <a *ngIf="!rowSelectable" [routerLink]="template | labDetailRoute"
         [target]="rowLinkTarget" class="g-row-link"></a>
      {{ template.name }}
    </mat-cell>
  </ng-container>

  <!-- Created -->
  <ng-container matColumnDef="created">
    <mat-header-cell *matHeaderCellDef>
      <span> {{ 'creation_info' | translate }}</span>
    </mat-header-cell>
    <mat-cell *matCellDef="let template">
      <fl-user-with-date [user]="template.createdBy" [date]="template.createdAt"></fl-user-with-date>
    </mat-cell>
  </ng-container>


  <!-- Tags -->
  <ng-container matColumnDef="tags">
    <mat-header-cell *matHeaderCellDef>
      <span> {{ 'tags' | translate }}</span>
    </mat-header-cell>
    <mat-cell *matCellDef="let template" class="tags">
      @defer (on viewport) {
        <lab-tag-list [tags]="template | labGetEntityTags"></lab-tag-list>
      } @placeholder {
        <div></div>
      }
    </mat-cell>
  </ng-container>

  <!-- Open in new tab -->
  <ng-container matColumnDef="openInNewTab">
    <mat-header-cell *matHeaderCellDef>
    </mat-header-cell>
    <mat-cell *matCellDef="let template">
      <a mat-stroked-button [routerLink]="template | labDetailRoute"
         target="_blank" class="g-button-small" (click)="openInNewTab($event)">
        {{ 'biox.open_in_new_tab' | translate }}
        <mat-icon>open_in_new</mat-icon>
      </a>
    </mat-cell>
  </ng-container>


  <mat-header-row *matHeaderRowDef="columns; sticky: true"></mat-header-row>

  <!-- Mode selectable -->
  <mat-row *matRowDef="let row; columns: columns;" class="g-table-row-selectable g-row-link-container"
           (click)="rowClicked(row)"></mat-row>


</mat-table>
