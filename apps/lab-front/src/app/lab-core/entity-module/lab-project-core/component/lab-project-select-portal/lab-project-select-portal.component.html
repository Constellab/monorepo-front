<fl-portal class="portal">
  <fl-portal-header>{{ 'biox.select_project' | translate }}</fl-portal-header>

  <fl-portal-content>

    <div *ngIf="helpText" class="help-text g-text-small g-text-light">{{ helpText | translate }}</div>

    <lab-project-select [(ngModel)]="projects" [multiple]="false"
                        (selectionChange)="projectSelected($any($event))"></lab-project-select>
  </fl-portal-content>
</fl-portal>
