<fl-text-icon>
  <mat-icon flIcon="project"></mat-icon>

  <div class="container" *ngIf="value; else noProject" (click)="openPortal($event)">
    <lab-project-inline [project]="value"></lab-project-inline>
  </div>

  <ng-template #noProject>
    <button mat-stroked-button type="button" [disabled]="disabled"
            (click)="openPortal($event)" class="g-button-small">
      {{'biox.select_project' | translate}}
    </button>
  </ng-template>
</fl-text-icon>
