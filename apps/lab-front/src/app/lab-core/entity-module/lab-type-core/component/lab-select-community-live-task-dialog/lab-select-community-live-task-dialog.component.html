<fl-dialog-header>
  {{ title | translate }}
</fl-dialog-header>

<mat-dialog-content>
  @if(liveTasks && liveTasks.length > 0){
    <div class="live-tasks-list-div">
      @for (liveTask of liveTasks; track liveTask.id) {
        <lt-live-task-list-item [liveTask]="liveTask" (click)="loadLiveTask(liveTask.id)" [backgroundColor]="'main'"></lt-live-task-list-item>
      }
    </div>
  }
</mat-dialog-content>
