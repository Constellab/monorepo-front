<mat-slide-toggle
  class="primary"
  [(ngModel)]="checked"
  [disabled]="disabled"
  (change)="toggleChange($event)"
  (click)="stopEventPropagation($event)">
  {{ 'g.dev_env_toggle' | translate }}
</mat-slide-toggle>

@if (showHelpMessage) {
  <div class="g-text-tiny g-text-light help-text">
    {{ 'g.dev_env_not_available' | translate }}
  </div>
}
