<fl-login-page [redirectionRoute]="appRoute">
  @if (isDevEnv) {
    <div class="g-text-light g-text-centered">
      {{ 'login_dev_env' | translate }}
    </div>

    <button mat-flat-button type="button" (click)="switchToProd()" class="g-centered-forced primary">
      {{ 'login_switch_to_prod' | translate }}
    </button>
  }
</fl-login-page>
