<div class="g-page-fixed g-layout-col">
  <fl-text-icon>
    <mat-icon flIcon="database"></mat-icon>
    <h2>{{ 'biota.biota' | translate }}</h2>
  </fl-text-icon>

  <lab-biota-database-search-form (search)="onSearch($event)"></lab-biota-database-search-form>

  <fl-async-section
    [arrayObs]="biotaDatasource"
    emptyText="biota.no_entry"
    class="g-flex-auto g-grow-max-height">
    <ng-container *flSectionBody>
      <div class="container g-layout-row g-layout-gap-1em">
        <lab-biota-database-table
          class="g-flex-auto table"
          [datasource]="biotaDatasource"
          [columns]="columns"
          (showDetail)="openDetail($event)"></lab-biota-database-table>

        <div flHide.xs class="max-height g-scrollable-element">
          <lab-biota-data-card
            class="g-full"
            *ngIf="selectedData"
            [biotaData]="selectedData"></lab-biota-data-card>
        </div>
      </div>
    </ng-container>
  </fl-async-section>
</div>
