<fl-async-section [arrayObs]="scenarios" emptyText="biox.no_note_linked_scenario">
  <fl-section-header>
    <h4 class="g-sidebar-group-title g-text-small">{{ 'biox.note_linked_scenario' | translate }}</h4>

    @if (canEdit) {
      <fl-section-actions>
        <button
          mat-icon-button
          type="button"
          [matTooltip]="'biox.note_link_scenario' | translate"
          (click)="linkScenario()">
          <mat-icon>add</mat-icon>
        </button>
      </fl-section-actions>
    }
  </fl-section-header>

  <ng-container *flSectionBody>
    <li-scenario-table
      [datasource]="scenarios"
      [columns]="columns"
      class="g-mat-table-main-background"
      (scenarioUnlink)="unlinkScenario($event)"></li-scenario-table>
  </ng-container>
</fl-async-section>
