<fl-sidebar-layout [hideOnPrint]="true">
  <fl-async-section class="async-section g-print-section" [object]="note$">
    <ng-container *flSectionBody="note$ as note">
      <div class="g-layout-row g-layout-start-center">
        @if (note.isValidated) {
          <mat-icon
            [matTooltip]="'biox.note_validated' | translate"
            class="g-icon-big status-icon"
            flIcon="validated">
          </mat-icon>
        }

        @if (note.isArchived) {
          <mat-icon
            [matTooltip]="'biox.note_archived' | translate"
            class="g-icon-big status-icon"
            flIcon="archive">
          </mat-icon>
        }

        <div class="g-flex-auto g-flex">
          <fl-text-icon>
            <mat-icon flIcon="note" class="g-icon-big"></mat-icon>
            <h1
              flElementEditable
              (flElementValueChange)="updateTitle($event)"
              class="title"
              [flElementDisabled]="!note.isEditable()">
              {{ note.title }}
            </h1>
          </fl-text-icon>
        </div>

        <li-sync-object-button
          [object]="note"
          [syncObjectFunc]="syncObjectFunc"
          additionalConfirmText="biox.sync_note_confirmation"
          (objectUpdate)="onNoteUpdate($event)"
          class="g-print-hide">
        </li-sync-object-button>

        <div class="g-print-hide action-buttons">
          <button mat-icon-button type="button" (click)="openActionMenu(note, $event)">
            <mat-icon>more_vert</mat-icon>
          </button>

          <fl-sidebar-toggle></fl-sidebar-toggle>
        </div>
      </div>

      <!--    Save status        -->
      <te-text-editor-save
        class="save-status g-print-hide"
        [textEditor]="textEditor"
        [saveFunc]="saveContentFunc"></te-text-editor-save>

      <te-text-editor
        #textEditor
        class="g-flex-auto g-print-section"
        [config]="textEditorConfig"
        [formControl]="formControl"></te-text-editor>
    </ng-container>
  </fl-async-section>

  <div sidebar>
    <fl-async-section [object]="note$">
      <ng-container *flSectionBody="note$ as note">
        <!--  Tags  -->
        <div class="sidebar-group">
          <h4 class="g-sidebar-group-title g-text-small">
            {{ 'li.tags' | translate }}
          </h4>

          <li-tag-list
            [tags]="tags"
            entityType="NOTE"
            [entityId]="note.id"
            [showNoTagMessage]="true"
            [enableDetails]="true"></li-tag-list>
        </div>

        <!--  Folder  -->
        <div class="sidebar-group">
          <h4 class="g-sidebar-group-title g-text-small">
            {{ 'li.folder' | translate }}
          </h4>

          <li-folder-inline-select
            [(ngModel)]="note.folder"
            (selectionChange)="updateFolder($event)"
            [disabled]="!note.isEditable()"
            updateFolderHelpText="biox.update_note_folder_help"></li-folder-inline-select>
        </div>

        <!--  Information  -->
        <div class="sidebar-group">
          <h4 class="g-sidebar-group-title g-text-small">
            {{ 'li.information' | translate }}
          </h4>

          @if (note.isValidated) {
            <li-object-validation-info [object]="note"></li-object-validation-info>
          }

          @if (note.isSynced) {
            <li-object-sync-info [object]="note" [class.separator]="note.isValidated"></li-object-sync-info>
          }

          <li-object-creation-info
            [object]="note"
            [class.separator]="note.isValidated || note.isSynced"></li-object-creation-info>
        </div>

        <!--  Linked scenarios  -->
        <lab-note-linked-scenarios class="sidebar-group"></lab-note-linked-scenarios>
      </ng-container>
    </fl-async-section>
  </div>
</fl-sidebar-layout>
