<div class="g-page page">
  <fl-async-section class="g-flex-auto" [object]="report$">

    <ng-container *flSectionBody="report$ as report">

      <div class="g-layout-row g-layout-start-center">
        <mat-icon [matTooltip]="'biox.report_validated' | translate"
                  class="g-icon-big status-icon" *ngIf="report.isValidated"
                  flIcon="validated">
        </mat-icon>

        <mat-icon [matTooltip]="'biox.report_archived' | translate"
                  class="g-icon-big status-icon" *ngIf="report.isArchived"
                  flIcon="archive">
        </mat-icon>

        <div class="g-flex-auto g-flex">
          <h2 flElementEditable (flElementValueChange)="updateTitle($event)"
              [flElementDisabled]="!report.isEditable()">{{report.title}}</h2>
        </div>

        <lab-sync-object-button [object]="report" [syncObjectFunc]="syncObjectFunc"
                                additionalConfirmText="biox.sync_report_confirmation"
                                (objectUpdate)="onReportUpdate($event)" class="g-print-hide">
        </lab-sync-object-button>

        <div class="g-print-hide action-buttons">
          <button mat-icon-button [matMenuTriggerFor]="menu">
            <mat-icon>more_vert</mat-icon>
          </button>
          <mat-menu #menu="matMenu" xPosition="before" class="g-print-hide">

            <ng-container *ngIf="report.isEditable()">
              <button mat-menu-item type="button" (click)="updateReport()">
                <mat-icon>edit</mat-icon>
                <span>{{'biox.update_report' | translate}}</span>
              </button>

              <button mat-menu-item type="button" [matTooltip]="'biox.validate_report' | translate"
                      (click)="validate()">
                <mat-icon flIcon="validated"></mat-icon>
                <span>{{'biox.validate_report' | translate}}</span>
              </button>
            </ng-container>

            <button mat-menu-item type="button" (click)="printReport()">
              <mat-icon>print</mat-icon>
              <span>{{'biox.print_report' | translate}}</span>
            </button>

            <button mat-menu-item type="button" (click)="createReportTemplate()">
              <mat-icon flIcon="report"></mat-icon>
              <span>{{'biox.create_report_template' | translate}}</span>
              <fl-button-loader *ngIf="createTemplateLoading"></fl-button-loader>
            </button>


            <button mat-menu-item type="button" (click)="archiveReport()">
              <mat-icon color="warn" [flIcon]="report.isArchived ? 'unarchive': 'archive'"></mat-icon>
              <span class="g-warn-text">
                {{report.isArchived ? 'biox.unarchive_report' : 'biox.archive_report' | translate}}
              </span>
            </button>

            <button mat-menu-item type="button"
                    (click)="delete()" *ngIf="report.isEditable()">
              <mat-icon color="warn">delete</mat-icon>
              <span class="g-warn-text">{{'biox.delete_report' | translate}}</span>
            </button>

          </mat-menu>
        </div>
      </div>

      <!--   Content   -->
      <fl-article-container>
        <fl-article-left-side>

          <!-- Tags -->
          <lab-tag-list entityType="REPORT" [entityId]="report.id"  [showNoTagMessage]="true"></lab-tag-list>


          <!--  Project  -->
          <lab-project-inline-select [(ngModel)]="report.project" (selectionChange)="updateProject($event)"
                                     [disabled]="!report.isEditable()" class="separator"></lab-project-inline-select>

          <!--  Validated info  -->
          <lab-object-validation-info class="separator" [object]="report"
                                      *ngIf="report.isValidated"></lab-object-validation-info>

          <!--  Sync info  -->
          <lab-object-sync-info class="separator" [object]="report" *ngIf="report.isSynced"></lab-object-sync-info>


          <!--  Created by & Last modified bt  -->
          <p class="g-text-small g-text-light separator">
            <fl-creation-info [user]="report.createdBy"
                              [date]="report.createdAt"></fl-creation-info>
          </p>
          <p class="g-text-small g-text-light">
            <fl-last-modification-info [user]="report.lastModifiedBy"
                                       [date]="report.lastModifiedAt"></fl-last-modification-info>
          </p>
        </fl-article-left-side>
        <fl-article>
          <fl-text-editor [(ngModel)]="content" mode="JSON" [disabled]="report.isValidated"
                          class="g-full-height g-print-section" scrollContainer="body"
                          (textChange)="onContentUpdate($event)" [config]="textEditorConfig"
                          [placeholder]="'biox.report_placeholder' | translate" [autoFocus]="true"></fl-text-editor>
        </fl-article>
        <fl-article-right-side class="experiments">

          <fl-card>
            <fl-card-body>
              <lab-report-associated-experiments></lab-report-associated-experiments>
            </fl-card-body>
          </fl-card>
        </fl-article-right-side>
      </fl-article-container>


    </ng-container>
  </fl-async-section>
</div>
