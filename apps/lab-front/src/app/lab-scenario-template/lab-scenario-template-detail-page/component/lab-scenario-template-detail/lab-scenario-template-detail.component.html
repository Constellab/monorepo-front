<fl-article-container class="container">
  <fl-article-left-side>
    <!--  Tags  -->
    <li-tag-list
      class="g-flex-auto"
      [tags]="tags$"
      [showNoTagMessage]="true"
      entityType="SCENARIO_TEMPLATE"
      [enableDetails]="true"
      [entityId]="template.id"></li-tag-list>

    <!--  Created by & Last modified bt  -->
    <p class="g-text-small g-text-light separator">
      <fl-creation-info [user]="template.createdBy" [date]="template.createdAt"></fl-creation-info>
    </p>
    <p class="g-text-small g-text-light">
      <fl-last-modification-info
        [user]="template.lastModifiedBy"
        [date]="template.lastModifiedAt"></fl-last-modification-info>
    </p>
  </fl-article-left-side>

  <fl-article>
    <te-text-editor-save
      [textEditor]="textEditor"
      [saveFunc]="saveDescriptionFunc"
      [debounceTime]="1000"
      class="editor-save"></te-text-editor-save>

    <te-text-editor
      #textEditor
      [config]="textEditorConfig"
      [formControl]="formControl"
      class="text-editor"
      [placeholder]="'biox.protocol_description_placeholder' | translate"></te-text-editor>
  </fl-article>
</fl-article-container>
