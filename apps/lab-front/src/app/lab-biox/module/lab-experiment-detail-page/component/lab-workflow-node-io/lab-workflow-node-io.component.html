<div *ngIf="resource$ | async as resourceEvent" class="resource-name"
     [ngClass]="'resource-' + mode" (click)="onResourceClick(resourceEvent)"
     fxLayout="column" fxLayoutAlign="start center">

  <div class="port-color" [style.background-color]="resourceEvent.port.getDefaultColor()"></div>
  <div *ngIf="text$ | async as text" class="text">
    {{text | flTranslatableText}}
  </div>

</div>
