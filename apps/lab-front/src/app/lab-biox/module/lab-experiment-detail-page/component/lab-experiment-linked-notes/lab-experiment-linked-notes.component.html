<fl-async-section [arrayObs]="notes" emptyText="biox.no_experiment_linked_note">

  <fl-section-header>
    <h3>{{'biox.experiment_linked_note' | translate}}</h3>

    <fl-section-actions>
      <button mat-icon-button type="button" [matTooltip]="'biox.experiment_link_note' | translate"
              (click)="linkExperiment()">
        <mat-icon>add</mat-icon>
      </button>
    </fl-section-actions>

  </fl-section-header>

  <ng-container *flSectionBody>
    <lab-note-table [datasource]="notes" [columns]="columns"
                      (noteUnlink)="unlinkNote($event)">
    </lab-note-table>
  </ng-container>
</fl-async-section>
