<form (ngSubmit)="submit()" id="process-config-form" [formGroup]="formGp" class="form g-layout-col">
  <fl-error-text *ngIf="!task.hasConfig()" [errorMessage]="'biox.no_config_for_task' | translate">
  </fl-error-text>

  <div class="g-flex-auto">
    <lab-configure-specs-form [configData]="task.config"></lab-configure-specs-form>
  </div>

  <div class="g-centered save">
    <button mat-flat-button color="primary" type="submit">
      <mat-icon>save</mat-icon>
      <span>{{'save' | translate}}</span>
    </button>
  </div>
</form>
