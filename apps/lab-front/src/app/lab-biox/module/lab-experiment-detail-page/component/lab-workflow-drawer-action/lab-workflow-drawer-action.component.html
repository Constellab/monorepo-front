<div class="drawer g-full-height g-layout-col"
     *ngIf="process$ | async as process">

  <div class="header g-layout-row g-layout-between-center">
    <div class="g-text-big title">
      {{process.title}}
    </div>

    <button mat-icon-button type="button" flDrawerClose tabindex="-1"
            [matTooltip]="'close' | translate">
      <mat-icon>clear</mat-icon>
    </button>
  </div>

  <div class="container g-flex-auto">
    <lab-workflow-node-detail></lab-workflow-node-detail>
  </div>

</div>
