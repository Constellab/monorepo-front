<div [ngClass]="layoutClass" class="g-full-height">
  <div class="port-list-container g-layout-col">
    <div *ngFor="let port$ of ports" class="port-container">

      <div *ngIf="port$ | async as port" class="port-name g-layout-col"
           (click)="onPortClick(port.port.name)"
           [ngClass]="{'selected-port': (portIsSelected(port.port.name) | async),
                       'port-input': mode === 'input',
                       'port-output': mode === 'output'}">

        <div class="port-color" [style.background-color]="port.port.getDefaultColor()"></div>
        <div class="text">
          {{ port.text | flTranslatableText}}
        </div>

      </div>

    </div>
  </div>

  <ng-container *ngIf="isOpened">
    <ng-container *ngIf="selectedResourceId$ | async; else noResource">
      <lab-resource-default-view [resourceId]="selectedResourceId$"
                                 class="view-container"></lab-resource-default-view>
    </ng-container>

    <ng-template #noResource>
      <fl-error-text class="error-text"
                     [errorMessage]="(mode === 'input' ? 'biox.no_input_resource' : 'biox.no_output_resource') | translate">
      </fl-error-text>

    </ng-template>
  </ng-container>
</div>
