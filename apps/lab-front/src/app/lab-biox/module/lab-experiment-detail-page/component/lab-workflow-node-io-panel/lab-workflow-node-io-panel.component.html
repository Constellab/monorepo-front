<div [ngClass]="layoutClass" class="g-full-height">
  <div class="port-list-container g-layout-col g-styled-scrollbar">
    <ng-container *ngFor="let port$ of ports">

      <div *ngIf="port$ | async as port" class="port-container g-layout-col"
           (click)="onPortClick(port.port.name)"
           [ngClass]="{'selected-port': (portIsSelected(port.port.name) | async),
                       'port-input': mode === 'input',
                       'port-output': mode === 'output'}">

        <div class="port-color" [style.background-color]="port.port.getDefaultColor()"></div>
        <div class="text">
          {{ port.text | flTranslatableText}}
        </div>
        <div class="delete-port">
          <button mat-icon-button type="button" class="g-button-icon-tiny "
                  *ngIf="isDynamicPorts$ | async"
                  [matTooltip]="removePortTooltip | translate" [matTooltipPosition]="tooltipPosition"
                  [disabled]="(isEditable$ | async) === false" (click)="removePort(port.port.name, $event)">
            <mat-icon>clear</mat-icon>
          </button>
        </div>
      </div>
    </ng-container>

    <div class="g-text-centered">
      <button mat-icon-button type="button" class="g-button-icon-tiny"
              *ngIf="isDynamicPorts$ | async"
              [matTooltip]="addPortTooltip | translate" [matTooltipPosition]="tooltipPosition"
              [disabled]="(isEditable$ | async) === false" (click)="addPort()">
        <mat-icon>add</mat-icon>
      </button>
    </div>
  </div>

  <ng-container *ngIf="isOpened">
    <ng-container *ngIf="selectedResourceId$ | async; else noResource">
      <lab-resource-detail [resourceId]="selectedResourceId$" displayMode="dense"
                           class="view-container"></lab-resource-detail>
    </ng-container>

    <ng-template #noResource>
      <fl-error-text class="error-text"
                     [errorMessage]="(mode === 'input' ? 'biox.no_input_resource' : 'biox.no_output_resource') | translate">
      </fl-error-text>

    </ng-template>
  </ng-container>
</div>
