<fl-article-container class="g-full-height container" *ngIf="experiment$ | async as experiment">

  <!-- Technical information -->
  <fl-article-left-side>

    <!--  Tags  -->
    <lab-tag-list class="g-flex-auto" [tags]="tags$" [showNoTagMessage]="true"
                  entityType="EXPERIMENT" [entityId]="experiment.id"></lab-tag-list>

    <!--  Folder  -->
    <lab-folder-inline-select class="separator" [(ngModel)]="experiment.folder"
                              (selectionChange)="updateFolder($event)"
                              [disabled]="!experiment.isInfoEditable()"></lab-folder-inline-select>

    <!--  Type  -->
    <fl-text-icon class="separator"
                  [matTooltip]="('biox.experiment_creation_type_help_' + experiment.creationType) | translate">
      <mat-icon flIcon="experiment"></mat-icon>
      <fl-key-value>
        <fl-key>{{ 'biox.experiment_creation_type' | translate }}</fl-key>
        {{ ('biox.experiment_creation_type_' + experiment.creationType) | translate }}
      </fl-key-value>
    </fl-text-icon>

    <!--  Validated info  -->
    <lab-object-validation-info class="separator" [object]="experiment"
                                *ngIf="experiment.isValidated"></lab-object-validation-info>

    <!--  Sync info  -->
    <lab-object-sync-info class="separator" [object]="experiment" *ngIf="experiment.isSynced"></lab-object-sync-info>

    <!--  Created by & Last modified bt  -->
    <p class="g-text-small g-text-light separator">
      <fl-creation-info [user]="experiment.createdBy"
                        [date]="experiment.createdAt"></fl-creation-info>
    </p>
    <p class="g-text-small g-text-light">
      <fl-last-modification-info [user]="experiment.lastModifiedBy"
                                 [date]="experiment.lastModifiedAt"></fl-last-modification-info>
    </p>


  </fl-article-left-side>

  <fl-article>
    <te-text-editor-save [formCtrl]="descriptionFormControl" [saveFunc]="saveDescriptionFunc"
                         [debounceTime]="1000" class="editor-save"></te-text-editor-save>

    <te-text-editor [config]="textEditorConfig"
                    [formControl]="descriptionFormControl"
                    class="text-editor"
                    [placeholder]="'biox.experiment_description_placeholder' | translate"></te-text-editor>
  </fl-article>

  <fl-article-right-side>

    <fl-card>
      <fl-card-body>
        <lab-experiment-linked-notes [experimentId]="experiment.id"></lab-experiment-linked-notes>
      </fl-card-body>
    </fl-card>
  </fl-article-right-side>
</fl-article-container>
