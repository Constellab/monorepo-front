@if (experiment$ | async; as experiment) {

  <div class="g-layout-row-wrap g-layout-start-center g-layout-gap-1em">

    <!-- Add object button  -->
    <button mat-button type="button" class="g-button-small"
            [matMenuTriggerFor]="menu" [disabled]="!experiment.protocolIsEditable()">
      <mat-icon>add</mat-icon>
      {{ 'biox.add_object' | translate }}
    </button>

    <button mat-button type="button" (click)="start()" class="g-button-small"
            [disabled]="!experiment.protocolIsEditable()">
      <mat-icon>play_arrow</mat-icon>
      {{ 'biox.experiment_start' | translate }}
    </button>

    <button mat-button type="button" color="warn" class="g-button-small"
            [disabled]="!experiment.isRunning()"
            (click)="stopExperiment()">
      <mat-icon>stop</mat-icon>
      {{ 'biox.stop_experiment' | translate }}
    </button>

    @if (experiment.pidStatus === 'UNEXPECTED_STOPPED') {
      <button mat-icon-button type="button" color="warn"
              [matTooltip]="'biox.experiment_pid_stopped' | translate"
              (click)="stopExperiment()">
        <mat-icon>error</mat-icon>
      </button>
    }
  </div>

}

<!--  Add object menu  -->
<mat-menu #menu="matMenu">
  <button mat-menu-item type="button"
          (click)="addProcess()">
    <mat-icon flIcon="process"></mat-icon>
    <span>{{ 'biox.add_process' | translate }}</span>
  </button>

  <button mat-menu-item type="button"
          (click)="addResource()">
    <mat-icon flIcon="resource"></mat-icon>
    <span>{{ 'biox.add_resource' | translate }}</span>
  </button>

  <button mat-menu-item type="button"
          (click)="addProtocolTemplate()">
    <mat-icon flIcon="protocol_template"></mat-icon>
    <span>{{ 'biox.add_protocol_template' | translate }}</span>
  </button>


  <button mat-menu-item type="button"
          (click)="addCommunityLiveTask()">
    <mat-icon flIcon="code"></mat-icon>
    <span>{{ 'biox.add_community_live_task' | translate }}</span>
  </button>

  <button mat-menu-item type="button"
          (click)="addEmptyProtocol()">
    <mat-icon flIcon="protocol"></mat-icon>
    <span>{{ 'pr.add_empty_protocol' | translate }}</span>
  </button>
</mat-menu>
