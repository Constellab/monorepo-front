<fl-portal class="portal">
  <fl-portal-header>
    {{ 'biox.resource_next_objects' | translate }}
  </fl-portal-header>

  <fl-portal-content>
    <!--  Experiments  -->
    <fl-text-icon>
      <mat-icon flIcon="experiment"></mat-icon>
      <h2>{{ 'biox.experiments' | translate }}</h2>
    </fl-text-icon>
    <fl-infinite-table-container [datasource]="experiments"
                                 textNoResult="biox.no_experiment" textNoMoreResult="">
      <lab-experiment-table [datasource]="experiments" [columns]="experimentColumns"></lab-experiment-table>
    </fl-infinite-table-container>

    <!--  Notes  -->
    <fl-text-icon class="notes">
      <mat-icon flIcon="note"></mat-icon>
      <h2>{{ 'biox.notes' | translate }}</h2>
    </fl-text-icon>
    <fl-infinite-table-container [datasource]="notes"
                                 textNoResult="biox.no_note" textNoMoreResult="">
      <lab-note-table [datasource]="notes" [columns]="noteColumns"></lab-note-table>
    </fl-infinite-table-container>
  </fl-portal-content>
</fl-portal>
