<form (ngSubmit)="submit()" id="process-config-form" [formGroup]="formGp()" class="form g-layout-col">
  @if (!processConfig().hasConfigs()) {
    <fl-error-text [errorMessage]="'biox.no_config_for_task' | translate"></fl-error-text>
  }

  <div class="g-flex-auto">
    <lab-configure-specs-form [configData]="processConfig()" [formGp]="formGp()"></lab-configure-specs-form>
  </div>
</form>
