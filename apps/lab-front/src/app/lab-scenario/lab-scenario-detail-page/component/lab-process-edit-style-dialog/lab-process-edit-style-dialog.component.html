<fl-dialog-header>
  {{'biox.edit_process_style' | translate}}
</fl-dialog-header>

<mat-dialog-content>
  <form [formGroup]="formGp" (ngSubmit)="submit()">
    <co-update-type-icon-form [formGp]="formGp"></co-update-type-icon-form>
    <button mat-raised-button color="primary" type="submit" [disabled]="formGp.invalid">
      {{'save' | translate}}
    </button>
  </form>
</mat-dialog-content>
