<div class="g-layout-row g-layout-between-center">


  <h1 flElementEditable (flElementValueChange)="updateName($event)"
      class="title">{{ template.name }}</h1>

  <div>
    <a mat-icon-button [href]="downloadUrl" download class="button"
       [matTooltip]="'biox.download_protocol_template' | translate">
      <mat-icon>cloud_download</mat-icon>

    </a>

    <button mat-icon-button type="button" (click)="openDeleteDialog()" color="warn"
            class="button"
            [matTooltip]="'biox.update_protocol_template' | translate">
      <mat-icon>delete</mat-icon>
    </button>
  </div>


</div>
