@if (notFound()) {
  <div class="main-panel">
    <ha-ha404></ha-ha404>
  </div>
} @else if (isLoading()) {
  <div class="main-panel">
    <div class="g-text-centered">
      <fl-loader></fl-loader>
    </div>
  </div>
} @else if (communityApp()) {
  <div class="app-header">
    <div class="app-header-left app-header-div">
      <h2>{{ communityApp().title }}</h2>
      <a [href]="profileRoute + communityApp().createdBy.id">
        <fl-user-inline [user]="communityApp().createdBy" [portalOnHover]="false"></fl-user-inline>
      </a>
    </div>

    <div class="app-header-middle app-header-div">
      <a [routerLink]="'.'" [ngClass]="currentChildrenPath === '' ? 'activated-a' : ''">{{
        'application' | translate
      }}</a>
      <a [routerLink]="'detail'" [ngClass]="currentChildrenPath === 'detail' ? 'activated-a' : ''">{{
        'detail' | translate
      }}</a>
    </div>

    <div class="app-header-right app-header-div">
      @if (currentUser && communityApp().createdBy.id === currentUser.id) {
        <button mat-flat-button (click)="openEditAppDialog()" class="edit-button primary">
          <mat-icon>edit</mat-icon>
          {{ 'edit' | translate }}
        </button>
      }
      <fl-text-icon iconPosition="start" [gap]="'8px'" [matTooltip]="'app_execution_count' | translate">
        <mat-icon>play_circle</mat-icon>
        <span>{{ communityApp().executions }}</span>
      </fl-text-icon>
      <ha-like-button
        [isLiked]="isLiked()"
        [likesCount]="communityApp().likes"
        (clicked)="toggleLikeAppButton()"></ha-like-button>

      <a [routerLink]="'detail'" [fragment]="'comments'">
        <ha-comment-button [commentsCount]="communityApp().comments"></ha-comment-button>
      </a>
    </div>
  </div>
  <router-outlet></router-outlet>
}
