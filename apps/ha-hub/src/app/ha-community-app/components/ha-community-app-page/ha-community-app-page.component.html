@if (notFound()) {
  <div class="main-panel">
    <ha-ha404></ha-ha404>
  </div>
} @else if (isLoading()) {
  <div class="main-panel">
    <div class="g-text-centered">
      <fl-loader></fl-loader>
    </div>
  </div>
} @else if (communityApp()) {
  <div class="app-header">
    <div class="nav-bar">
      <div class="app-header-left app-header-div">
        <h2>{{ communityApp().title }}</h2>
        <fl-text-icon iconPosition="start" [gap]="'8px'" [matTooltip]="'app_execution_count' | translate"
                      class="execution-count hide-small-screen">
          <mat-icon>play_circle</mat-icon>
          <span>{{ communityApp().executions }}</span>
        </fl-text-icon>
        <ha-like-button
          [entityId]="communityApp().id"
          [entityType]="entityType"></ha-like-button>

        <a [routerLink]="'detail'" [fragment]="'comments'" class="hide-small-screen">
          <ha-comment-button [commentsCount]="communityApp().comments"></ha-comment-button>
        </a>
      </div>

      <div class="app-header-right app-header-div">
        <a [routerLink]="'.'" [routerLinkActive]="'activated-a'" [routerLinkActiveOptions]="{ exact: true }">{{
            'application' | translate
          }}</a>
        <a [routerLink]="'detail'" [routerLinkActive]="'activated-a'" [routerLinkActiveOptions]="{ exact: true }">{{
            'detail' | translate
          }}</a>
      </div>
    </div>
  </div>
  <div class="app-page-content g-scrollable-element">
    <router-outlet></router-outlet>
  </div>

}
