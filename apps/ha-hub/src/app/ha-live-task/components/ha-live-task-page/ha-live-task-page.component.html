<div class="live-task-page-div">
  <div class="g-flex main-panel" *ngIf="isLoading">
    <fl-loader class="g-centered"></fl-loader>
  </div>

  <div class="left-panel" *ngIf="!isLoading">
    <a [routerLink]="liveTaskListRoute" class="back-link">
      <fl-text-icon [iconPosition]="'start'">
        <mat-icon>arrow_back</mat-icon>
        {{'back_to_live_tasks_list' | translate}}
      </fl-text-icon>
    </a>
    <ha-live-task-versions-panel [liveTask]="liveTask" [canEditLt]="canEditLt"></ha-live-task-versions-panel>
  </div>

  <div class="main-panel" *ngIf="liveTask && !isLoading">
    <router-outlet></router-outlet>
  </div>


  <div class="right-panel" *ngIf="liveTask">
    <div class="lt-user-div">
      <h5 class="lt-user-title">
        <span>{{ 'authors' | translate }}</span>
        @if (currentUser?.id == liveTask.createdBy?.id) {
          <button mat-icon-button (click)="openLtCoAuthorsDialog()">
            <mat-icon>group_add</mat-icon>
          </button>
        }
      </h5>
      <div class="lt-user-line">
        <fl-user-inline [portalOnHover]="false" [user]="liveTask.createdBy"></fl-user-inline>
        <mat-icon>workspace_premium</mat-icon>
      </div>
      @for (ltCoAuthor of ltCoAuthors; track ltCoAuthor.id) {
        <div class="lt-user-line">
          <fl-user-inline [portalOnHover]="false" [user]="ltCoAuthor"></fl-user-inline>
        </div>
      }
    </div>
  </div>
</div>
