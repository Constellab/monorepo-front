<fl-dialog-header>
  {{'add_live_task' | translate}}
</fl-dialog-header>

<mat-dialog-content>
  <form (ngSubmit)="submit()" id="story-form" [formGroup]="formGp">
    <mat-form-field class="g-form-input">
      <mat-label>{{'title' | translate}}</mat-label>
      <input matInput formControlName="title" required flInputMaxLength="100" [placeholder]="'title' | translate">
      <mat-error *ngIf="formGp.get('title').hasError('required')">
        {{'title' | flErrorRequired}}
      </mat-error>
    </mat-form-field>
    <div>
      <div>{{'type' | translate}}</div>
      <mat-radio-group formControlName="type" [required]="true">
        <button mat-flat-button type="button" [color]="(formGp.get('type').value == 'PUBLIC') ? 'primary' : undefined">
          <mat-radio-button labelPosition="before" value="PUBLIC">{{'public' | translate}}</mat-radio-button>
        </button>
        <button mat-flat-button type="button" [color]="(formGp.get('type').value == 'SPACE') ? 'primary' : undefined" *ngIf="userSpaces && userSpaces.length > 0">
          <mat-radio-button labelPosition="before" value="SPACE">{{'space' | translate}}</mat-radio-button>
        </button>
      </mat-radio-group>
    </div>
    <ng-container *ngIf="formGp.get('type').value == 'SPACE'">
      <div>{{'your_spaces' | translate}}</div>
      <mat-radio-group formControlName="space" [required]="true">
        <button mat-flat-button type="button" *ngFor="let space of userSpaces" [color]="(formGp.get('space').value == space) ? 'primary' : undefined">
          <mat-radio-button labelPosition="before" [value]="space">{{space.name}}</mat-radio-button>
        </button>
      </mat-radio-group>
    </ng-container>
    <div>
      <div>{{'live_task_version_file' | translate}}</div>
      <fl-input-file-container color="primary" [placeholder]="'import_live_task_version_file' | translate">
        <input flInputFile type="file" [strictMode]="true" [autoClearHtmlInput]="true" accept="application/json" (fileChange)="onFileSelected($any($event))">
      </fl-input-file-container>
    </div>
  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-flat-button color="primary" type="submit" form="story-form" class="g-centered-forced" [disabled]="!formGp.valid">
    {{'create' | translate}}
    <fl-button-loader *ngIf="isLoading"></fl-button-loader>
  </button>
</div>
