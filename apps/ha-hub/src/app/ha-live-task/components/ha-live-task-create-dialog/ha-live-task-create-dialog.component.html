<fl-dialog-header>
  {{'create_live_task' | translate}}
</fl-dialog-header>

<co-agent-create-dialog-form [formGp]="formGp" [spaces$]="spaces$" (submitEvent)="onSubmitEvent($event)">
  <div>
    <div class="live-task-version-file-div">{{'live_task_version_file' | translate}}</div>
    <fl-input-file-container color="primary" [placeholder]="'import_live_task_version_file' | translate">
      <input flInputFile type="file" [strictMode]="true" [autoClearHtmlInput]="true" accept="application/json" (fileChange)="onFileSelected($any($event))">
    </fl-input-file-container>
  </div>
</co-agent-create-dialog-form>
