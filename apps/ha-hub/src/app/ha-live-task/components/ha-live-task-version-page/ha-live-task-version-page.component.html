<div class="g-flex" *ngIf="isLoading">
  <fl-loader class="g-centered"></fl-loader>
</div>

<div *ngIf="liveTaskVersion && !isLoading">
  <div class="live-task-version-title">
    <h2>{{ liveTaskVersion?.liveTask.title }}</h2>
    <div class="g-badge g-warn-background">{{ liveTaskVersion.type | translate }}</div>
  </div>


  <div class="live-task-infos-div">
    <h4>{{ 'version' | translate }} {{ liveTaskVersion?.version }}</h4>
    @if (liveTaskVersion.versionState == 'DRAFT' && canEdit) {
      <div class="live-task-infos">
        <span class="g-text-small g-warn-text">{{'warn_lt_version_not_published' | translate}}</span>
        <button mat-stroked-button color="primary" (click)="publishLiveTaskVersion()">
          {{ 'publish' | translate }}
        </button>
      </div>
    }
  </div>
  @if(canEditChecked){
    <ha-live-task-version-detail [liveTaskVersion]="liveTaskVersion" [canEdit]="canEdit" [isEditable]="liveTaskVersion.versionState == 'DRAFT'"
                                 (liveTaskVersionChangeEvent)="updateLiveTaskVersion($event)"></ha-live-task-version-detail>
  }
</div>
<div *ngIf="!isLoading && notFound">
  <ha-ha404 ></ha-ha404>
</div>
