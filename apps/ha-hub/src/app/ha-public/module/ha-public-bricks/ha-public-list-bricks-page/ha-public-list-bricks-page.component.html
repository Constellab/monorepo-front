<div class="main-container">
  <div class="left-panel">
    <a routerLink="edit" *haIsAuthenticated>
      <button mat-flat-button type="button" class="bt first-bt">
        <mat-icon >add_circle</mat-icon>
        {{'create_brick' | translate}}
      </button>
    </a>
  </div>
  <div class="main-panel">
    <div class="stories-div" *ngIf="bricks"
         (flInfiniteScroll)="loadMoreResults()" [flInfiniteDisabled]="bricks?.isLoading || bricks?.page?.last"
         flInfiniteMode="auto">
      <fl-text-icon>
        <mat-icon class="g-icon-huge">
          <img src="assets/fl-logo/bricks_logo.svg"/>
        </mat-icon>
        <h1 class="title">{{ 'bricks' | translate }}</h1>
      </fl-text-icon>
      <div class="search-bar-title">
        <form type="submit" (ngSubmit)="search($event)">
          <mat-form-field class="search-bar">
            <input matInput [formControl]="titleFormControl" placeholder="{{'search_by_title' | translate}}">
            <button mat-icon-button matSuffix aria-label="Clear" (click)="search($event)">
              <mat-icon>search</mat-icon>
            </button>
          </mat-form-field>
        </form>
      </div>
      <div class="bricks-list">
        <a *ngFor="let b of bricks | flDatasourceConnect  | async" [routerLink]="getBrickRoute(b)">
          <co-brick-list-item [brick]="b"></co-brick-list-item>
        </a>
      </div>
    </div>
  </div>
</div>
