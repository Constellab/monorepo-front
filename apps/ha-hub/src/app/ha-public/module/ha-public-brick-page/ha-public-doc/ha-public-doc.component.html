<div class="no-doc-div" *ngIf="docNotFound">
  <ha-ha404 [errorText]="'error_doc_not_found'"></ha-ha404>
</div>


<div *ngIf="!docNotFound">
  <div class="loader" *ngIf="isLoading || !documentation">
    <fl-loader size="medium"></fl-loader>
  </div>
  <div class="doc-div" *ngIf="!isLoading && documentation">
    <div class="doc-div-content g-max-article-width">
      <div class="doc-title-div">
        <h3 flElementEditable (flElementValueChange)="onTitleChange($event)"
            [flElementValue]="titleCurrentValue()" [maxLength]="50" [minLength]="2"
            [flElementDisabled]="!(isCreatorOrBrickUser$ | async)">{{documentation.title}}</h3>


        <button mat-icon-button type="button" *ngIf="isCreatorOrBrickUser$ | async"
                [matMenuTriggerFor]="menu">
          <mat-icon>
            more_vert
          </mat-icon>
        </button>

        <mat-menu #menu="matMenu">

          <button mat-menu-item type="button" (click)="changeTextEditorState()">
            <mat-icon>{{formCtrl.disabled ? 'edit_note' : 'visibility'}}</mat-icon>
            <span>{{(formCtrl.disabled ? 'edit' : 'view') | translate}}</span>
          </button>

          <button mat-menu-item type="button" (click)="openResourceDelete()">
            <mat-icon color="warn">delete</mat-icon>
            <span class="g-warn-text">{{'delete' | translate}}</span>
          </button>
        </mat-menu>


      </div>
      <form class="documentation-form" *ngIf="!isLoading">
        <te-text-editor [formControl]="formCtrl" [config]="textEditorConfig"
                        (textChange)="onContentUpdate($event)"
                        class="content-editor g-max-article-width"
                        [ngClass]="{'text-editor-edit': !formCtrl.disabled}"></te-text-editor>
      </form>
    </div>
  </div>
</div>
<div class="right-panel right-div g-scrollable-element" *ngIf="documentation && (titles?.length > 0 || (docFiles?.length > 0 || (isCreatorOrBrickUser$ | async)))">
  @if ((docFiles && docFiles.length > 0) || (isCreatorOrBrickUser$ | async)) {
    <div class="files-div">
      <h6 class="side-box-title">
        <fl-text-icon>
          <mat-icon>description</mat-icon>
          {{ 'attached_files' | translate }}
        </fl-text-icon>
      </h6>

      <div class="doc-files-div">
        @for (file of docFiles; track file.id) {
          <div class="doc-file" [matTooltip]="file.name" *ngIf="file.type == 'FILE'">
            <a type="button" [href]="downloadFile(documentation.id, file)" download [matTooltip]="'download_attached_file' | translate">
              <fl-file-text-icon [filename]="file.name">
              </fl-file-text-icon>
            </a>
          </div>
        }
      </div>
    </div>
  }
  @if(titles && titles.length > 0){
    <div>
      <ha-public-brick-right-panel [brickName]="brickName"
                                   [docTitles]="titles"></ha-public-brick-right-panel>
    </div>
  }
</div>
