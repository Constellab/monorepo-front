
<fl-async-section [object]="brick$" class="full-w" [emptyText]="'error_brick_not_found'">
  <ng-container *flSectionBody="brick$ as brick">
    <div class="left-panel" *ngIf="brick">
      <mat-icon class="button-left-panel" haSidenavButton></mat-icon>
      <ha-public-sidenav [brick]="brick"></ha-public-sidenav>
    </div>
    <div class="main-panel">
      <div class="brick-content-div">
        <router-outlet></router-outlet>
      </div>
    </div>
    <!--    <router-outlet></router-outlet>-->
  </ng-container>
</fl-async-section>
