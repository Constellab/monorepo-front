@for(title of docTitles; track title.text){
  @if(title.level == 2){
    <a [routerLink]="'.'" [fragment]="title.text" class="title main-title small-text">{{title.text}}</a>
  } @else {
    <a [routerLink]="'.'" [fragment]="title.text" class="title secondary-title small-text">{{title.text}}</a>
  }
}
