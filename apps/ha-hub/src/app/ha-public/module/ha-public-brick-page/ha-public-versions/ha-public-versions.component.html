<div class="table-version">
  <button mat-flat-button color="primary" *ngIf="isCreatorOrBrickUser$ | async" class="button-add-version"
          (click)="openNewVersionDialog(brickId)">
    {{'add_version' | translate}}
  </button>
  <div class="data-table-versions">
    <ha-public-brick-versions-table [datasource]="brickVersions" [columns]="displayedColumns"></ha-public-brick-versions-table>
  </div>
</div>
