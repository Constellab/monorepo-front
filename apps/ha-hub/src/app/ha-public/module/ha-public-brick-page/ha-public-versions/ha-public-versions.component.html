<div class="table-version" *ngIf="brick()">
  <button
    mat-flat-button
    *ngIf="userHasEditRight()"
    class="button-add-version primary"
    (click)="openNewVersionDialog(brick().id)">
    {{ 'add_version' | translate }}
  </button>
  <div class="data-table-versions">
    <ha-public-brick-versions-table [datasource]="brickVersions"></ha-public-brick-versions-table>
  </div>
</div>
