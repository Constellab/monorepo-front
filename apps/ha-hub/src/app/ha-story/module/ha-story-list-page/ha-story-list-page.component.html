<div class="left-panel" haLeftPanel>
  <mat-icon class="button-close-left-panel" haSidenavButton></mat-icon>
  <button
    mat-stroked-button
    type="button"
    class="bt first-bt"
    *haIsAuthenticated
    (click)="openCreateStoryDialog()">
    <mat-icon>add_circle</mat-icon>
    {{ 'create_story' | translate }}
  </button>

  <mat-divider class="left-panel-separator" *haIsAuthenticated></mat-divider>

  <button
    mat-stroked-button
    type="button"
    class="bt my-stories-bt"
    *haIsAuthenticated
    (click)="selectMyStories()"
    [class]="myStoriesBool ? 'bt-primary' : ''">
    {{ 'my_stories' | translate }}
  </button>


  @if (popularTopics$ | async; as topics) {
    @if (topics?.length > 0) {
      <p class="left-side-div-title" flHide.lt-sm>{{ 'popular_topics' | translate }} :</p>
      <mat-chip-listbox selectable multiple>
        @for (topic of topics; track topic) {
          <mat-chip-option [value]="isSelected(topic)" (click)="selectTopic(topic)" class="g-cursor-hover">
            {{ topic.name }}
          </mat-chip-option>
        }
      </mat-chip-listbox>
    }
  }
</div>

<div class="main-panel">
  @if (stories) {
    <fl-infinite-scroll [datasource]="stories" infiniteMode="auto" class="list-section">
      <div class="section-title">
        <h1 class="title">{{ 'stories' | translate }}</h1>
      </div>
      <div class="search-bar-title">
        <form (submit)="search()">
          <mat-form-field class="section-search-bar">
            <input
              matInput
              [formControl]="titleFormControl"
              placeholder="{{ 'search_by_title' | translate }}" />
            <button mat-icon-button matSuffix (click)="search()" [matTooltip]="'search' | translate"
                    aria-label="Search by title button">
              <mat-icon>search</mat-icon>
            </button>
          </mat-form-field>
        </form>
      </div>
      <div class="stories-list">
        @for (story of stories | flDatasourceConnect | async; track story) {
          <a [routerLink]="story.publishedAt == null ? 'edit/' + story.id : (story | haDetailRoute)">
            <co-story-list-item
              [story]="story"
              [imageLink]="getStoryImageLink(story.id, story?.mainPicture)"></co-story-list-item>
          </a>
        }
      </div>
    </fl-infinite-scroll>
  }
</div>
