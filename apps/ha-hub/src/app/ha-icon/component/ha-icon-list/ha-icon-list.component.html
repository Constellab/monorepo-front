<div class="icons-search-bar-div">
  <form (ngSubmit)="search()">
    <mat-form-field class="icons-search-bar">
      <input matInput [formControl]="searchFormControl" placeholder="{{'search_icon' | translate}}">
      <button mat-icon-button matSuffix aria-label="Clear" (click)="search()">
        <mat-icon>search</mat-icon>
      </button>
    </mat-form-field>
  </form>
</div>

<div class="icons-list-div" *ngIf="icons"
     (flInfiniteScroll)="loadMoreResults()" [flInfiniteDisabled]="icons.isLoading || icons?.page?.last"
     flInfiniteMode="auto">

  <div class="icon-div" *ngFor="let icon of icons | flDatasourceConnect | async" (click)="openIconInfoPortal($event, icon)">
      <div class="icon-file-div">
        <td-type-icon [iconSize]="75" [iconTechnicalName]="icon.technicalName" [iconType]="icon.type"></td-type-icon>
      </div>
      <div class="icon-name-div">
        <span class="icon-name">{{icon.name}}</span>
      </div>
  </div>

</div>
