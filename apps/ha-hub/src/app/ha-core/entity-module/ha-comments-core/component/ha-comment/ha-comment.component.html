<div class="comment-info-div">
  <fl-user-inline [portalOnHover]="false" [user]="comment.createdBy"></fl-user-inline>
  <span> - </span>
  <fl-from-now [date]="comment.createdAt" class="comment-info-date"></fl-from-now>
</div>

<te-text-editor [config]="textEditorConfig" [(ngModel)]="comment.content" [disabled]="true" class="comment-content">

</te-text-editor>
