<div
  (flInfiniteScroll)="loadMoreResults()"
  [flInfiniteDisabled]="datasource?.isLoading || datasource?.page?.last"
  flInfiniteMode="auto"
  class="comments-portal-div">
  <div class="comments-portal">
    <h4>{{ 'comments' | translate }} - {{ entity.comments }}</h4>
    <button mat-icon-button (click)="closePortal()" [matTooltip]="'close' | translate">
      <mat-icon>close</mat-icon>
    </button>
  </div>
  @if (user) {
    <fl-card class="comment-write-card">
      <fl-card-header>
        <fl-user-inline [user]="user" [portalOnHover]="false"></fl-user-inline>
      </fl-card-header>
      <fl-card-body>
        <te-text-editor
          [config]="textEditorConfig"
          [(ngModel)]="commentInputData"
          [placeholder]="'write_a_comment' | translate"
          class="text-editor"
          (textChange)="checkCommentValidity()"
          (keydown.control.enter)="sendComment()"></te-text-editor>
      </fl-card-body>
      <fl-card-footer>
        <div class="comment-write-card-footer">
          <button
            mat-flat-button
            class="primary"
            [disabled]="!commentIsValid || isLoading"
            (click)="sendComment()">
            @if (isLoading) {
              <fl-button-loader></fl-button-loader>
            }
            @if (!isLoading) {
              {{ 'comment' | translate }}
            }
          </button>
        </div>
      </fl-card-footer>
    </fl-card>
  } @else {
    <div class="login-div">
      <p>{{ 'login_to_post_a_comment' | translate }}</p>
      <a mat-flat-button class="primary" [routerLink]="loginRoute" (click)="closePortal()">{{
        'login' | translate
      }}</a>
    </div>
  }

  <div class="comments-list-div">
    @for (comment of datasource | flDatasourceConnect | async; track comment) {
      <ha-comment [comment]="comment"> </ha-comment>
    }
  </div>
</div>
