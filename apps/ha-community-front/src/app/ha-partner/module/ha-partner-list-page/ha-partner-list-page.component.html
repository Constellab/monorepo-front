<ha-page [hideCreateSection]="hideCreate()" [showHeaderCreateButton]="true">
  @if (currentUserPartner(); as currentPartner) {
    <div class="section my-partner-page-div">
      <h3>{{ 'my-partner-page' | translate }}</h3>
      <a [routerLink]="currentPartner | haDetailRoute">
        <co-partner-list-item [partner]="currentPartner" [partnerLogo]="currentPartner | haPartnerLogoUrl">
        </co-partner-list-item>
      </a>
    </div>
  }

  <fl-infinite-scroll [datasource]="partnerPaginated" infiniteMode="auto" class="section">
    <h3>{{ 'certified_partners' | translate }}</h3>
    <!-- co-list-filters.user (community-lib) is typed CoUser | null -->
    <co-list-filters
      [user]="user() ?? null"
      [sortsCriteriaKeys]="sortsCriteriaKeys"
      (sortsCriteriaChanged)="onSortsCriteriaChanged($event)"
      (titleFilterChanged)="onNameFilterChange($event)"
      [listEntityType]="listEntityType"
      [hideMyEntitiesFilter]="true"
      [hideSpaceFilter]="true" />
    <ha-list-of-items>
      @for (partner of partnerPaginated | flDatasourceConnect | async; track partner.id) {
        <a [routerLink]="partner | haDetailRoute">
          <co-partner-list-item [partner]="partner" [partnerLogo]="partner | haPartnerLogoUrl">
          </co-partner-list-item>
        </a>
      }
    </ha-list-of-items>
  </fl-infinite-scroll>
</ha-page>
