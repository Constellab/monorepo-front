<ha-page>
  <fl-infinite-scroll [datasource]="agentsPaginated" infiniteMode="auto" class="section">
    <ha-list-of-items>
      @for (agent of agentsPaginated | flDatasourceConnect | async; track agent.id) {
        <a class="agent-result-card-div" [routerLink]="agent | haDetailRoute">
          <co-agent-list-item [agent]="agent"></co-agent-list-item>
        </a>
      }
    </ha-list-of-items>
  </fl-infinite-scroll>
</ha-page>
