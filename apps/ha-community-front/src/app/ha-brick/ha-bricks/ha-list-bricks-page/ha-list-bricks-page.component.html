<ha-page [showHeaderCreateButton]="true">
  <fl-infinite-scroll [datasource]="bricks" infiniteMode="auto" class="section">
    <!-- co-list-filters.user (community-lib) is typed CoUser | null; coerce our undefined "not loaded yet" state -->
    <co-list-filters
      [user]="user ?? null"
      [listEntityType]="listEntityType"
      (sortsCriteriaChanged)="onSortsCriteriaChanged($event)"
      (titleFilterChanged)="onTitleFilterChanged($event)"
      (spacesFilterChanged)="onSpacesFilterChanged($event)"
      (myEntitiesChanged)="onMyEntitiesChanged($event)"></co-list-filters>
    <ha-list-of-items>
      @for (brick of bricks | flDatasourceConnect | async; track brick.id) {
        <a [routerLink]="brick | haDetailRoute">
          <co-brick-list-item
            [brick]="brick"
            [brickImage]="brick.imageLink | haBrickImage"></co-brick-list-item>
        </a>
      }
    </ha-list-of-items>
  </fl-infinite-scroll>
</ha-page>
