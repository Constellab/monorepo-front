<ha-page>
  <fl-infinite-scroll [datasource]="bricks" infiniteMode="auto" class="section">
    <ha-list-of-items>
      @for (brick of bricks | flDatasourceConnect | async; track brick.id) {
        <a [routerLink]="getBrickRoute(brick)">
          <co-brick-list-item
            [brick]="brick"
            [brickImage]="brick.imageLink | haBrickImage"></co-brick-list-item>
        </a>
      }
    </ha-list-of-items>
  </fl-infinite-scroll>
</ha-page>
