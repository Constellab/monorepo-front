@if (brick(); as brickValue) {
  <div class="table-version">
    @if (userHasEditRight()) {
      <button
        mat-flat-button
        class="button-add-version primary"
        (click)="openNewVersionDialog(brickValue.name)">
        {{ 'add_version' | translate }}
      </button>
    }
    <div class="data-table-versions">
      <ha-brick-versions-table [datasource]="brickVersions"></ha-brick-versions-table>
    </div>
  </div>
}
