@if (isTechDocLoading()) {
  <div class="loader">
    <fl-loader size="medium"></fl-loader>
  </div>
} @else {
  @if (!techDocNotFound() && techDoc(); as doc) {
    <div class="doc-div">
      <div class="doc-div-content g-max-article-width g-scrollable-element">
        <div class="doc-title-div">
          <td-technical-doc-header [technicalDoc]="doc"></td-technical-doc-header>
        </div>
        @if (runStatAggregate(); as runStatAggregateValue) {
          <ha-run-stat-aggregate-panel
            [runStatAggregate]="runStatAggregateValue"></ha-run-stat-aggregate-panel>
        }
        <article>
          <td-technical-doc flAutoScrollToAnchor [technicalDoc]="doc"></td-technical-doc>
        </article>
      </div>
    </div>
  } @else {
    <ha-404 [errorText]="'error_tech_doc_not_found'"></ha-404>
  }
}
