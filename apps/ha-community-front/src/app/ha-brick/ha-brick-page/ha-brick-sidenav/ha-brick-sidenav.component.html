<!-- Header: "menu" title + add button (only with edit rights) -->
<div class="g-layout-row g-layout-between-center">
  <span class="g-text-medium g-weight-600">{{ 'menu' | translate }}</span>
  @if (userHasEditRight()) {
    <button mat-icon-button (click)="onClickMenu($event)" [matTooltip]="'create_element' | translate">
      <mat-icon>add</mat-icon>
    </button>
  }
</div>

<div class="entity-page-info-div-content table-of-contents">
  <div>
    <!-- 1. "Introduction" link (doc root) -->
    <!--    Active when currentDocId() === '' (no URL sub-segment) -->
    <a
      [routerLink]="currentDocId() === '' ? null : '.'"
      [relativeTo]="route"
      [routerLinkActive]="'active'"
      class="g-text-small tree-node g-layout-row g-layout-start-center tree-node-div"
      [class.selected-tree-node]="currentDocId() === ''">
      {{ 'introduction' | translate }}
    </a>

    <!-- 2. Tree of written documentations (folders + docs) -->
    <!--    Dedicated component: handles drag & drop, editing and selection -->
    <ha-brick-sidenav-tree
      [sidenavObjects]="dataSource$"
      [selectedObject]="currentDocId()"
      [getRoute]="getRoute"
      [canEdit]="userHasEditRight()"
      [dragAndDropDisabled]="false"
      [showActionIcons]="true"
      [parentDocFolderId]="parentDocFolderId"
      (menuButtonEvent)="onDocumentationTreeEvent($event)"
      (refreshDatasource)="onRefreshDocumentationTree()"></ha-brick-sidenav-tree>

    <!-- 3. Tree of technical documentations (generated/imported) -->
    <!--    Loaded on demand when the root folder is expanded -->
    <mat-tree
      #techTree
      [dataSource]="techDataSource$"
      [childrenAccessor]="techDataSource$.childrenAccessor"
      [trackBy]="techDataSource$.trackById">
      <!-- This is the tree node template for leaf nodes -->
      <mat-tree-node
        *matTreeNodeDef="let node"
        [isExpanded]="node.object.isExpanded"
        matTreeNodePadding
        [matTreeNodePaddingIndent]="10"
        class="g-drag-hide-placeholder">
        <!-- Folder node: collapsible (toggle) -->
        @if (node.object.children) {
          <div
            class="g-text-small tree-node g-layout-row g-layout-start-center"
            matTreeNodeToggle
            role="button"
            tabindex="0"
            (click)="node.object.isExpanded ? collapseTechNode(node) : expandTechNode(node)"
            (keydown.enter)="node.object.isExpanded ? collapseTechNode(node) : expandTechNode(node)">
            <div class="tree-node-div">
              {{ node.object.name }}
            </div>
            <button
              mat-icon-button
              class="g-button-icon-small toggle-parent-button"
              [attr.aria-label]="'Toggle ' + node.object.name"
              type="button">
              <mat-icon>
                {{ techTree.isExpanded(node) ? 'arrow_drop_down' : 'arrow_right' }}
              </mat-icon>
            </button>
          </div>
        } @else {
          <!-- Leaf node: link to a technical doc page -->
          <a
            [routerLink]="isTechDocActive(node) ? null : 'doc/' + node.object.completePath"
            class="g-text-small tree-node g-layout-row g-layout-start-center"
            [class.selected-tree-node]="isTechDocActive(node)">
            <div class="tree-node-div">
              {{ node.object.name }}
            </div>
          </a>
        }
      </mat-tree-node>
    </mat-tree>

    <!-- 4. "Versions" link -->
    <!--    Active when currentDocId() === 'version' -->
    <a
      [routerLink]="currentDocId() === 'version' ? null : 'version'"
      [relativeTo]="route"
      [routerLinkActive]="'active'"
      class="g-text-small tree-node g-layout-row g-layout-start-center tree-node-div"
      [class.selected-tree-node]="currentDocId() === 'version'">
      {{ 'version' | translate }}
    </a>
  </div>
</div>
