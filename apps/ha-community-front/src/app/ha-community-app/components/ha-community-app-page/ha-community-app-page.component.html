<ha-page
  [pageTitle]="communityApp()?.title ?? tempTitle"
  [showPageDescription]="false"
  [isLoading]="isLoading()"
  [notFound]="notFound()">
  @if (communityApp()) {
    <div class="entity-page-section">
      <div class="entity-page-infos">
        <ha-entity-page-infos
          [entityId]="communityApp().id"
          [entityType]="entityType"
          [contributors]="contributors()"
          [date]="communityApp().createdAt"
          [space]="communityApp().space"
          [executions]="communityApp().executions ?? 0"
          [isAuthor]="isAuthor()">
          @if (canEdit()) {
            <div class="entity-page-info-div">
              <button type="button" mat-flat-button (click)="openEditCommunityAppDialog()" class="g-full">
                <mat-icon>edit</mat-icon>
                {{ 'edit_app' | translate }}
              </button>
            </div>
          }
<!--          <div class="entity-page-info-div g-layout-row g-layout-between-center">-->
<!--            <span class="g-text-medium g-weight-600">{{ 'documentation' | translate }}</span>-->
<!--            <button mat-flat-button class="g-button-small">Open doc</button>-->
<!--          </div>-->

<!--          <div class="entity-page-separator"></div>-->
        </ha-entity-page-infos>
      </div>
      <div class="entity-page-content">
        <div class="app-page-content">
          <div class="app-page-title-div app-page-launch-div">
            <h2>{{ 'the_app' | translate }}</h2>
            <a type="button" mat-flat-button [href]="communityApp().appUrl" target="_blank">{{ 'open_app' | translate }}</a>
          </div>

          <div class="app-page-about-div">
            <div class="app-page-title-div g-layout-row g-layout-between-center">
              <h2>{{ 'about' | translate }}</h2>
              @if (canEdit()) {
                @if (!appDescriptionFormControl.disabled) {
                  <button mat-flat-button (click)="saveAbout()">
                    @if (onAboutEditionLoading) {
                      <fl-loader></fl-loader>
                    } @else {
                      {{ 'save' | translate }}
                    }
                  </button>
                } @else {
                  <button mat-flat-button (click)="editAbout()">{{ 'edit_about' | translate }}</button>
                }
              }
            </div>
            <article>
              <te-text-editor
                class="community-text-editor"
                [config]="textEditorConfig"
                [formControl]="appDescriptionFormControl"></te-text-editor>
            </article>
          </div>

        </div>
      </div>
      <div class="entity-page-comment" id="comments">
        <div class="entity-page-separator"></div>
        <ha-comments-section [user]="currentUser"></ha-comments-section>
      </div>
    </div>
  }
</ha-page>
