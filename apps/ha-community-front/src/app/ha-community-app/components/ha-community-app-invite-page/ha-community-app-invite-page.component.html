@if (invite) {
  <div class="invite-div">
    <h4>{{ invite.createdBy.alias }} {{ 'invite_text' | translate }} {{ invite.communityApp.title }}</h4>
    <button mat-flat-button type="button" (click)="acceptInvite()" [disabled]="isLoading">
      {{ 'become_coauthor' | translate }}
      @if (isLoading) {
        <fl-loader class="loader" [size]="20"></fl-loader>
      }
    </button>
  </div>
}
