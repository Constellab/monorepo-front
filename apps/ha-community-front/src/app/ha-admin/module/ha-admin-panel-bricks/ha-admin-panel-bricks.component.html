<fl-card class="card">
  <fl-card-header>
    <fl-search-header>
      <fl-text-icon>
        <mat-icon flIcon="brick"></mat-icon>
        <h2 class="g-admin-panel-section-title">{{ 'bricks' | translate }}</h2>
      </fl-text-icon>

      <fl-search-header-actions class="g-layout-row g-layout-start-center">
        <button
          mat-stroked-button
          type="button"
          class="g-button-small"
          (click)="sendAllToQueue()">
          {{ 'send_all_brick_versions_to_queue' | translate }}
        </button>
      </fl-search-header-actions>
    </fl-search-header>
  </fl-card-header>
  <fl-card-body class="g-full-height">
    <fl-search>
      <fl-search-advanced-form>
        <ha-admin-panel-bricks-search-form></ha-admin-panel-bricks-search-form>
      </fl-search-advanced-form>
      <fl-search-result>
        <ha-admin-panel-bricks-table [datasource]="datasource" (action)="onAction($event)"></ha-admin-panel-bricks-table>
      </fl-search-result>
    </fl-search>
  </fl-card-body>
</fl-card>
