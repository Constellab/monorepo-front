<div class="feature-card">
  <div class="content">
    <h3 class="title g-weight-600">{{ title() }}</h3>
    <p class="description g-text-medium">{{ description() }}</p>
  </div>
  <div class="icon-container">
    <div class="icon-background">
      <mat-icon [flIcon]="iconName()" class="card-icon"></mat-icon>
    </div>
  </div>
</div>
