<div class="comment-info-div">
  <a [routerLink]="profileRoute + comment.createdBy.id">
    <fl-user-inline [user]="comment.createdBy" [portalOnHover]="false"></fl-user-inline>
  </a>
  <span> - </span>
  <fl-from-now [date]="comment.createdAt" class="comment-info-date"></fl-from-now>
</div>

<te-text-editor
  [config]="textEditorConfig"
  [(ngModel)]="comment.content"
  [disabled]="true"
  class="comment-content">
</te-text-editor>
