<div
  (flInfiniteScroll)="loadMoreResults()"
  [flInfiniteDisabled]="datasource?.isLoading || datasource?.page?.last"
  flInfiniteMode="auto"
  class="comments-section-div g-scrollable-element">
  <div class="comments-section-header">
    <h4>{{ 'comments' | translate }} - {{ commentsNumber }}</h4>
  </div>
  @if (user()) {
    <fl-card class="comment-write-card">
      <fl-card-header>
        <fl-user-inline [user]="user()" [portalOnHover]="false"></fl-user-inline>
      </fl-card-header>
      <fl-card-body>
        <te-text-editor
          [config]="textEditorConfig"
          [(ngModel)]="commentInputData"
          [placeholder]="'write_a_comment' | translate"
          class="text-editor"
          (keydown.control.enter)="sendComment()"></te-text-editor>
      </fl-card-body>
      <fl-card-footer>
        <div class="comment-write-card-footer">
          @if (!commentInputData.isEmpty()) {
            <button
              mat-flat-button
              class="primary"
              [disabled]="isLoading"
              (click)="sendComment()">
              @if (isLoading) {
                <fl-button-loader></fl-button-loader>
              }
              @if (!isLoading) {
                {{ 'comment' | translate }}
              }
            </button>
          }

        </div>
      </fl-card-footer>
    </fl-card>
  } @else {
    <div class="login-div">
      <p>{{ 'login_to_post_a_comment' | translate }}</p>
      <a mat-flat-button class="primary" [routerLink]="loginRoute">{{
          'login' | translate
        }}</a>
    </div>
  }

  <div class="comments-list-div">
    @for (comment of datasource | flDatasourceConnect | async; track comment) {
      <ha-comment [comment]="comment"> </ha-comment>
    }
  </div>
</div>
