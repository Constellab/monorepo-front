<ha-page>
  <fl-infinite-scroll [datasource]="stories" infiniteMode="auto" class="section">
    <ha-list-of-items>
      @for (story of stories | flDatasourceConnect | async; track story) {
        <a [routerLink]="story | haDetailRoute">
          <co-story-list-item
            [story]="story"
            [imageLink]="getStoryImageLink(story.id, story?.mainPicture)"></co-story-list-item>
        </a>
      }
    </ha-list-of-items>
  </fl-infinite-scroll>
</ha-page>
