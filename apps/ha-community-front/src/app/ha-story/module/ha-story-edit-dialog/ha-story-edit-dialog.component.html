<fl-dialog-header>
  {{ 'create_story' | translate }}
</fl-dialog-header>

<mat-dialog-content>
  <form (ngSubmit)="submit()" id="story-form" [formGroup]="formGp">
    <mat-form-field class="g-form-input">
      <mat-label>{{ 'title' | translate }}</mat-label>
      <input
        matInput
        formControlName="title"
        required
        flInputMaxLength="100"
        [placeholder]="'title' | translate" />
      @if (formGp.get('title').hasError('required')) {
        <mat-error>{{ 'title' | flErrorRequired }}</mat-error>
      }
    </mat-form-field>


  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-flat-button type="submit" form="story-form" class="g-centered-forced primary">
    {{ 'save' | translate }}
    @if (isLoading) {
      <fl-button-loader></fl-button-loader>
    }
  </button>
</div>
