<ha-page
  [pageTitle]="'edit_story_page_title' | translate: { storyTitle: story?.title ?? '' }"
  [isLoading]="isLoading"
  [notFound]="notFound"
  [showPageDescription]="false">
  @if (story) {

      <form [formGroup]="formGp">

            {{ story.title }}

          <fl-update-image-container
            class="story-image-preview"
            [uploadConfig]="imageConfig"
            [deleteConfig]="deleteImageConfig"
            [showEditIcon]="!!story.mainPicture"
            [showDelete]="!isMainImageInContent()">
            <div
              class="story-image"
              [style.background-image]="
                story.mainPicture ? 'url(\'' + getStoryImageLink(story.mainPicture) + '\')' : null
              ">
              @if (!story.mainPicture) {
                <mat-icon class="image-placeholder"> add_a_photo </mat-icon>
              }
            </div>
          </fl-update-image-container>
        </div>

        <!--                [matChipInputFor]="topicChipList"-->

        <!--            <mat-autocomplete-->
        <!--              autoActiveFirstOption-->
        <!--              #auto="matAutocomplete"-->
        <!--              [displayWith]="displayFn"-->
        <!--              (optionSelected)="onSelectTopic($event)">-->
        <!--              @for (topic of filteredTopics | async; track topic) {-->
        <!--                <mat-option [value]="topic">-->
        <!--                  {{ topic.name }}-->
        <!--                </mat-option>-->
        <!--              }-->
        <!--            </mat-autocomplete>-->
        <!--            @if (canSaveTopic && story.topics.length < 5 && checkTopicControl()) {-->
        <!--              <mat-icon-->
        <!--                matSuffix-->
        <!--                (click)="saveTopic()"-->
        <!--                [matTooltip]="'create_new_story_topic' | translate"-->
        <!--                class="input-icon">-->
        <!--                save-->
        <!--              </mat-icon>-->
        <!--            }-->
        <!--          </mat-form-field>-->

        <div class="buttons-div">
          <div class="save-content-div">
            @if (story.status === 'DRAFT') {
              <div>
                <button
                  mat-flat-button
                  type="button"
                  *haIsAuthenticated
                  (click)="publish()"
                  [matTooltip]="'publish_the_story' | translate">
                  {{ 'publish_story' | translate }}
                  <mat-icon>publish</mat-icon>
                </button>
              </div>
            } @else if (contentModified || !syncWithBack) {
              <button
                mat-flat-button
                *haIsAuthenticated
                (click)="save()"
                [matTooltip]="'publish_story_with_modifications' | translate"
                [disabled]="!syncWithBack">
                {{ 'publish_story_modifications' | translate }}
              </button>
            }
            <div class="g-layout-row g-layout-between-center save-info">
              <te-text-editor-save
                [textEditor]="textEditor"
                [saveFunc]="saveContentEdition"></te-text-editor-save>
            </div>
          </div>

          <div class="right-bts-div">
            @if (isAuthor) {
              <button
                mat-icon-button
                type="button"
                class="co-author-bt"
                (click)="openCoAuthorDialog()"
                [matTooltip]="'open_coauthor_panel' | translate">
                <mat-icon>group_add</mat-icon>
              </button>
            }

            <button
              mat-icon-button
              type="button"
              (click)="openHistoryPanel()"
              class="add-file-button-author"
              [matTooltip]="'teTextEditor.open_modifications_history_panel' | translate">
              <mat-icon>history</mat-icon>
            </button>

            <button
              mat-icon-button
              [matTooltip]="'delete_story' | translate"
              type="button"
              (click)="openDeleteStoryConfirmDialog()"
              class="add-file-button-author warn">
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        </div>
        @if (contentHasError) {
          <span class="error-text">{{ contentError | translate }}</span>
        }
        <div class="story-content-form" [ngClass]="contentEditorIsFocused ? ['focus'] : []">
          <te-text-editor
            #textEditor
            class="border-none editor"
            [config]="textEditorConfig"
            [formControl]="contentEditionFormControl"></te-text-editor>
        </div>
      </form>
    </div>
  }
</ha-page>
