<fl-dialog-header>
  {{ 'add_brick_user' | translate }}
</fl-dialog-header>

<mat-dialog-content>
  <form (ngSubmit)="submit()" id="story-form" [formGroup]="formGp">
    <mat-form-field appearance="outline" class="g-full">
      <mat-label>{{ 'email' | translate }}</mat-label>
      <input matInput type="email" formControlName="email" />
      @if (formGp.get('email').hasError('required')) {
        <mat-error>{{ 'email' | flErrorRequired }}</mat-error>
      }
    </mat-form-field>
  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-flat-button type="submit" form="story-form" class="g-centered-forced primary">
    {{ 'save' | translate }}
    @if (isLoading) {
      <fl-button-loader></fl-button-loader>
    }
  </button>
</div>
