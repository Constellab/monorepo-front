server {
      listen 80;
      server_name gencovery.com;

      # Point to index.html
      root   /usr/share/nginx/html;
      index  index.html index.htm;


      # keep the normal behavior for the css theme and json files (translations)
      # not cachable because of the file names don't change on a new version
      location ~ (dark-theme\.css|light-theme\.css|\.json)$ {
        add_header Cache-Control "no-store";

        try_files $uri $uri/ /index.html;
      }

      # don't cache the index.html
      # set all rules here because this is the entry point of the app
      location ~ \.(html)$ {
        add_header Cache-Control "no-store";

        add_header X-Frame-Options "SAMEORIGIN";

        # Security header configuration
        add_header Cache-Control no-cache;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options nosniff;
        add_header X-Xss-Protection "1; mode=block" always;

        # CSP FOR LOCAL ENV contains localhost:3000 in src
        # DO NOT COMMIT THIS LINE UNCOMMENTED
        # add_header Content-Security-Policy "default-src 'self' 'unsafe-eval' localhost:3001; script-src-elem 'self' localhost:3010 data:; frame-src 'self'  *.preconstellab.com *.gencovery.io *.constellab.app https://www.google.com; worker-src  data: 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: http: https:  *.preconstellab.com; font-src 'self' data: http: https: fonts.googleapis.com; connect-src 'self' https://fonts.googleapis.com localhost:3000;";

        # CSP FOR PROD ENV
        # Domains allowed in the CSP. Substituted by envsubst in entrypoint.sh from the
        # CSP_ALLOWED_DOMAINS env variable, so a deployment can point the app at other
        # domains without rebuilding the image.
        set $ALLOWED_DOMAINS "${CSP_ALLOWED_DOMAINS}";
        # Domain of the constellab community, allowed in connect-src both as a plain host
        # source and as a wss:// one. Substituted from the COMMUNITY_CSP_ALLOWED_DOMAIN
        # env variable, same as above.
        set $COMMUNITY_DOMAIN "${COMMUNITY_CSP_ALLOWED_DOMAIN}";
        set $DEFAULT_SRC "default-src 'self'  $ALLOWED_DOMAINS";
        # script-src : https://www.google.com, https://www.gstatic.com
        set $SCRIPT_SRC_ELEM "script-src-elem 'self' $ALLOWED_DOMAINS https://www.google.com https://www.gstatic.com data:";
        # frame-src any url that is used to embed content in the page
        # https://udify.app to allow dify iframe chatbot
        set $FRAME_SRC "frame-src 'self' https://udify.app *";
        set $WORKER_SRC "worker-src  $ALLOWED_DOMAINS data: 'self' blob:";
        set $STYLE_SRC "style-src 'self' 'unsafe-inline'  $ALLOWED_DOMAINS https://fonts.googleapis.com";
        set $IMG_SRC "img-src 'self' blob: data: http: https:  $ALLOWED_DOMAINS";
        set $FONT_SRC "font-src 'self' data: http: https: fonts.googleapis.com";
        # $ALLOWED_DOMAINS and $COMMUNITY_DOMAIN are used to allow constellab community api url
        # https://cdn.jsdelivr.net/npm/@emoji-mart/data is used to allow the emoji-mart data
        # wss://* entries are needed for the community AI assistant (socket.io): a host source
        # without a scheme only matches the page scheme (https), so it does not cover the wss:// upgrade
        # https://www.google.com/recaptcha/ keeps its trailing slash on purpose: a path without
        # one is matched exactly, so it would not cover /recaptcha/api2/... (the captcha calls)
        set $CONNECT_SRC "connect-src 'self' $ALLOWED_DOMAINS $COMMUNITY_DOMAIN wss://$COMMUNITY_DOMAIN https://fonts.googleapis.com https://fonts.gstatic.com https://cdn.jsdelivr.net/npm/@emoji-mart/data https://www.google.com/recaptcha/";
        add_header Content-Security-Policy "${DEFAULT_SRC}; ${SCRIPT_SRC_ELEM}; ${FRAME_SRC}; ${WORKER_SRC}; ${STYLE_SRC}; ${IMG_SRC}; ${FONT_SRC}; ${CONNECT_SRC};";

        add_header Referrer-Policy "no-referrer-when-downgrade";
        add_header Feature-Policy "accelerometer 'none'; autoplay 'none'; camera 'none' encrypted-media 'none'; geolocation 'none'; gyroscope 'none'; magnetometer 'none'; microphone 'self'; midi 'none'; payment 'none'; speaker 'none'; vr 'none'; vibrate 'none'";

        try_files $uri $uri/ /index.html;
      }

      # cache all the css, js and ttf files for a weak
      location ~ \.(css|js|ttf)$ {
        # Cache duration : 1 week
        expires 604800;
        add_header Cache-Control "max-age=604800, public";
        try_files $uri $uri/ /index.html;
      }

      # redirect all the request to index.html
      location / {
        try_files $uri $uri/ /index.html;
      }
}
