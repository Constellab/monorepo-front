@if (lab$ | async; as lab) {
  <div>
    <fl-horizontal-nav-bar [items]="(navBarItems$ | async) ?? []" [smallScreenTitle]="lab.name">
      <fl-horizontal-nav-bar-title>
        <fl-text-icon>
          <mat-icon flIcon="lab"></mat-icon>
          <h1>{{ lab.name }}</h1>
        </fl-text-icon>
      </fl-horizontal-nav-bar-title>

      <fl-horizontal-nav-bar-actions class="g-layout-row g-layout-start-center">
        @if (labBadge$ | async; as badge) {
          <span
            class="lab-status-badge g-layout-row g-layout-start-center"
            [class.primary]="badge.variant === 'primary'"
            [class.warn]="badge.variant === 'warn'"
            [class.accent]="badge.variant === 'accent'">
            <span class="lab-status-dot"></span>
            <span>{{ badge.label | translate }}</span>
          </span>
        }
      </fl-horizontal-nav-bar-actions>
    </fl-horizontal-nav-bar>
  </div>
}
