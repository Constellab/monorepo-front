<div class="g-layout-row g-layout-between-center g-layout-gap-1em">
  <p class="g-text-light">{{ 'lab_users_section_help' | translate }}</p>

  @if (isOwner$ | async) {
    <button
      mat-flat-button
      type="button"
      class="primary add-button"
      (click)="openAddUserDialog()"
      [matTooltip]="'lab_user_create' | translate">
      <mat-icon>add</mat-icon>
      {{ 'lab_user_create_short' | translate }}
    </button>
  }
</div>

<fl-async-section [arrayObs]="datasource" emptyText="no_user_in_lab">
  <ng-container *flSectionBodyDatasource>
    <div class="g-infinite-table g-scrollable-element">
      <ca-lab-users-table [datasource]="datasource" [columns]="(columns$ | async) ?? []" [labId]="labId">
      </ca-lab-users-table>
    </div>
  </ng-container>
</fl-async-section>
