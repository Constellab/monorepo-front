<fl-async-section [arrayObs]="datasource" [emptyText]="emptyText" [nullOrEmptyIsValid]="true">
  <fl-section-header class="g-headline">
    <div class="g-layout-row g-layout-start-center">
      <a [routerLink]="completeListRoute" class="title-link">
        <fl-text-icon iconPosition="start">
          <mat-icon class="g-icon-background g-primary-background" [flIcon]="titleIcon"></mat-icon>
          <h2>{{ sectionTitle | translate }}</h2>
        </fl-text-icon>
      </a>

      <ng-content select="[section-header]"></ng-content>
    </div>
  </fl-section-header>

  <ng-container *flSectionBodyDatasource="datasource as items">
    <div class="grid-4-cols">
      @for (item of items; track item) {
        <a [routerLink]="item | caDetailRoute">
          <ng-template
            [ngTemplateOutlet]="templateRef"
            [ngTemplateOutletContext]="{ $implicit: item }"></ng-template>
        </a>
      }

      @if (showAddButton && datasource.page?.totalElements < maxItems) {
        <ca-add-card (click)="addClicked($event)" [cardTitle]="addText | translate"></ca-add-card>
      }
    </div>

    @if (datasource.page?.totalElements >= maxItems) {
      <div class="all-button">
        <fl-text-icon iconPosition="end" gap="0">
          <a class="g-text-link" [routerLink]="completeListRoute">
            {{ completeListText | translate }}
          </a>
          <mat-icon>chevron_right</mat-icon>
        </fl-text-icon>
      </div>
    }
  </ng-container>
</fl-async-section>
