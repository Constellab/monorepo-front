<fl-login-page [redirectionRoute]="redirectionRoute()" (loginSuccess)="onLoginSuccess()" class="login">
  <fl-login-footer>
    <div class="footer g-layout-row-wrap g-layout-between">
      <span
        class="g-text-light g-text-small g-text-link"
        (click)="openPasswordForgotten()"
        (keydown.enter)="openPasswordForgotten()"
        role="button"
        tabindex="0">
        {{ 'flAuth.forgot_password' | translate }}
      </span>
      <a class="g-primary-text g-text-small g-text-link" [routerLink]="signupRoute">
        {{ 'flAuth.signup_link' | translate }}
      </a>
    </div>
  </fl-login-footer>
</fl-login-page>
