<mat-table mat-table [dataSource]="datasource">
  <!-- Name -->
  <ng-container matColumnDef="name">
    <mat-header-cell *matHeaderCellDef class="g-column-width-2">
      <span> {{ 'name' | translate }}</span>
    </mat-header-cell>
    <mat-cell *matCellDef="let row" class="g-column-width-2">
      <div class="g-layout-row g-layout-start-center g-layout-gap-1em">
        <ca-hierarchy-object-icon [style]="row.style"></ca-hierarchy-object-icon>
        <div>{{ row.name }}</div>
      </div>
    </mat-cell>
  </ng-container>

  <!-- Size -->
  <ng-container matColumnDef="size">
    <mat-header-cell *matHeaderCellDef>
      <span> {{ 'document_size' | translate }}</span>
    </mat-header-cell>
    <mat-cell *matCellDef="let row">
      {{ row.size | flByteText }}
    </mat-cell>
  </ng-container>

  <!-- CreationInfo -->
  <ng-container matColumnDef="creationInfo">
    <mat-header-cell *matHeaderCellDef>
      <span> {{ 'upload_info' | translate }}</span>
    </mat-header-cell>
    <mat-cell *matCellDef="let row">
      <fl-user-with-date [user]="row.createdBy" [date]="row.createdAt"></fl-user-with-date>
    </mat-cell>
  </ng-container>

  <!-- Actions -->
  <ng-container matColumnDef="actions">
    <mat-header-cell class="g-table-icon-button-cell" *matHeaderCellDef> </mat-header-cell>
    <mat-cell class="g-table-icon-button-cell" *matCellDef="let row">
      <button mat-icon-button type="button" (click)="openDocumentActionMenu(row, $event)">
        <mat-icon>more_vert</mat-icon>
      </button>
    </mat-cell>
  </ng-container>

  <mat-header-row *matHeaderRowDef="columns; sticky: true"></mat-header-row>

  <!-- Mode selectable -->
  <mat-row
    *matRowDef="let row; columns: columns"
    class="g-table-row-selectable"
    (click)="openDocumentPreview(row)"></mat-row>
</mat-table>
