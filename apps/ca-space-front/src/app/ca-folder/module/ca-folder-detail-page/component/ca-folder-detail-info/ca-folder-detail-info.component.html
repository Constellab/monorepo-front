<fl-section-header>
  <fl-text-icon>
    <mat-icon>info</mat-icon>
    <h3>{{ 'info' | translate }}</h3>
  </fl-text-icon>

  <fl-section-actions>
    @if (canEditFolder()) {
      <button
        mat-icon-button
        type="button"
        (click)="openUpdateFolderDialog()"
        [matTooltip]="'update_folder' | translate">
        <mat-icon>edit</mat-icon>
      </button>
    }
  </fl-section-actions>
</fl-section-header>

@if (folder()) {
  <div class="grid">
    <fl-text-icon>
      <mat-icon>label</mat-icon>
      {{ 'name' | translate }}
    </fl-text-icon>

    <div>{{ folder().name }}</div>

    @if (folder().code) {
      <fl-text-icon>
        <mat-icon>badge</mat-icon>
        {{ 'code' | translate }}
      </fl-text-icon>
      <div>{{ folder().code }}</div>
    }

    @if (folder().startingDate || folder().endingDate) {
      <fl-text-icon>
        <mat-icon>event</mat-icon>
        {{ 'date' | translate }}
      </fl-text-icon>

      <fl-date-range [startingDate]="folder().startingDate" [endingDate]="folder().endingDate">
      </fl-date-range>
    }
  </div>
}
