@if (folder$ | async; as folder) {
  <div class="g-layout-row g-layout-between-start">
    <div class="g-layout-row-wrap g-layout-start-center">
      <ca-hierarchy-object-icon
        [style]="folder.style"
        [caNotificationMark]="folder.id"></ca-hierarchy-object-icon>
      <h1
        class="folder-title"
        flElementEditable
        [flElementDisabled]="(canEdit$ | async) === false"
        (flElementValueChange)="renameFolder($event, folder)">
        {{ folder.name }}
      </h1>
    </div>
  </div>
}

<fl-tag-list class="g-text-small" [tags]="tags" [showNoTagMessage]="false"></fl-tag-list>
