@if (isLoading()) {
  <div class="ca-note-form-block-loading">
    <fl-loader></fl-loader>
  </div>
} @else if (form(); as f) {
  @if (values(); as vals) {
    @if (specs(); as specsVal) {
      <div class="ca-note-form-block-header">
        <div class="ca-note-form-block-header-left">
          <span class="ca-note-form-block-name">{{ f.name }}</span>
          @if (f.template; as t) {
            <span class="ca-note-form-block-template">
              <mat-icon flIcon="form_template" class="ca-note-form-block-template-icon"></mat-icon>
              {{ t.template_name }}
              @if (t.version_number) {
                (v{{ t.version_number }})
              }
            </span>
          }
        </div>
        <div class="ca-note-form-block-header-right">
          @if (formStatus(); as status) {
            <fl-status-chip [status]="status" />
          }
        </div>
      </div>
      <td-param-table [values]="vals" [specs]="specsVal" />
    }
  }
}
