<fl-async-section [object]="richText$" class="g-full-height">
  <ng-container *flSectionBody="richText$ as richText">
    <te-text-editor
      [ngModel]="richText"
      [disabled]="true"
      class="g-full-height g-print-section g-scrollable-element"
      [config]="textEditorConfig"></te-text-editor>
  </ng-container>
</fl-async-section>
