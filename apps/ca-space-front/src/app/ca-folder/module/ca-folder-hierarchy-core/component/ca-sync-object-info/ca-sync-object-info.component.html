@if (object) {
  <div class="g-layout-row-wrap g-layout-start-center g-layout-gap-05em">
    @if (showText) {
      <div>{{ 'last_sync' | translate }} :</div>
    }
    @if (object.lastSyncBy; as syncBy) {
      @if (object.lastSyncAt; as syncAt) {
        <fl-user-with-date [user]="syncBy" [date]="syncAt"></fl-user-with-date>
      }
    }
  </div>
}
