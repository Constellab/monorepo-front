<fl-card>
  <fl-card-header>
    <fl-text-icon>
      <mat-icon class="g-icon-big">apps</mat-icon>
      <h2>{{ 'constellab_suite' | translate }}</h2>
    </fl-text-icon>

    <fl-card-actions>
      <!--   Constellab Suite   -->
      <button mat-flat-button type="button" (click)="downloadConstellabSuite()">
        <mat-icon>cloud_download</mat-icon>
        {{ 'download_constellab_suite' | translate }}
      </button>

      <fl-input-file-container [placeholder]="'upload_constellab_suite' | translate" icon="cloud_upload">
        <input
          flInputFile
          [multiple]="false"
          type="file"
          (fileChange)="uploadConstellabSuite($any($event))"
          accept="application/json" />
      </fl-input-file-container>
    </fl-card-actions>
  </fl-card-header>
</fl-card>
