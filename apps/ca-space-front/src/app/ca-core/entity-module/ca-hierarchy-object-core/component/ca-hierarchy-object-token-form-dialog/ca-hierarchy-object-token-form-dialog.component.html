<fl-dialog-header>
  {{ title | translate }}
</fl-dialog-header>

<mat-dialog-content>
  <form (ngSubmit)="submit()" id="hierarchy-object-token-form" [formGroup]="formGp">
    <p class="help-text">{{ 'hierarchy_object_token_help' | translate }}</p>

    <!--    Valid until      -->
    <mat-form-field class="g-form-input">
      <mat-label>{{ 'hierarchy_object_token_expiration_date' | translate }}</mat-label>
      <input
        matInput
        formControlName="expirationDate"
        [matDatepicker]="endingPicker"
        [placeholder]="'hierarchy_object_token_expiration_date' | translate" />
      <mat-datepicker-toggle matSuffix [for]="endingPicker"></mat-datepicker-toggle>
      <mat-datepicker #endingPicker startView="month"></mat-datepicker>
      <mat-hint>{{ 'hierarchy_object_token_expiration_date_empty' | translate }}</mat-hint>
    </mat-form-field>
  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-flat-button type="submit" form="hierarchy-object-token-form" class="g-centered-forced primary">
    {{ 'save' | translate }}
    @if (isLoading) {
      <fl-button-loader></fl-button-loader>
    }
  </button>
</div>
