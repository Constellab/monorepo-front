<fl-dialog-header>
  {{ data.title | flTranslatableText | async }}
</fl-dialog-header>

<mat-dialog-content>
  <p class="g-text-light help-text">{{ data.helpText | flTranslatableText | async }}</p>

  <fl-async-section [object]="data.labConfig">
    <ng-container *flSectionBody="data.labConfig as conf">
      <ca-lab-config [labConfig]="conf" [showDetailButton]="data.showDetailButton ?? true"></ca-lab-config>
    </ng-container>
  </fl-async-section>
</mat-dialog-content>
