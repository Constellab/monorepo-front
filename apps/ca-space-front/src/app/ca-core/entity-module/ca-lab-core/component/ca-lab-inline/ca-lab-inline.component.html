@if (lab()) {
  <fl-text-icon>
    <mat-icon [matTooltip]="lab().typeObj.tooltip | translate">
      {{ lab().typeObj.icon }}
    </mat-icon>

    @if (useLink()) {
      <a [routerLink]="lab().id | caDetailRoute: 'lab'" class="g-text-link">
        <span>{{ lab().name }}</span>
      </a>
    } @else {
      <span>{{ lab().name }}</span>
    }
  </fl-text-icon>
}
