<fl-card class="card" matRipple>
  <fl-card-header>
    <div class="g-layout-row g-layout-start-center g-layout-gap-05em">
      <ca-icon-container icon="group" class="primary"></ca-icon-container>
      <div class="title g-text-dense-height">{{ team.label }}</div>
    </div>
  </fl-card-header>

  <fl-card-body class="body">
    <fl-user-inline [user]="team.createdBy"></fl-user-inline>
    <div class="g-layout-row g-layout-end">
      <fl-text-icon class="dates g-text-light g-text-small">
        <mat-icon class="g-icon-small">access_time</mat-icon>
        <fl-from-now [date]="team.createdAt"></fl-from-now>
      </fl-text-icon>
    </div>
  </fl-card-body>
</fl-card>
