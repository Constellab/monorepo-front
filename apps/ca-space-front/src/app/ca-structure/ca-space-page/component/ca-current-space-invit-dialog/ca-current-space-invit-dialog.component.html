<fl-dialog-header>
  <fl-text-icon>
    <mat-icon class="g-icon-big">email</mat-icon>
    <h2>{{ 'space_invitation_list' | translate }}</h2>
  </fl-text-icon>

  <fl-dialog-header-actions>
    <button
      mat-icon-button
      type="button"
      (click)="openInvitationDialog()"
      [matTooltip]="'create_invitation' | translate">
      <mat-icon>add</mat-icon>
    </button>
  </fl-dialog-header-actions>
</fl-dialog-header>

<mat-dialog-content>
  <fl-infinite-scroll [datasource]="invitations" class="g-infinite-table">
    <ca-space-invit-table [datasource]="invitations"></ca-space-invit-table>
  </fl-infinite-scroll>
</mat-dialog-content>
