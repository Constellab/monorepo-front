<fl-card class="g-full-height">
  <fl-card-header>
    <!--  Center header  -->
    <fl-search-header>
      <fl-text-icon>
        <mat-icon flIcon="folder"></mat-icon>
        <h2>{{ 'folders' | translate }}</h2>
      </fl-text-icon>
    </fl-search-header>
  </fl-card-header>

  <fl-card-body class="g-full-height">
    <fl-search>
      <!-- Advanced section in the right in a drawer -->
      <fl-search-advanced-form>
        <ca-hierarchy-object-admin-search-form></ca-hierarchy-object-admin-search-form>
      </fl-search-advanced-form>

      <fl-search-result>
        <ca-hierarchy-object-table
          [rowSelectable]="true"
          (rowEvent)="navigateToObject($event)"
          [datasource]="datasource"
          [columns]="columns"
          [showTrashIcon]="true">
          <ng-template let-object>
            <button mat-icon-button type="button" (click)="openHierarchyObjectActionMenu(object, $event)">
              <mat-icon flIcon="more_vert"></mat-icon>
            </button>
          </ng-template>
        </ca-hierarchy-object-table>
      </fl-search-result>
    </fl-search>
  </fl-card-body>
</fl-card>
