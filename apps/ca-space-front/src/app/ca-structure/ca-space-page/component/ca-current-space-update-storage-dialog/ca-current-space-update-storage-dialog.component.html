<fl-dialog-header>
  {{ 'update_space_storage' | translate }}
</fl-dialog-header>

<mat-dialog-content>
  <form (ngSubmit)="submit()" id="space-storage-form" [formGroup]="formGp">
    <!--  Code  -->
    <mat-form-field class="g-form-input code">
      <mat-label>{{ 'storage_limit' | translate }}</mat-label>
      <input
        matInput
        formControlName="limit"
        required
        type="number"
        [placeholder]="'storage_limit' | translate" />
      @if (formGp.get('limit')?.hasError('required')) {
        <mat-error>{{ 'storage_limit' | flErrorRequired }}</mat-error>
      }

      <mat-hint>
        {{ formGp.get('limit')?.value | flByteText }}
      </mat-hint>
    </mat-form-field>
  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-flat-button type="submit" form="space-storage-form" class="centered primary">
    {{ 'save' | translate }}
    @if (isLoading) {
      <fl-button-loader></fl-button-loader>
    }
  </button>
</div>
