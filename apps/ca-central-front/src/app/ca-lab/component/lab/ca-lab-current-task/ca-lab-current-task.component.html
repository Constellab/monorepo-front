<div *ngIf="currentTask$ | async as currentTask" class="g-layout-row g-layout-start-center info-section">
  <fl-loader size="small" class="task-loader"></fl-loader>

  <div>
    @if (showConfigRouteLink) {
      <a [routerLink]="configRoute" class="g-text-link" [matTooltip]="'lab_open_config_tab' | translate">{{
        currentTask
      }}</a>
    } @else {
      {{ currentTask }}
    }
  </div>
</div>
