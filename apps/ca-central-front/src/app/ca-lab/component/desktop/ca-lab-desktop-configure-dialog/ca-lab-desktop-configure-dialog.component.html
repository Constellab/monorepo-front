<fl-dialog-header>
  {{ 'download_desktop_config' | translate }}
</fl-dialog-header>

<mat-dialog-content>
  <form (ngSubmit)="submit()" [formGroup]="formGp" id="lab-desktop-form">
    <!--  Open ai api key  -->
    <mat-form-field class="g-form-input">
      <mat-label>{{ 'lab_desktop_open_ai_api_key' | translate }}</mat-label>
      <input
        [placeholder]="'lab_desktop_open_ai_api_key' | translate"
        formControlName="openaiApiKey"
        matInput />

      <mat-hint>{{ 'lab_desktop_open_ai_api_key_help' | translate }}</mat-hint>
    </mat-form-field>
  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button class="g-centered-forced" color="primary" form="lab-desktop-form" mat-flat-button type="submit">
    {{ 'download_desktop_config' | translate }}
    @if (isLoading) {
      <fl-button-loader></fl-button-loader>
    }
  </button>
</div>
