<fl-card>
  <fl-card-body>
    <fl-section [object]="labConfig" [isLoading]="getIsLoading">

      <ng-container *flSectionBody>


        <ca-lab-config-form [(labConfig)]="labConfig"
                                     (labConfigChange)="onNewConfig()"
                                     [showAdvanced]="false"
                                     [warningOnRemoveBrick]="false"></ca-lab-config-form>

        <p *ngIf="configHasChanged" class="help-text g-warn-text">
          {{ 'lab_config_changed' | translate }}
        </p>
        <button mat-flat-button color="primary" type="button" (click)="saveConfig()"
                class="g-centered-forced save-button">
          {{ 'save' | translate }}
          <fl-button-loader *ngIf="saveIsLoading"></fl-button-loader>
        </button>
      </ng-container>
    </fl-section>
  </fl-card-body>
</fl-card>
