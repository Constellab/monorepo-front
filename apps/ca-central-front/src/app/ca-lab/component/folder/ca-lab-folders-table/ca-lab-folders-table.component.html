<mat-table mat-table [dataSource]="datasource">
  <!-- Folder -->
  <ng-container matColumnDef="folder">
    <mat-header-cell *matHeaderCellDef>
      <span>{{ 'folder' | translate }}</span>
    </mat-header-cell>
    <mat-cell *matCellDef="let labFolder">
      <ca-hierarchy-object-inline [hierarchyObject]="labFolder.rootFolder"></ca-hierarchy-object-inline>
    </mat-cell>
  </ng-container>

  <!-- createdBy -->
  <ng-container matColumnDef="createdBy">
    <mat-header-cell *matHeaderCellDef>
      <span>{{ 'lab_added_by' | translate }}</span>
    </mat-header-cell>
    <mat-cell *matCellDef="let labUser">
      <fl-user-inline [user]="labUser.createdBy"></fl-user-inline>
    </mat-cell>
  </ng-container>

  <!-- createdAt -->
  <ng-container matColumnDef="createdAt">
    <mat-header-cell *matHeaderCellDef>
      <span>{{ 'lab_user_added_at' | translate }}</span>
    </mat-header-cell>
    <mat-cell *matCellDef="let labUser">
      <span>{{ labUser.createdAt | flDate }}</span>
    </mat-cell>
  </ng-container>

  <!-- Action -->
  <ng-container matColumnDef="actions">
    <mat-header-cell *matHeaderCellDef class="g-table-icon-button-cell"> </mat-header-cell>
    <mat-cell *matCellDef="let lab" class="g-table-icon-button-cell">
      <!--   Mat menu containing action buttons   -->
      <button mat-icon-button [matMenuTriggerFor]="menu">
        <mat-icon>more_vert</mat-icon>
      </button>
      <mat-menu #menu="matMenu" xPosition="before">
        <button mat-menu-item type="button" (click)="syncLabFolder(lab)">
          <mat-icon>sync</mat-icon>
          <span>{{ 'sync_lab_folder' | translate }}</span>
        </button>
        <button mat-menu-item type="button" (click)="openDeleteFolderDialog(lab)">
          <mat-icon color="warn">delete</mat-icon>
          <span class="g-warn-text">{{ 'lab_remove_folder' | translate }}</span>
        </button>
      </mat-menu>
    </mat-cell>
  </ng-container>

  <mat-header-row *matHeaderRowDef="columns; sticky: true"></mat-header-row>
  <mat-row *matRowDef="let row; columns: columns"></mat-row>
</mat-table>
