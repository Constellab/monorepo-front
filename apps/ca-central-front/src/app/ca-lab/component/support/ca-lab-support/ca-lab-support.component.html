<fl-card>
  <fl-card-header>
    <fl-text-icon>
      <mat-icon>support</mat-icon>
      <h2>{{ 'lab_support' | translate }}</h2>
    </fl-text-icon>

    <fl-card-actions>
      <button
        mat-stroked-button
        type="button"
        class="g-button-small actions-button"
        (click)="openUpdateDialog()"
        *caIsAdmin>
        <mat-icon>edit</mat-icon>
        {{ 'update' | translate }}
      </button>
    </fl-card-actions>
  </fl-card-header>

  <fl-card-body> </fl-card-body>
</fl-card>
