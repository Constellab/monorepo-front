  <div>{{ 'language' | translate }}</div>
  <mat-form-field>
    <mat-label>{{ 'language' | translate }}</mat-label>
    <mat-select [(ngModel)]="language" (selectionChange)="onLangChange($event)"
                [placeholder]="'language' | translate">

    </mat-select>
  </mat-form-field>
</div>
