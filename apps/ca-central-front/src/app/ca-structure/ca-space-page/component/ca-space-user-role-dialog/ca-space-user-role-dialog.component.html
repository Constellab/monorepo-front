<fl-dialog-header>
  {{ 'space_update_role' | translate }}
</fl-dialog-header>

<mat-dialog-content>
  <form (ngSubmit)="submit()" id="space-role-form">
    <mat-form-field class="g-form-input" appearance="outline">
      <mat-label>{{ 'role' | translate }}</mat-label>
      <mat-select [formControl]="formControl" [placeholder]="'role' | translate">
        @for (role of availableRoles | flObjectKeys; track role) {
          <mat-option [value]="role">
            {{ role }}
          </mat-option>
        }
      </mat-select>
      @if (formControl.hasError('required')) {
        <mat-error>
          {{ 'role' | flErrorRequired }}
        </mat-error>
      }
    </mat-form-field>
  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-raised-button type="submit" form="space-role-form" class="g-centered-forced primary">
    {{ 'save' | translate }}
    @if (isLoading) {
      <fl-button-loader></fl-button-loader>
    }
  </button>
</div>
