<fl-card *ngIf="space$ | async as space">
  <fl-card-header>

    <fl-card-actions>
      <ng-container *caIsSpaceAdmin>

        <button mat-stroked-button class="g-button-small button" type="button"
                *caIsSpaceAdmin (click)="openRequestNewLicense()">
          {{ 'request_new_licenses' | translate }}
        </button>

        <button mat-icon-button type="button" class="button" (click)="openUpdateLicense(spaceSettings.nbLicenses)"
                [matTooltip]="'update_space_license' | translate" *caIsAdmin>
          <mat-icon>edit</mat-icon>
        </button>

        <button mat-icon-button type="button" class="button" color="warn" (click)="openDeleteSpace(space)"
                [matTooltip]="'delete_space' | translate">
          <mat-icon>delete</mat-icon>
        </button>
      </ng-container>
    </fl-card-actions>
  </fl-card-header>

  <fl-card-body>
    <div class="g-layout-col g-layout-start-center">
      <fl-update-image-container [uploadConfig]="imageConfig$ | async" [deleteConfig]="deleteImageConfig | async"
                       [showDelete]="!!space.photo"
                       (imageChanged)="onSpaceUpdate($event)" (imageDeleted)="onSpaceUpdate($event)">
        <ca-space-photo size="big" [space]="space$"></ca-space-photo>
      </fl-update-image-container>
      <h1 class="title" flElementEditable
          (flElementValueChange)="updateSpaceName($event)"
          [flElementDisabled]="!isSpaceAdmin">{{ space.name }}</h1>
    </div>

    <fl-key-value>
      <fl-key>{{ 'space_domain' | translate }}</fl-key>
      {{ space.domain }}
    </fl-key-value>


    <fl-key-value>
      <fl-key>{{ 'nb_of_licenses' | translate }}</fl-key>
      {{ spaceSettings.nbLicenses }}
    </fl-key-value>
  </fl-card-body>
</fl-card>
