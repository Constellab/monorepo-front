<div class="section">
  <fl-text-icon>
    <mat-icon>settings</mat-icon>
    <h2>{{ 'folder_settings' | translate }}</h2>
  </fl-text-icon>

  <ca-folder-detail-info class="g-section"></ca-folder-detail-info>

  @if (folder$ | async; as folder) {
    <div class="g-layout-row g-layout-between-center">
      <fl-text-ok-nok [value]="folder.chatEnabled"
                      [okText]="'folder_chat_activated' | translate"
                      [nokText]="'folder_chat_deactivated' | translate">
      </fl-text-ok-nok>

      <button mat-stroked-button type="button" class="g-button-small"
              (click)="toggleChat(folder)">
        @if (folder.chatEnabled) {
          {{ 'folder_deactivate_chat' | translate }}
        } @else {
          {{ 'folder_activate_chat' | translate }}
        }
      </button>
    </div>
  }

  <ca-folder-storage-settings class="g-section" *ngIf="showStorageSettings$ | async"></ca-folder-storage-settings>

  <ca-folder-storage-usage-section class="g-section"></ca-folder-storage-usage-section>

</div>
