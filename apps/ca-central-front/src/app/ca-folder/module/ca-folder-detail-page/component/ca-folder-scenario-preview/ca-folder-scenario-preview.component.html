<fl-async-section [object]="scenario$" class="section g-scrollable-element" cdkScrollable>
  <ng-container *flSectionBody="scenario$ as scenario">
    <div class="g-layout-row g-layout-between header">
      <fl-text-icon>
        <mat-icon flIcon="scenario"></mat-icon>
        <h2 class="title g-text-dense-height">{{ scenario.title }}</h2>
      </fl-text-icon>

      <div>
        <a mat-stroked-button class="g-button-small" [routerLink]="scenario | caDetailRoute">
          {{ 'open_details' | translate }}
        </a>
      </div>
    </div>

    <ca-scenario-card-detail [scenario]="scenario" [showCardHeader]="false"></ca-scenario-card-detail>
  </ng-container>
</fl-async-section>
