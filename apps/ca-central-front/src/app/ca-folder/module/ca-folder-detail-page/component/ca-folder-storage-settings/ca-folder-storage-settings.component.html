<fl-async-section [object]="folderStorage" [nullOrEmptyIsValid]="true">
  <fl-section-header>
    <fl-text-icon>
      <mat-icon>storage</mat-icon>
      <h3>{{ 'folder_storage' | translate }}</h3>
    </fl-text-icon>
  </fl-section-header>

  <ng-container *flSectionBody="folderStorage as bucket">
    <div class="body">
      <!--   Main bucket   -->
      <fl-text-ok-nok
        [value]="!!bucket.mainStorage"
        [okText]="'folder_main_storage_configured' | translate"
        [nokText]="'folder_main_storage_not_configured' | translate">
      </fl-text-ok-nok>
      <ca-bucket-location-inline
        *ngIf="bucket.mainStorage"
        [bucketLocation]="bucket.mainStorage"></ca-bucket-location-inline>

      <!--  Backup bucket    -->
      <fl-text-ok-nok
        [value]="!!bucket.backupStorage"
        [okText]="'folder_backup_storage_configured' | translate"
        [nokText]="'folder_backup_storage_not_configured' | translate"
        class="backup">
      </fl-text-ok-nok>
      <ca-bucket-location-inline
        *ngIf="bucket.backupStorage"
        [bucketLocation]="bucket.backupStorage"></ca-bucket-location-inline>

      <div class="g-text-centered configure-button" *ngIf="!bucket.mainStorage || !bucket.backupStorage">
        <button mat-stroked-button type="button" (click)="configureStorage()">
          {{ 'configure_folder_storage' | translate }}
        </button>
      </div>
    </div>
  </ng-container>
</fl-async-section>
