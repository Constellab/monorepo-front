@if (scenario.isValidated) {
  <!--  Validated info  -->
  <ca-validated-object-info
    class="separator"
    [object]="scenario"
    *ngIf="scenario.isValidated"></ca-validated-object-info>
}

<!-- Sync ino -->
<ca-sync-object-info class="separator" [object]="scenario"></ca-sync-object-info>

<div>
  <!-- Description-->
  @if (!(scenario.description | teRichTextIsEmpty)) {
    <te-text-editor
      [ngModel]="scenario.description"
      [disabled]="true"
      [config]="textEditorConfig"
      class="g-scrollable-element"></te-text-editor>
  }
</div>
