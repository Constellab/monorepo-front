<fl-card>
  <fl-card-header>
    <fl-text-icon>
      <mat-icon flIcon="protocol"></mat-icon>
      <h2>{{ 'technical_report' | translate }}</h2>
    </fl-text-icon>
    <fl-card-actions>
      <button mat-stroked-button (click)="openLabConfigDialog()">{{ 'view_lab_config' | translate }}</button>
    </fl-card-actions>
  </fl-card-header>

  <fl-card-body>
    @if (workflow) {
      <mat-tab-group mat-align-tabs="start" animationDuration="0ms" dynamicHeight>
        <mat-tab label="{{ 'protocol' | translate }}">
          <ng-template matTabContent>
            <div class="tech-report-workflow">
              <pr-workflow
                [workflow]="workflow"
                [mode$]="workflowMode$"
                [viewConfig]="workflowConfig"></pr-workflow>
            </div>
          </ng-template>
        </mat-tab>
        <mat-tab label="{{ 'list' | translate }}">
          <ng-template matTabContent>
            <ca-scenario-technical-report-graph
              [graph]="technicalReport.data.graph"></ca-scenario-technical-report-graph>
          </ng-template>
        </mat-tab>
      </mat-tab-group>
    } @else {
      <div class="g-text-light g-text-centered">
        <p>{{ 'no_technical_report' | translate }}</p>
      </div>
    }
  </fl-card-body>
</fl-card>
