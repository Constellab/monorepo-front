@if (experiment.isValidated) {
  <!--  Validated info  -->
  <ca-validated-object-info class="separator" [object]="experiment"
                            *ngIf="experiment.isValidated"></ca-validated-object-info>
}

<!-- Sync ino -->
<ca-sync-object-info class="separator" [object]="experiment"></ca-sync-object-info>

<div>
  <!-- Description-->
  @if (!(experiment.description | teRichTextIsEmpty)) {
    <te-text-editor [ngModel]="experiment.description" [disabled]="true"
                    [config]="textEditorConfig" class="g-scrollable-element"></te-text-editor>
  }
</div>
