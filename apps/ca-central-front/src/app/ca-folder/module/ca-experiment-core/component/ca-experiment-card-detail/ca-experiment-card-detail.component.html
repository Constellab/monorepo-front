<fl-card class="g-full card">

  @if(showCardHeader){
  <fl-card-header>
    <fl-text-icon>
      <mat-icon flIcon="experiment"></mat-icon>
      <h2 class="title g-text-dense-height">{{ experiment.title }}</h2>
    </fl-text-icon>

    <fl-card-actions>
      <fl-status-chip [status]="experiment.status"></fl-status-chip>
    </fl-card-actions>
  </fl-card-header>
  }


  <fl-card-body>
    <ca-experiment-info [experiment]="experiment"></ca-experiment-info>

    <div class="g-text-centered open-button">
      <a *ngIf="experimentRoute" [href]="experimentRoute" mat-stroked-button>
        {{ 'open_experiment_in_lab' | translate }}
        <mat-icon>arrow_forward_ios</mat-icon>
      </a>
    </div>
  </fl-card-body>

</fl-card>
