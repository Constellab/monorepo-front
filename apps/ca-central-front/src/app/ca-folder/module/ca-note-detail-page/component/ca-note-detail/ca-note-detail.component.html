<fl-card class="container g-layout-col">
  <fl-card-header>
    <div class="g-layout-row g-layout-start-center g-layout-gap-05em">
      <ca-hierarchy-object-icon [style]="note.style"></ca-hierarchy-object-icon>
      <h1>{{ note.title }}</h1>
    </div>

    <fl-card-actions class="g-print-hide">
      <button
        mat-stroked-button
        type="button"
        (click)="openScenariosListDialog()"
        class="g-button-small button">
        {{ 'scenarios' | translate }}
        <mat-icon flIcon="scenario"></mat-icon>
      </button>

      <button mat-stroked-button type="button" (click)="printNote()" class="g-button-small button">
        {{ 'print_note' | translate }}
        <mat-icon>print</mat-icon>
      </button>

      <button mat-icon-button (click)="openActionMenu(note, $event)">
        <mat-icon>more_vert</mat-icon>
      </button>
    </fl-card-actions>
  </fl-card-header>

  <fl-card-body>
    <div class="g-print-hide">
      <fl-tag-list class="g-text-small" [tags]="tags" [showNoTagMessage]="false"></fl-tag-list>

      <!--  Validated info  -->
      @if (note.isValidated) {
        <ca-validated-object-info class="g-text-small" [object]="note"></ca-validated-object-info>
      }

      <!-- Sync info -->
      <ca-sync-object-info class="g-text-small" [object]="note"></ca-sync-object-info>

      <!--  Created by & Last modified bt  -->
      <fl-creation-info
        class="g-text-small g-text-light"
        [user]="note.createdBy"
        [date]="note.createdAt"></fl-creation-info>
      <fl-last-modification-info
        class="g-text-small g-text-light"
        [user]="note.lastModifiedBy"
        [date]="note.lastModifiedAt"></fl-last-modification-info>

    </div>

    <ca-note-content [noteId]="note.id" class="note-content"></ca-note-content>
  </fl-card-body>
</fl-card>
