<div class="g-full-height drawer g-layout-col"
     *ngIf="nodeSelected$ | async as nodeSelected">


  <div class="g-layout-row g-layout-between-center">
    <div class="g-text-big title">
      {{nodeSelected.title()}}
    </div>

    <button mat-icon-button type="button" flDrawerClose tabindex="-1"
            [matTooltip]="'close' | translate">
      <mat-icon>clear</mat-icon>
    </button>
  </div>


  <div class="g-flex-auto">

    <div *ngIf="nodeSelected.objectSignal()">
      <fl-key-value class="kv">
        <fl-key>{{'node_process_name' | translate}}</fl-key>
        {{nodeSelected.currentObject.instanceName}}
      </fl-key-value>

      <fl-key-value *ngIf="nodeSelected.objectSignal().config | flIsNotEmpty" class="kv">
        <fl-key>
            {{'config' | translate}}
        </fl-key>
        <fl-pretty-json [object]="nodeSelected.objectSignal().config.values" [dense]="true"
                        *ngIf="nodeSelected.objectSignal().config.values | flIsNotEmpty"></fl-pretty-json>
        <button mat-stroked-button type="button"
                (click)="openConfigInfo(nodeSelected.objectSignal().config)" class="g-button-small">
          <mat-icon>info</mat-icon>
          <span>{{'detail' | translate}}</span>
        </button>
      </fl-key-value>


      <!--          <button mat-stroked-button type="button" class="g-button-small doc-button"-->
      <!--                  (click)="openTypingDoc(process.processTypingName)">-->
      <!--            {{'biox.process_type_doc' | translate}}-->
      <!--            <mat-icon>info</mat-icon>-->
      <!--          </button>-->
    </div>

  </div>

</div>
