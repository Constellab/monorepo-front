<fl-async-section [object]="experiment$" class="section g-scrollable-element" cdkScrollable>

  <ng-container *flSectionBody="experiment$ as experiment">
    <div class="g-layout-row g-layout-between header">

      <fl-text-icon>
        <mat-icon flIcon="experiment"></mat-icon>
        <h2 class="title g-text-dense-height">{{ experiment.title }}</h2>
      </fl-text-icon>

      <div>
        <a mat-stroked-button class="g-button-small"
           [routerLink]="experiment | caDetailRoute">
          {{ 'open_details' | translate }}
        </a>
      </div>
    </div>

    <ca-experiment-card-detail [experiment]="experiment" [showCardHeader]="false"></ca-experiment-card-detail>

  </ng-container>
</fl-async-section>
