<fl-dialog-header>
  {{'project_shared_groups' | translate}}
</fl-dialog-header>

<mat-dialog-content>
  <fl-async-section [arrayObs]="users$" class="g-full-height">

    <ng-container *flSectionBody="let users">


      <div *ngFor="let user of users" class="g-layout-row g-layout-between-center">
        <fl-user-inline [user]="user"></fl-user-inline>

        <button mat-icon-button type="button" (click)="openUnshareDialog(user)"
                [matTooltip]="'unshare' | translate" *ngIf="canEdit$ | async" color="warn">
          <mat-icon>clear</mat-icon>
        </button>
      </div>

      <button mat-stroked-button type="button" (click)="openShareDialog()"
              *ngIf="canEdit$ | async" class="share-button">
        <mat-icon>share</mat-icon>
        <span>{{'share' | translate}}</span>
      </button>

    </ng-container>

  </fl-async-section>
</mat-dialog-content>
