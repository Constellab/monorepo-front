<div class="container">

  @if (report$ | async; as report) {
    <div class="g-layout-row g-layout-between header">

      <fl-text-icon>
        <mat-icon flIcon="report"></mat-icon>
        <h2 class="title">{{ report.title }}</h2>
      </fl-text-icon>

      <div>
        <a mat-stroked-button class="g-button-small"
           [routerLink]="report | caDetailRoute">
          {{ 'open_details' | translate }}
        </a>
      </div>
    </div>
  }

  <ca-report-content [reportId]="reportId" class="report-content"></ca-report-content>
</div>
