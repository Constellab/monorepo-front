
@if(isFolder()){
  <ca-project-actions-menu [projectInfo]="projectInfo()"
                           [stopClickEvent]="true"
                           (projectAction)="onProjectAction($event)"></ca-project-actions-menu>
}
@else if (isDocument()) {
  <ca-document-actions-menu [documentInfo]="documentInfo()"
                            (documentAction)="onDocumentAction($event)"></ca-document-actions-menu>
}
