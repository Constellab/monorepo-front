<div class="comment-zone" *ngIf="comments">

  <!-- List of comments -->
  <fl-infinite-scroll [datasource]="comments" class="comment-div" [reverseMode]="true" [textNoResult]="'no_comments'"
                      [textNoMoreResult]="''">
    <div class="comments-container g-layout-col-reverse">
      @for (comment of comments | flDatasourceConnect | async; track comment.id) {
        <ca-project-comment [comment]="comment" class="comment"
                            (commentUpdated)="commentUpdated($event)"
                            (commentDeleted)="commentDeleted($event)"></ca-project-comment>
      }
    </div>
  </fl-infinite-scroll>

  <!-- Zone to write a new comment -->
  <ca-project-comment-editor mode="create" (send)="createNewComment($event)"
                             class="new-comment"></ca-project-comment-editor>
</div>
