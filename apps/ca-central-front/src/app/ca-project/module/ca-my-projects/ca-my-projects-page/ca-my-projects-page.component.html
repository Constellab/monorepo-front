<div class="g-page">

  <fl-async-section [arrayObs]="foldersDatasource" emptyText="no_project">

    <fl-section-header class="g-page-title">
      <fl-text-icon iconPosition="start">
        <mat-icon class="g-icon-big g-icon-background g-primary-background">folder</mat-icon>
        <h1>{{'my_projects' | translate}}</h1>
      </fl-text-icon>

      <fl-section-actions>
        <button mat-flat-button type="button"
                (click)="openCreateProjectDialog()">
          <mat-icon>add</mat-icon>
          <span>{{'new_project' | translate}}</span>
        </button>

      </fl-section-actions>
    </fl-section-header>

    <ng-container *flSectionBodyDatasource="foldersDatasource as folders">
      <div class="g-grid-5-rows">
        <a *ngFor="let folder of folders" [routerLink]="folder | caDetailRoute">
          <ca-folder-card [folder]="folder"></ca-folder-card>
        </a>
      </div>

      <fl-infinite-load-more-result [datasource]="foldersDatasource"></fl-infinite-load-more-result>
    </ng-container>

  </fl-async-section>

</div>
