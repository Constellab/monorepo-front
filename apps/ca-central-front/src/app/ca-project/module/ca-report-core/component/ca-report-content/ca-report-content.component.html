<fl-async-section [object]="content$" class="g-full-height">
  <ng-container *flSectionBody="content$ as content">
    <te-text-editor [ngModel]="content"  [disabled]="true"
                    class="g-full-height text-editor g-print-section"
                    [config]="textEditorConfig"></te-text-editor>
  </ng-container>
</fl-async-section>
