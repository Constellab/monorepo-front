<fl-card *ngIf="lastExperiments">
  <fl-card-header>
    <h2>{{'last_experiments' | translate}}</h2>
  </fl-card-header>
  <fl-card-body>
    <mat-nav-list *ngIf="lastExperiments.length > 0; else noExperiences">
      <mat-list-item *ngFor="let experiment of lastExperiments"
                     class="experiment">
        <a class="experiment-div" [routerLink]="experiment | caDetailRoute">
          <fl-status-chip mat-list-avatar [status]="experiment.status" [mode]="'iconOnly'"
                          class="icon"></fl-status-chip>
          <div class="experiment-title-folder">
            <div class="experiment-title">
              {{experiment.title}}
            </div>
          </div>
          <div class="experiment-date g-text-small">
            <fl-from-now [date]="experiment.lastModifiedAt"></fl-from-now>
          </div>
        </a>
      </mat-list-item>
    </mat-nav-list>

    <ng-template #noExperiences>
      <p>{{'no_experiences' | translate}}</p>
    </ng-template>
  </fl-card-body>
</fl-card>
