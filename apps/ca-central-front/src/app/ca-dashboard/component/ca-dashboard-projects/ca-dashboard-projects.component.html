<ca-dashboard-list-layout [datasource]="foldersDatasource"
                   sectionTitle="my_projects" titleIcon="folder" emptyText="no_project"
                   addText="add_new_project"
                   [completeListRoute]="myProjectsRoute" completeListText="all_projects"
                   (addClick)="openCreateProjectDialog()">
  <ng-template let-item>
    <ca-folder-card [folder]="item"></ca-folder-card>
  </ng-template>
</ca-dashboard-list-layout>
