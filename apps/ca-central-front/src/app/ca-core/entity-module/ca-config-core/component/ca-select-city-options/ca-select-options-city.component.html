@if (isLoading) {
  <mat-option disabled>
    {{ 'loading' | translate }}
  </mat-option>
} @else {
  @if (countries?.length > 0) {
    @for (country of countries; track country) {
      <mat-optgroup [label]="country.name">
        @for (city of country.cities; track city) {
          <mat-option [value]="city">
            {{ city.name }}
          </mat-option>
        }
      </mat-optgroup>
    }
  }
}
