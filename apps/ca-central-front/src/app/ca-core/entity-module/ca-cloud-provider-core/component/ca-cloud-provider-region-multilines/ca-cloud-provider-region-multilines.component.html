<div class="g-layout-row g-layout-start-center g-layout-gap-05em">
  <img [ngSrc]="region.city.country.shortName | caCountryFlag"
       [alt]="region.city.country.shortName" [width]="30" [height]="30">
  <span>{{ region.name }}</span>
</div>

<div class="g-text-small g-text-light name">
  {{ region.city.name }} - {{ region.city.country.name }}
</div>
