<fl-dialog-header>
  {{ title | translate }}
</fl-dialog-header>

<mat-dialog-content>
  <form (ngSubmit)="submit()" id="cloud-provider-form" [formGroup]="formGp">
    <!--  Name  -->
    <mat-form-field class="g-form-input">
      <mat-label>{{ 'name' | translate }}</mat-label>
      <input
        matInput
        formControlName="name"
        required
        flInputMaxLength="50"
        [placeholder]="'name' | translate" />
        @if (formGp.get('name').hasError('required')) {
          <mat-error>
            {{ 'name' | flErrorRequired }}
          </mat-error>
        }
      </mat-form-field>

      <!--  Description  -->
      <mat-form-field class="g-form-input">
        <mat-label>{{ 'description' | translate }}</mat-label>
        <textarea
          matInput
          formControlName="description"
          rows="2"
        [placeholder]="'description' | translate"></textarea>
      </mat-form-field>

      <!--  Logo  -->
      <mat-form-field class="g-form-input">
        <mat-label>{{ 'logo' | translate }}</mat-label>
        <input
          matInput
          formControlName="logo"
          required
          flInputMaxLength="255"
          [placeholder]="'logo' | translate" />
        </mat-form-field>
      </form>
    </mat-dialog-content>

    <div mat-dialog-actions>
      <button mat-flat-button type="submit" form="cloud-provider-form" class="g-centered-forced primary">
        {{ 'save' | translate }}
        @if (isLoading) {
          <fl-button-loader></fl-button-loader>
        }
      </button>
    </div>
