<mat-table mat-table [dataSource]="datasource" class="table">

  <!-- Code/Title -->
  <ng-container matColumnDef="code">
    <mat-header-cell *matHeaderCellDef>
      <span> {{ 'code' | translate }} / {{ 'title' | translate }}</span>
    </mat-header-cell>
    <mat-cell *matCellDef="let project">

      <!--    Invisible link  -->
      @if (!rowSelectable) {
        <a [routerLink]="project | caDetailRoute" class="g-row-link"></a>
      }

      <ca-project-inline [project]="project"></ca-project-inline>
    </mat-cell>
  </ng-container>

  <!-- Creation info -->
  <ng-container matColumnDef="creation">
    <mat-header-cell *matHeaderCellDef>
      <span> {{ 'creation_info' | translate }}</span>
    </mat-header-cell>
    <mat-cell *matCellDef="let project">
      <fl-user-with-date [user]="project.createdBy" [date]="project.createdAt"></fl-user-with-date>
    </mat-cell>
  </ng-container>

  <!-- Leader -->
  <ng-container matColumnDef="leader">
    <mat-header-cell *matHeaderCellDef>
      <span> {{ 'project_leader' | translate }}</span>
    </mat-header-cell>
    <mat-cell *matCellDef="let project">
      <fl-user-inline [user]="project.leader"></fl-user-inline>
    </mat-cell>
  </ng-container>

  <ng-container matColumnDef="actions">
    <mat-header-cell *matHeaderCellDef class="g-table-icon-button-cell">
    </mat-header-cell>
    <mat-cell *matCellDef="let row" class="g-table-icon-button-cell">
      <ca-project-actions-menu [projectInfo]="row.info"
                               (projectAction)="onProjectAction($event)"
                               [stopClickEvent]="true"
                               class="g-row-button"></ca-project-actions-menu>
    </mat-cell>
  </ng-container>

  <!-- Custom action where template is defined by parent -->
  <ng-container matColumnDef="customAction">
    <mat-header-cell *matHeaderCellDef class="g-table-icon-button-cell">
    </mat-header-cell>
    <mat-cell *matCellDef="let row" class="g-table-icon-button-cell">
      <ng-container *ngTemplateOutlet="templateRef; context: getViewContent(row)"></ng-container>
    </mat-cell>
  </ng-container>


  <mat-header-row *matHeaderRowDef="columns; sticky: true"></mat-header-row>

  <mat-row *matRowDef="let row; columns: columns;" class="g-table-row-selectable g-row-link-container"
           (click)="onProjectClick(row)" (dblclick)="onProjectDblClick(row)"
           [ngClass]="{'selected-row': row.id === selectedProject?.id}">
  </mat-row>
</mat-table>
