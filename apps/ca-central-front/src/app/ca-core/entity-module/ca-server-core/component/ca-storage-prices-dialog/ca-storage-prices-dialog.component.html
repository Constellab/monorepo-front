<fl-dialog-header>
  {{ 'storage_prices' | translate }}

  <fl-dialog-header-actions>
    <button
      mat-icon-button
      type="button"
      (click)="createPrice()"
      [matTooltip]="'create_storage_price' | translate">
      <mat-icon>add</mat-icon>
    </button>
  </fl-dialog-header-actions>
</fl-dialog-header>

<mat-dialog-content>
  <ca-storage-price-table [datasource]="prices" (priceDeleted)="refreshPrices()"></ca-storage-price-table>
</mat-dialog-content>
