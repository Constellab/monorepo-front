<fl-dialog-header>
  {{ 'create_server_price' | translate }}
</fl-dialog-header>

<mat-dialog-content>
  <form (ngSubmit)="submit()" id="server-price-form" [formGroup]="formGp">
    <!--  Price  -->
    <mat-form-field class="g-form-input">
      <mat-label>{{ 'server_price' | translate }}</mat-label>
      <input
        matInput
        formControlName="price"
        required
        type="number"
        [placeholder]="'server_price' | translate" />

      <mat-hint>{{ 'server_price_unit' | translate }}</mat-hint>
      <mat-error *ngIf="formGp.get('price').invalid">
        {{ 'server_price_error' | translate }}
      </mat-error>
    </mat-form-field>

    <!--    Start Date      -->
    <mat-form-field class="g-form-input">
      <mat-label>{{ 'server_price_start_date' | translate }}</mat-label>
      <input
        matInput
        formControlName="startDate"
        required
        [matDatepicker]="startingPicker"
        [placeholder]="'server_price_start_date' | translate" />
      <mat-datepicker-toggle matSuffix [for]="startingPicker"></mat-datepicker-toggle>
      <mat-datepicker #startingPicker startView="month"></mat-datepicker>
      <mat-error *ngIf="formGp.get('startDate').hasError('required')">
        {{ 'server_price_start_date' | flErrorRequired }}
      </mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-flat-button type="submit" form="server-price-form" class="g-centered-forced primary">
    {{ 'save' | translate }}
    <fl-button-loader *ngIf="isLoading"></fl-button-loader>
  </button>
</div>
