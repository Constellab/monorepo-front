<fl-dialog-header>
  {{ 'update_space_license' | translate }}
</fl-dialog-header>

<mat-dialog-content>
  <form (ngSubmit)="submit()" id="license-form">

    <!--  Nb of licences  -->
    <mat-form-field class="g-form-input" *caIsAdmin>
      <mat-label>{{ 'nb_of_licenses' | translate }}</mat-label>
      <input matInput formControlName="nbLicenses" required type="number"
             [formControl]="formCtrl"
             [placeholder]="'nb_of_licenses' | translate" min="0">
      <mat-error *ngIf="formCtrl.hasError('required')">
        {{ 'nb_of_licenses' | flErrorRequired }}
      </mat-error>
    </mat-form-field>

  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-flat-button color="primary" type="submit" form="license-form"
          class="g-centered-forced">
    {{ 'save' | translate }}
    <fl-button-loader *ngIf="isLoading"></fl-button-loader>
  </button>
</div>
