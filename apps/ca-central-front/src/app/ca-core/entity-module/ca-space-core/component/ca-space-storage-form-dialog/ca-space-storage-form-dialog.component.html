<fl-dialog-header>
  {{ 'update_space_default_storage' | translate }}
</fl-dialog-header>

<mat-dialog-content>
  <form (ngSubmit)="submit()" id="space-form" [formGroup]="formGp">
    <ca-space-storage-form [formGp]="formGp"></ca-space-storage-form>
  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-flat-button type="submit" form="space-form" class="g-centered-forced primary">
    {{ 'save' | translate }}
    @if (isLoading) {
      <fl-button-loader></fl-button-loader>
    }
  </button>
</div>
