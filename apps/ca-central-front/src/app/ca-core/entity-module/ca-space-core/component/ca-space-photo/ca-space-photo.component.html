<div
  class="user-icon"
  [style.height]="sizeNumber + 'em'"
  [style.width]="sizeNumber + 'em'"
  [style.line-height]="sizeNumber + 'em'"
  [style.font-size]="fontSize + 'em'"
  [ngClass]="{ 'g-primary-background': !photo }">
  @if (photo) {
    <img [src]="photo" class="user-icon-image" [alt]="label" />
  } @else {
    <span>{{ initial }}</span>
  }
</div>
