<fl-dialog-header>
  {{ 'create_space' | translate }}
</fl-dialog-header>

<mat-dialog-content>
  <form (ngSubmit)="submit()" id="space-form" [formGroup]="formGp">
    <!--  Name  -->
    <mat-form-field class="g-form-input">
      <mat-label>{{ 'name' | translate }}</mat-label>
      <input
        matInput
        formControlName="name"
        required
        flInputMaxLength="100"
        [placeholder]="'name' | translate" />
      <mat-error *ngIf="formGp.get('name').hasError('required')">
        {{ 'name' | flErrorRequired }}
      </mat-error>
    </mat-form-field>

    <ca-space-storage-form [formGp]="$any(formGp.get('defaultStorageLocations'))"></ca-space-storage-form>
  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-flat-button color="primary" type="submit" form="space-form" class="g-centered-forced">
    {{ 'save' | translate }}
    <fl-button-loader *ngIf="isLoading"></fl-button-loader>
  </button>
</div>
