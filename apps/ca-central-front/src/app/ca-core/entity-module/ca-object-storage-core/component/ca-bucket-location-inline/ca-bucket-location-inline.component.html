<fl-text-icon>
  <mat-icon [flIcon]="bucketLocation.getIcon()"></mat-icon>
  {{bucketLocation.locationName}}
  <span class="g-text-light g-text-small"
        *ngIf="bucketLocation.cityName || bucketLocation.countryName || bucketLocation.cloudProviderName">
    ({{bucketLocation.cityName}} - {{bucketLocation.countryName}} - {{bucketLocation.cloudProviderName}})
  </span>
</fl-text-icon>
