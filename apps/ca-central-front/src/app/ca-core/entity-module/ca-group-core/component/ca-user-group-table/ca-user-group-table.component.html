<mat-table mat-table [dataSource]="datasource" class="table">
  <!-- user -->
  <ng-container matColumnDef="user">
    <mat-header-cell *matHeaderCellDef>
      <span> {{ 'user' | translate }}</span>
    </mat-header-cell>
    <mat-cell *matCellDef="let row">
      <fl-user-inline [user]="row.user"></fl-user-inline>
    </mat-cell>
  </ng-container>

  <!-- Creation info -->
  <ng-container matColumnDef="creation">
    <mat-header-cell *matHeaderCellDef>
      <span> {{ 'user_group_added_by' | translate }}</span>
    </mat-header-cell>
    <mat-cell *matCellDef="let row">
      <fl-user-with-date [user]="row.createdBy" [date]="row.createdAt"></fl-user-with-date>
    </mat-cell>
  </ng-container>

  <!-- Actions -->
  <ng-container matColumnDef="actions">
    <mat-header-cell *matHeaderCellDef class="g-table-icon-button-cell"> </mat-header-cell>
    <mat-cell *matCellDef="let row" class="g-table-icon-button-cell">
      <button
        mat-icon-button
        type="button"
        class="warn"
        (click)="openRemoveUserDialog(row)"
        [matTooltip]="'team_remove_user' | translate">
        <mat-icon>clear</mat-icon>
      </button>
    </mat-cell>
  </ng-container>

  <mat-header-row *matHeaderRowDef="columns; sticky: true"></mat-header-row>

  <mat-row *matRowDef="let row; columns: columns"> </mat-row>
</mat-table>
