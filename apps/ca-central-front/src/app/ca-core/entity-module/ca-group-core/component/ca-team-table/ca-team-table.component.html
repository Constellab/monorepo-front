<mat-table mat-table [dataSource]="datasource" flSearchTableSort>

  <!-- Label -->
  <ng-container matColumnDef="label">
    <mat-header-cell *matHeaderCellDef mat-sort-header>
      {{ 'label' | translate }}
    </mat-header-cell>
    <mat-cell *matCellDef="let row">

      <a [routerLink]="row | caDetailRoute" class="g-row-link"></a>

      {{ row.label }}
    </mat-cell>
  </ng-container>

  <!-- Creation info -->
  <ng-container matColumnDef="creation">
    <mat-header-cell *matHeaderCellDef mat-sort-header>
      {{ 'creation_info' | translate }}
    </mat-header-cell>
    <mat-cell *matCellDef="let row">
      <fl-user-with-date [user]="row.createdBy" [date]="row.createdAt"></fl-user-with-date>
    </mat-cell>
  </ng-container>

  <!-- Actions -->
  <ng-container matColumnDef="actions">
    <mat-header-cell *matHeaderCellDef class="g-table-icon-button-cell">
    </mat-header-cell>
    <mat-cell *matCellDef="let row" class="g-table-icon-button-cell">
      <ca-team-action-menu [team]="row" (teamDeleted)="onTeamDeleted($event)"
                           [stopClickEvent]="true" class="g-row-button"></ca-team-action-menu>
    </mat-cell>
  </ng-container>

  <mat-header-row *matHeaderRowDef="columns; sticky: true"></mat-header-row>

  <mat-row *matRowDef="let row; columns: columns;" class="g-table-row-selectable g-row-link-container">
  </mat-row>
</mat-table>
