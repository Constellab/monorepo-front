<fl-dialog-header>
  {{ title | translate }}
</fl-dialog-header>

<mat-dialog-content>
  <form (ngSubmit)="submit()" id="add-user-to-space-form">
    <!--  User  -->
    <fl-form-field>
      <fl-select-user
        [formControl]="formControl"
        [mode]="selectUserMode"
        [placeholder]="'user' | translate"
        [required]="true"></fl-select-user>
      @if (formControl.hasError('required')) {
        <mat-error>
          {{ 'user' | flErrorRequired }}
        </mat-error>
      }
    </fl-form-field>
  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-flat-button type="submit" form="add-user-to-space-form" class="g-centered-forced primary">
    {{ 'save' | translate }}
    @if (isLoading) {
      <fl-button-loader></fl-button-loader>
    }
  </button>
</div>
