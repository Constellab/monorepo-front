<fl-dialog-header>
  {{'share' | translate}}
</fl-dialog-header>

<mat-dialog-content>
  <form (ngSubmit)="submit()" id="group-share-form">

    <!--  Group  -->
    <fl-form-field class="g-form-input">
      <ca-select-group [formControl]="formControl"
                       [required]="true"></ca-select-group>
      <mat-error *ngIf="formControl.hasError('required')">
        {{'group' | flErrorRequired}}
      </mat-error>
    </fl-form-field>

  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-flat-button color="primary" type="submit" form="group-share-form"
          class="g-centered-forced">
    {{'save' | translate}}
    <fl-button-loader *ngIf="isLoading"></fl-button-loader>
  </button>
</div>
