<div class="form g-layout-col" [formGroup]="formGp">

  <div class="g-full g-form-field-compact g-layout-row-wrap g-layout-between-center">

    <!--  Name  -->
    <mat-form-field class="g-search-field">
      <mat-label>{{'name' | translate }}</mat-label>
      <input matInput formControlName="name" [placeholder]="'name' | translate" autocomplete="off">
    </mat-form-field>

    <!--  Code  -->
    <mat-form-field class="g-search-field">
      <mat-label>{{'code' | translate }}</mat-label>
      <input matInput formControlName="code" [placeholder]="'code' | translate" autocomplete="off">
    </mat-form-field>

    <!--Leader-->
    <fl-form-field class="g-search-field">
      <fl-select-user formControlName="leader" [placeholder]="'folder_leader' | translate"
                      mode="space">
      </fl-select-user>
    </fl-form-field>

    <!--  Id -->
    <mat-form-field class="g-search-field">
      <mat-label>{{'id' | translate }}</mat-label>
      <input matInput formControlName="id" [placeholder]="'id' | translate" autocomplete="off">
    </mat-form-field>

    <!--  Starting date  -->
    <div class="g-form-field-no-hint g-full">
      <p class="g-text-small">{{'starting_date' | translate}}</p>
      <fl-search-date-interval formGroupName="startingDate">
      </fl-search-date-interval>
    </div>

    <!--  Ending date  -->
    <div class="g-form-field-no-hint g-full">
      <p class="g-text-small">{{'ending_date' | translate}}</p>
      <fl-search-date-interval formGroupName="endingDate">
      </fl-search-date-interval>
    </div>


    <!--  Creation date  -->
    <div class="g-form-field-no-hint g-full">
      <p class="g-text-small">{{'creation_date' | translate}}</p>
      <fl-search-date-interval formGroupName="createdAt">
      </fl-search-date-interval>
    </div>

    <!--  Include sub folder  -->
    <mat-checkbox formControlName="includeSubFolders"
                  class="checkbox">{{'include_sub_folders' | translate }}</mat-checkbox>


  </div>

</div>
