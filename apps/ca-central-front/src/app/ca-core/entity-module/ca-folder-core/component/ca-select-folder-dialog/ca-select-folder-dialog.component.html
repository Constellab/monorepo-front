<fl-dialog-header>
  {{ dialogInput.title | flTranslatableText }}
</fl-dialog-header>

<mat-dialog-content>

  <div class="g-layout-row-wrap g-layout-start-center g-text-not-selectable">
    <div class="parent-project" (click)="moveToRoot()">{{ 'my_projects' | translate }}</div>
    @for (project of parentFolders; track project.id) {
      <div class="parent-separator">></div>
      <div class="parent-project" (click)="selectParentFolder(project)">{{ project.name }}</div>
    }
  </div>

  @if (foldersDatasource) {
    <fl-infinite-table-container [datasource]="foldersDatasource" [textNoMoreResult]="null" class="table"
                                 textNoResult="folder_empty" textNoMoreResult="">
      <ca-folder-table [datasource]="foldersDatasource" [rowSelectable]="true" [columns]="columns"
                       [selectedFolder]="selectedFolder"
                       (rowEvent)="onFolderEvent($event)"
                       class="g-text-not-selectable">

        <!--   Custom column only showed when sub project can be selected. Button to open project   -->
        <ng-template let-folder>
          @if (!isRootMode()) {
            <button mat-icon-button (click)="openFolder(folder)"
                    type="button" [matTooltip]="'open_project' | translate" matTooltipClass="g-tooltip-multiline">
              <mat-icon>chevron_right</mat-icon>
            </button>
          }
        </ng-template>

      </ca-folder-table>
    </fl-infinite-table-container>
  }
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-flat-button color="primary" class="g-centered-forced" (click)="close()">
    {{ 'select_project' | translate }}
  </button>
</div>
