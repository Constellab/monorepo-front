<fl-dialog-header>
  {{'change_folder_leader' | translate}}
</fl-dialog-header>


<mat-dialog-content>
  <form (ngSubmit)="submit()" id="update-leader-form">

    <!--  Users  -->
    <mat-form-field class="g-form-input" appearance="outline">
      <mat-label>{{'folder_leader' | translate}}</mat-label>
      <mat-select [formControl]="formControl" required
                  [placeholder]="'folder_leader' | translate"
                  [compareWith]="compareWith">
        <mat-option *ngFor="let user of users$ | async" [value]="user">
          <fl-user-inline [user]="user"></fl-user-inline>
        </mat-option>

        <mat-select-trigger *ngIf="formControl.value">
          <fl-user-inline [user]="formControl.value"></fl-user-inline>
        </mat-select-trigger>
      </mat-select>
      <mat-error *ngIf="formControl.hasError('required')">
        {{'code' | flErrorRequired}}
      </mat-error>
    </mat-form-field>

  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-raised-button color="primary" type="submit" form="update-leader-form"
          class="g-centered-forced">
    {{'save' | translate}}
    <fl-button-loader *ngIf="isLoading"></fl-button-loader>
  </button>
</div>
