<fl-dialog-header>
  {{ 'change_folder_leader' | translate }}
</fl-dialog-header>

<mat-dialog-content>
  <form (ngSubmit)="submit()" id="update-leader-form">
    <!--  Users  -->
    <mat-form-field class="g-form-input" appearance="outline">
      <mat-label>{{ 'folder_leader' | translate }}</mat-label>
      <mat-select
        [formControl]="formControl"
        required
        [placeholder]="'folder_leader' | translate"
        [compareWith]="compareWith">
        @for (user of users$ | async; track user) {
          <mat-option [value]="user">
            <fl-user-inline [user]="user"></fl-user-inline>
          </mat-option>
        }

        @if (formControl.value) {
          <mat-select-trigger>
            <fl-user-inline [user]="formControl.value"></fl-user-inline>
          </mat-select-trigger>
        }
      </mat-select>
      @if (formControl.hasError('required')) {
        <mat-error>{{ 'code' | flErrorRequired }}</mat-error>
      }
    </mat-form-field>
  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-flat-button type="submit" form="update-leader-form" class="g-centered-forced primary">
    {{ 'save' | translate }}
    @if (isLoading) {
      <fl-button-loader></fl-button-loader>
    }
  </button>
</div>
