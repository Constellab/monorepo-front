<fl-dialog-header>
  {{ 'update_license' | translate }}
</fl-dialog-header>

<mat-dialog-content>
  <form (ngSubmit)="submit()" id="license-form">
    <!--  License  -->
    <mat-form-field class="g-form-input">
      <mat-label>{{ 'license' | translate }}</mat-label>
      <mat-select [formControl]="formCtrl" [placeholder]="'license' | translate">
        @for (license of licenses; track license) {
          <mat-option [value]="license">
            {{ 'license_' + license | translate }}
          </mat-option>
        }
      </mat-select>
    </mat-form-field>
  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-flat-button color="primary" type="submit" form="license-form" class="g-centered-forced">
    {{ 'save' | translate }}
    <fl-button-loader *ngIf="isLoading"></fl-button-loader>
  </button>
</div>
