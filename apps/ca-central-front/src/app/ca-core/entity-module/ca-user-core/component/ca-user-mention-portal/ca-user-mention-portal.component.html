<div class="container">
  @if (showEveryoneButton) {
    <div
      class="item"
      (click)="selectEveryone()"
      [ngClass]="{ selected: userIsSelected(0) }">
      Everyone
    </div>
  }

  @for (user of users; track user; let i = $index) {
    <fl-user-inline
      class="item"
      [ngClass]="{ selected: userIsSelected(i + showEveryoneButton) }"
      [user]="user"
      (click)="selectUser(user)">
    </fl-user-inline>
  }
</div>
