<fl-dialog-header>
  {{ title | flTranslatableText | async }}
</fl-dialog-header>

<mat-dialog-content>
  <p class="g-text-light help-text">{{ helpText | flTranslatableText | async }}</p>

  <fl-async-section [object]="labConfig$">
    <ng-container *flSectionBody="labConfig$ as conf">
      <ca-lab-config [labConfig]="conf"></ca-lab-config>
    </ng-container>
  </fl-async-section>
</mat-dialog-content>
