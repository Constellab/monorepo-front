<fl-dialog-header>
  {{'lab_free_trial_update' | translate}}
</fl-dialog-header>

<mat-dialog-content>
  <form (ngSubmit)="submit()" id="free-trial-form" [formGroup]="formGp">

    <!--  Usage limite  -->
    <mat-form-field class="g-form-input">
      <mat-label>{{'lab_free_trial_hour_limit' | translate}}</mat-label>
      <input matInput formControlName="usageLimitInHours" required type="number"
             [placeholder]="'lab_free_trial_hour_limit' | translate">
      <mat-error *ngIf="formGp.get('usageLimitInHours').hasError('required')">
        {{'lab_free_trial_hour_limit' | flErrorRequired}}
      </mat-error>
    </mat-form-field>

    <!--    Start Date      -->
    <mat-form-field class="g-form-input">
      <mat-label>{{'lab_free_trial_expiration_date' | translate}}</mat-label>
      <input matInput formControlName="expirationDate" required
             [matDatepicker]="startingPicker"
             [placeholder]="'flDate.date_picker_placeholder' | translate">
      <mat-datepicker-toggle matSuffix [for]="startingPicker"></mat-datepicker-toggle>
      <mat-datepicker #startingPicker startView="month"></mat-datepicker>
      <mat-error *ngIf="formGp.get('expirationDate').hasError('required')">
        {{'lab_free_trial_expiration_date' | flErrorRequired }}
      </mat-error>
    </mat-form-field>


  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-raised-button color="primary" type="submit" form="free-trial-form"
          class="g-centered">
    {{'save' | translate}}
    <fl-button-loader *ngIf="isLoading"></fl-button-loader>
  </button>
</div>
