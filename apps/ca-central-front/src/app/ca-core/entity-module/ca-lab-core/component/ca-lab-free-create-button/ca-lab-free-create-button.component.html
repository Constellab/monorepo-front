@if (freeLabInfo$ | async; as freeLabInfo) {
  @if (freeLabInfo.showCreateFreeLab) {
    <div>
      <button mat-flat-button type="button" (click)="createFreeLab(freeLabInfo.freeLab)" color="primary">
        <mat-icon>not_started</mat-icon>
        {{ 'start_free_data_lab' | translate }}
      </button>
    </div>
  }
}
