<mat-table mat-table [dataSource]="datasource" flSearchTableSort>
  <!-- createdAt -->
  <ng-container matColumnDef="createdAt">
    <mat-header-cell *matHeaderCellDef mat-sort-header>
      {{ 'created_at' | translate }}
    </mat-header-cell>
    <mat-cell *matCellDef="let statusHistory">
      <div>
        {{ statusHistory.createdAt | flDate: 'DATE_TIME_WITH_SECONDS' }}
      </div>
    </mat-cell>
  </ng-container>

  <!-- Status -->
  <ng-container matColumnDef="status">
    <mat-header-cell *matHeaderCellDef mat-sort-header>
      {{ 'status' | translate }}
    </mat-header-cell>
    <mat-cell *matCellDef="let statusHistory">
      <div>
        <fl-status-chip class="chip" [status]="statusHistory.status"></fl-status-chip>
      </div>
    </mat-cell>
  </ng-container>

  <!-- Created By -->
  <ng-container matColumnDef="createdBy">
    <mat-header-cell *matHeaderCellDef mat-sort-header>
      {{ 'created_by' | translate }}
    </mat-header-cell>
    <mat-cell *matCellDef="let statusHistory">
      <div>
        <fl-user-inline
          [portalOnHover]="false"
          [profilePictureSize]="'small'"
          [showName]="true"
          [user]="statusHistory.createdBy"></fl-user-inline>
      </div>
    </mat-cell>
  </ng-container>

  <!-- endDate -->
  <ng-container matColumnDef="endDate">
    <mat-header-cell *matHeaderCellDef mat-sort-header>
      {{ 'end_date' | translate }}
    </mat-header-cell>
    <mat-cell *matCellDef="let statusHistory">
      <div>
        {{ statusHistory.endDate | flDate: 'DATE_TIME_WITH_SECONDS' }}
      </div>
    </mat-cell>
  </ng-container>

  <mat-header-row *matHeaderRowDef="columns; sticky: true"></mat-header-row>
  <mat-row *matRowDef="let row; columns: columns"></mat-row>
</mat-table>
