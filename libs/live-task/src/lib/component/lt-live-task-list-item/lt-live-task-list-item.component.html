<div class="live-task-card" #mainCard>
  <div class="card-left-info">
    <h2 class="h2-v2 spacing-5-v2">{{ liveTask.title }}</h2>
    <p class="small-text user-date-info">
      <fl-user-inline [user]="liveTask.createdBy" [portalOnHover]="false"></fl-user-inline>
      <span class="g-text-small date-info">
          <fl-from-now [date]="liveTask.lastModifiedAt"></fl-from-now>
      </span>
    </p>
    <p class="lt-description g-text-small">
      {{ getLiveTaskDescription() }}
    </p>
  </div>
  <div class="live-task-card-inner">
    <div>
      <p class="spacing-3-v2">{{ 'ltLiveTask.version' | translate }} :</p>
      <p class="spacing-4-v2" *ngIf="liveTask.latestPublishVersion; else notPublishedYetDiv"><b>{{ 'ltLiveTask.version' | translate }} {{ liveTask.latestPublishVersion }}</b></p>
      <div class="lt-infos-div">
        <div>
          <p class="spacing-3-v2">{{ 'ltLiveTask.task_visibility' | translate }} :</p>
          <button mat-stroked-button class="g-button-small spacing-4-v2"
                  [color]="liveTask.space == null ? 'accent' : 'warn'">{{ liveTask.space == null ? ('ltLiveTask.public' | translate) : liveTask.space.name }}
          </button>
        </div>
      </div>

    </div>
  </div>
</div>

<ng-template #notPublishedYetDiv>
  <div style="color: var(--warn-color)" class="g-text-small">
    <b>{{ 'not_published' | translate }}</b>
  </div>
</ng-template>
