<img *ngIf="viewTypeInfo && viewTypeInfo.image; else icon"
     [src]="viewTypeInfo?.image | flThemeSwitch" [alt]="viewTypeInfo?.text"
     [style.width]="size"/>
<ng-template #icon>
  <mat-icon *ngIf="viewTypeInfo; else defaultIcon" [flIcon]="viewTypeInfo?.icon" class="view-icon"
            [style.font-size]="size"></mat-icon>
  <ng-template #defaultIcon>
    <mat-icon [flIcon]="rvDefaultViewTypeIcon" class="view-icon"
              [style.font-size]="size"></mat-icon>
  </ng-template>
</ng-template>
