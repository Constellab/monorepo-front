@if (currentStatus === 'RUNNING') {
  <iframe [src]="iframeUrl" class="iframe"> </iframe>
} @else if (currentStatus === 'STARTING') {
  <div class="container">
    <div class="g-text-centered">
      <fl-loader></fl-loader>
      <div>{{ statusText }}</div>
    </div>
  </div>
} @else {
  <div class="container">
    <div class="g-text-centered">
      <div>{{ 'rvResourceView.error_app_starting' | translate }}</div>
      <div>{{ statusText }}</div>
    </div>
  </div>
}
