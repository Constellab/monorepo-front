<fl-dialog-header>
  <h3>{{ 'biox.technical_info' | translate }}</h3>
</fl-dialog-header>

<mat-dialog-content>
  @for (info of technicalInfo; track info) {
    <div>
      <fl-key-value class="technical-info">
        <fl-key>{{ info.key }}</fl-key>
        {{ info.value }}
      </fl-key-value>
      @if (info.short_description) {
        <div class="g-text-small g-text-light">{{ info.short_description }}</div>
      }
    </div>
  }
</mat-dialog-content>
