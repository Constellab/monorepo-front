<div contenteditable="false" class="container">
  <div class="chart-container g-layout-row g-layout-center-center">
    @if (view) {
      <rv-resource-view
        [resourceId]="resourceId"
        [view]="view"
        [config]="viewConfig"
        class="resource-view"></rv-resource-view>
    }

    @if (isLoading) {
      <fl-loader size="medium"></fl-loader>
    }
  </div>

  <div class="g-text-centered">
    <te-title-caption
      [title]="viewTitle"
      [caption]="caption"
      (titleChange)="onTitleChange($event)"
      (captionChange)="onCaptionChange($event)"
      [editable]="editable"></te-title-caption>
    @if (view) {
      <span class="open-in-dialog-text g-text-small" (click)="openViewInDialog()">
        ({{ 'rvResourceView.open_in_full_screen' | translate }})
      </span>
    }

    @if (view) {
      <rv-technical-info-button
        [technicalInfo]="view.technical_info"
        class="g-button-icon-tiny g-text-light"></rv-technical-info-button>
    }
  </div>
</div>
