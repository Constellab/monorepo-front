<mat-grid-list [cols]="view.data.nb_of_columns" rowHeight="400">
  @for (subView of view.data.views; track subView) {
    <mat-grid-tile [colspan]="subView.colspan" [rowspan]="subView.rowspan">
      <rv-resource-view [view]="subView.view" [config]="config" [resourceId]="resourceId"></rv-resource-view>
    </mat-grid-tile>
  }
</mat-grid-list>
