<fl-portal class="portal">
  <fl-portal-content>
    <div class="spec">
      <td-doc-io [ioSpec]="data.port.currentSpecs"></td-doc-io>

      @if (data.ioface) {
        <fl-key-value class="ioface">
          <fl-key>{{ 'pr.' + data.ioface.type | translate }}</fl-key>
          {{ data.ioface.name }}
        </fl-key-value>
      }
    </div>

    @for (menuDynamic of data.menuDynamics; track menuDynamic) {
      <fl-menu-dynamic-button [menuDynamic]="menuDynamic" (buttonClick)="closePortal()">
      </fl-menu-dynamic-button>
    }

    <!--    Fix the menu bug    -->
    <mat-menu> </mat-menu>
  </fl-portal-content>
</fl-portal>
