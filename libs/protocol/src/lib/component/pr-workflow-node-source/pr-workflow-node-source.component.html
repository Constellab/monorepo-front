<pr-workflow-node-content [icon]="icon$ | async">
  <pr-workflow-node-content-bottom [matTooltip]="title$ | async | flTranslatableText"
                                   [matTooltipShowDelay]="1000">
    {{ title$ | async | flTranslatableText }}
  </pr-workflow-node-content-bottom>
</pr-workflow-node-content>

@if (resourceExpId$ | async; as expId) {
  <button mat-icon-button type="button" class="g-button-icon-small exp"
          (click)="navigateToExperiment(expId, $event)"
          [matTooltip]="'pr.open_resource_experiment' | translate">
    <mat-icon class="exp-icon">arrow_backward</mat-icon>
  </button>
}
