<div>

  <div class="g-layout-col g-layout-between-center">

    <!-- Title   -->
    <div class="name g-text-small">
      {{title$ | async | flTranslatableText}}
    </div>


    <!--  actions -->
    <div class="g-layout-row g-layout-start-center g-layout-gap-05em">


      @if(resourceId$ | async; as resourceId){
        <button mat-stroked-button type="button" class="g-button-small button"
                (click)="openResourceDetail(resourceId)">
          <mat-icon>visibility</mat-icon>
          {{'pr.resource' | translate}}
        </button>
      } @else if(isEditMode$ | async){
        <button mat-stroked-button type="button" class="g-button-tiny button"
                (click)="openSelectResource()">
          {{'pr.select_resource' | translate}}
        </button>
      }
    </div>
  </div>

</div>
