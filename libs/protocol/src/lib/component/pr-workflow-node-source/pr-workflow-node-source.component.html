<div>

  <div class="g-layout-col g-layout-between-center">

    <!-- Title   -->
    <div class="name g- g-text-small">
      {{title() | async | flTranslatableText}}
    </div>


    <!--  actions -->
    <div class="g-layout-row g-layout-start-center g-layout-gap-05em">
      <button mat-icon-button type="button"
              (click)="openNodeDetail()" [matTooltip]="'pr.open_node_detail' | translate">
        <mat-icon>info</mat-icon>
      </button>

      <ng-container *ngIf="node.resourceId()">
        <button mat-icon-button (click)="openResourceDetail(node.resourceId())"
                type="button" [matTooltip]="'resource' | translate">
          <mat-icon flIcon="resource"></mat-icon>
        </button>
      </ng-container>
    </div>
  </div>

</div>
