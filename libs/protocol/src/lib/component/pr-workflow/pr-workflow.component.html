<div class="g-full-height g-layout-col" *ngIf="!error; else showError">

  <!--  Workflow header  -->
  <div class="header g-layout-row g-layout-start-center g-layout-gap-1em"
       *ngIf="!flowIsLoading">
    <ng-content></ng-content>

    <div class="divider"></div>

    <pr-workflow-layers-breadcrumb></pr-workflow-layers-breadcrumb>

  </div>

  <!--  Workflow zone  -->
  <div class="workflow g-flex-auto" #workflow>

    <div class="g-text-centered" *ngIf="flowIsLoading">
      <fl-loader></fl-loader>
    </div>

  </div>
</div>

<ng-template #showError>
  <fl-error-text [errorMessage]="'error' | translate"></fl-error-text>
</ng-template>
