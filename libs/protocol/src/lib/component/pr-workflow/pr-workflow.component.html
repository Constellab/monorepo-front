@if (!error) {
  <div class="g-full-height g-layout-col">
    <!--  Workflow header  -->
    @if (!flowIsLoading) {
      <div class="header g-layout-row g-layout-start-center g-layout-gap-1em">
        <ng-content></ng-content>
        <div class="divider"></div>
        <pr-workflow-layers-breadcrumb></pr-workflow-layers-breadcrumb>
      </div>
    }
    <!--  Workflow zone  -->
    <div #workflow>
      @if (flowIsLoading) {
        <div class="g-text-centered">
          <fl-loader></fl-loader>
        </div>
      }
    </div>
  </div>
} @else {
  <fl-error-text [errorMessage]="'error' | translate"></fl-error-text>
}
