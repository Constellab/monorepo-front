<div class="g-layout-col g-layout-between-center">

  <!-- Title   -->
  <div class="text title">
    {{ title$ | async | flTranslatableText }}
  </div>
  <div class="text name g-text-light g-layout-row g-layout-start-center">
    {{ subTitle$ | async }}
    <mat-icon *ngIf="(typeStatus$ | async) === 'UNAVAILABLE'" color="warn"
              class="error-icon" [matTooltip]="'pr.process_not_available' | translate">
      error
    </mat-icon>
  </div>

  <!--  actions -->
  <div class="g-layout-row g-layout-start-center">

    <!--   Only for protocol, possibility to zoom in   -->
    <button *ngIf="isProtocol" (click)="zoomInProtocol()" class="icon"
            mat-icon-button type="button" [disabled]="layerIsLoading$ | async">
      <mat-icon>loupe</mat-icon>
    </button>

    <!--   Only in edit mode to open configuration   -->
    <button *ngIf="showConfigButton$ | async" (click)="openNodeConfiguration()"
            [matTooltip]="'pr.process_configuration' | translate"
            mat-icon-button type="button" class="icon">
      <mat-icon flIcon="process_config"></mat-icon>
    </button>

    <button mat-icon-button type="button" class="icon"
            (click)="openNodeDetail()" [matTooltip]="'pr.open_node_detail' | translate">
      <mat-icon>info</mat-icon>
    </button>

    <fl-status-chip mode="iconOnly" [status]="status$" class="icon"></fl-status-chip>
  </div>
</div>
