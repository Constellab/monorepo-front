<div>

  <div class="g-layout-col g-layout-between-center">

    <!-- Title   -->
    <div class="text title">
      {{node.title() | flTranslatableText}}
    </div>
    <div class="text name g-text-light">
      {{node.subTitle()}}
    </div>


    <!--  actions -->
    <div class="g-layout-row g-layout-start-center g-layout-gap-05em">
      <mat-icon *ngIf="node.objectSignal().typeStatus === 'UNAVAILABLE'" color="warn"
                class="type-unavailable" [matTooltip]="'pr.process_not_available' | translate">
        error
      </mat-icon>

      <!--   Only for protocol, possibility to zoom in   -->
      <button *ngIf="isProtocol" (click)="zoomInProtocol()"
              mat-icon-button type="button" [disabled]="layerIsLoading$ | async">
        <mat-icon>loupe</mat-icon>
      </button>

      <button mat-icon-button type="button"
              (click)="openNodeDetail()" [matTooltip]="'pr.open_node_detail' | translate">
        <mat-icon>info</mat-icon>
      </button>

      <fl-status-chip mode="iconOnly" [status]="status()"></fl-status-chip>
    </div>
  </div>

  <!-- Body -->
  <div>
  </div>
</div>
