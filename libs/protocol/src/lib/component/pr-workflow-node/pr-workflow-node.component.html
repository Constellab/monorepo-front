<pr-workflow-node-content [icon]="icon$ | async"
                          [title]="title$ | async | flTranslatableText">


  <pr-workflow-left-button *ngIf="isProtocol" class="left">
    <!--   Only for protocol, possibility to zoom in   -->
    <button (click)="zoomInProtocol($event)" class="icon"
            mat-icon-button type="button" [disabled]="layerIsLoading$ | async"
            [matTooltip]="'pr.open_protocol_detail' | translate">
      <mat-icon>loupe</mat-icon>
    </button>
  </pr-workflow-left-button>

  <pr-workflow-right-button>
    @if (status$ | async; as status) {
      <div class="status">
        @switch (status.value) {
          @case ('SUCCESS') {
            <mat-icon color="primary" [flIcon]="status.icon" [matTooltip]="status.name | translate"></mat-icon>
          }
          @case ('ERROR') {
            <mat-icon color="warn" [flIcon]="status.icon" [matTooltip]="status.name | translate"></mat-icon>
          }
          @case ('RUNNING') {
            <fl-loader [size]="20" [matTooltip]="status.name | translate"></fl-loader>
          }
        }
      </div>
    }
  </pr-workflow-right-button>
</pr-workflow-node-content>
