<div class="container">

  <div class="g-layout-col g-layout-between-center">

    <!-- Title   -->
    <div class="name g-text-small">
      {{title() | async | flTranslatableText}}
    </div>


    <!--  actions -->
    <div class="g-layout-row g-layout-start-center g-layout-gap-05em">
      <ng-container *ngIf="node.resourceId()">
        <button mat-stroked-button type="button" class="g-button-small button"
                (click)="openResourceDetail(node.resourceId())">
          <mat-icon>visibility</mat-icon>
          {{'resource' | translate}}
        </button>
      </ng-container>
      <!--      <fl-status-chip mode="iconOnly" [status]="node.object.status"></fl-status-chip>-->
    </div>
  </div>

</div>
