<div>

  <div class="g-layout-col g-layout-between-center">

    <!-- Title   -->
    <div class="name g- g-text-small">
      {{title() | async | flTranslatableText}}
    </div>


    <!--  actions -->
    <div class="g-layout-row g-layout-start-center g-layout-gap-05em">
      <button mat-icon-button type="button"
              (click)="openNodeDetail()" [matTooltip]="'pr.open_node_detail' | translate">
        <mat-icon>info</mat-icon>
      </button>

      <button mat-icon-button type="button" *ngIf="!isConfigured()"
              (click)="openNodeDetail()" [matTooltip]="'pr.viewer_not_configured' | translate">
        <mat-icon>warnings</mat-icon>
      </button>

      <button *ngIf="node.objectSignal().status.value === 'SUCCESS'" mat-stroked-button type="button" (click)="callView()"
              [matTooltip]="'pr.show_view' | translate" class="g-button-small">
        <mat-icon>visibility</mat-icon>
      </button>


    </div>
  </div>

</div>
