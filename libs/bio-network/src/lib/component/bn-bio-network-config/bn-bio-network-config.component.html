<div>
  <div class="g-mat-checkbox-include-bottom g-layout-col">
    <!--  Select the network  -->
    @if (networks) {
      <mat-form-field class="network-select">
        <mat-label>{{ 'bnBioNetwork.select_network' | translate }}</mat-label>
        <mat-select
          placeholder="{{ 'bnBioNetwork.select_network' | translate }}"
          [(ngModel)]="networkName"
          (selectionChange)="onNetworkChange($event)"
          class="g-mat-select-capitalize">
          @for (network of networks; track network) {
            <mat-option [value]="network.name">
              <div class="g-text-capitalize-first">{{ network.name }}</div>
            </mat-option>
          }
        </mat-select>
      </mat-form-field>
    }
