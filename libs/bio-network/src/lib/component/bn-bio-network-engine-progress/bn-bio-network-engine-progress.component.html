@if (progress$ | async; as progress) {
  <div>
    @if (progress.status !== 'ended') {
      <p>{{ 'bnBioNetwork.calculating_positions' | translate }}</p>
      <mat-progress-bar mode="determinate" class="progress-bar" [value]="progress.progress"></mat-progress-bar>
    } @else {
      <fl-key-value>
        <fl-key>{{ 'bnBioNetwork.last_calculation_duration' | translate }}</fl-key>
        {{ progress.duration | flDuration }}
      </fl-key-value>
    }
  </div>
}
