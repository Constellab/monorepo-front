<div *ngIf="node$ | async as node; else noNode">
  <ng-container [ngSwitch]="node.type">
    <bn-bio-network-node-reaction-detail *ngSwitchCase="'reaction'"></bn-bio-network-node-reaction-detail>
    <bn-bio-network-node-metabolite-detail
      *ngSwitchCase="'metabolite'"></bn-bio-network-node-metabolite-detail>
    <bn-bio-network-node-cofactor-detail *ngSwitchCase="'cofactor'"></bn-bio-network-node-cofactor-detail>
  </ng-container>

  <mat-expansion-panel class="detail-panel">
    <mat-expansion-panel-header>
      <mat-panel-title>
        {{ 'bnBioNetwork.details' | translate }}
      </mat-panel-title>
    </mat-expansion-panel-header>

    <fl-pretty-json class="g-section json" [object]="node.data" [previewMaxTextLength]="30"></fl-pretty-json>
  </mat-expansion-panel>

  <bn-bio-network-node-layout></bn-bio-network-node-layout>

  <bn-bio-network-node-links class="g-section" [node]="node"></bn-bio-network-node-links>
</div>

<ng-template #noNode>
  <fl-error-text [errorMessage]="'bnBioNetwork.select_node_help_text' | translate"></fl-error-text>
</ng-template>
