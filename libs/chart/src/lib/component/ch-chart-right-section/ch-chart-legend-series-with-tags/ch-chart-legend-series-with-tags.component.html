<div class="container g-layout-col">
  <div class="section g-scrollable-element">
    @if (multiSeriesData; as multiSeriesData) {
      <ch-chart-legend-multi-series
        [data]="multiSeriesData"
        [disableLegends]="tagAreSelected"></ch-chart-legend-multi-series>
    }
  </div>

  @if (hasTag$ | async) {
    <div class="section tag-section g-scrollable-element">
      <div>{{ 'chChart.tags' | translate }}</div>
      <fl-tags-select-colors
        [tagColorer]="data.tagColorer"
        (colorChange)="onTagColorChange($event)"
        class="g-text-small"
        groupLayout="column"></fl-tags-select-colors>
    </div>
  }
</div>
