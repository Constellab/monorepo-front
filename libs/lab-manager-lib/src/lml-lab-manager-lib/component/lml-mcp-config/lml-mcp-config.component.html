<div class="mcp-row g-layout-row g-layout-start-center g-layout-gap-1em">
  <!-- Tile -->
  <div class="feature-tile g-layout-row g-layout-center-center flex-shrink-0">
    <mat-icon>smart_toy</mat-icon>
  </div>

  <!-- Label + description -->
  <div class="g-flex-grow">
    <div class="feature-title">{{ 'lml.mcp_server' | translate }}</div>
    <div class="g-text-small g-text-light">{{ 'lml.mcp_server_help' | translate }}</div>
  </div>

  <!-- Toggle + loader -->
  @if (!getIsLoading()) {
    <div class="g-layout-row g-layout-end-center g-layout-gap-05em">
      <mat-slide-toggle [ngModel]="enabled()" (ngModelChange)="onToggle($event)" [disabled]="saveIsLoading()">
      </mat-slide-toggle>
      @if (saveIsLoading()) {
        <fl-button-loader size="small"></fl-button-loader>
      }
    </div>
  }
</div>
