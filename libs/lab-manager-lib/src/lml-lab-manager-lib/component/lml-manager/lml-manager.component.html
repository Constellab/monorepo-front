@if (labManagerIsRunning$ | async) {
  <!--Lab config-->
  <lml-manager-config class="g-section"></lml-manager-config>
}

<!--Lab manager-->
<mat-expansion-panel id="lab-manager" class="g-section lab-manager-panel">
  <mat-expansion-panel-header>
    <mat-panel-title>
      <fl-text-icon>
        <mat-icon>tune</mat-icon>
        <h2>{{ 'lml.lab_manager_advanced_config' | translate }}</h2>
      </fl-text-icon>
    </mat-panel-title>
    <mat-panel-description class="g-layout-row g-layout-end-center">
      <button
        mat-icon-button
        type="button"
        (click)="advanced.refresh(); $event.stopPropagation()"
        [matTooltip]="'lml.lab_manager_refresh' | translate">
        <mat-icon>refresh</mat-icon>
      </button>
    </mat-panel-description>
  </mat-expansion-panel-header>

  <lml-manager-advanced #advanced></lml-manager-advanced>
</mat-expansion-panel>
