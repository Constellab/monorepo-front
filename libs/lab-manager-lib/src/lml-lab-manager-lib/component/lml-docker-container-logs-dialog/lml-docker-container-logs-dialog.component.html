<fl-dialog-header>
  {{ input.title | flTranslatableText | async }}
</fl-dialog-header>

<mat-dialog-content>
  <fl-async-section [object]="input.logs$" [showServerErrorText]="true" [emptyText]="'lml.no_log'">
    <ng-container *flSectionBody="input.logs$ as logs">
      <p class="logs g-text-small">{{ logs.logs }}</p>
    </ng-container>
  </fl-async-section>
</mat-dialog-content>
