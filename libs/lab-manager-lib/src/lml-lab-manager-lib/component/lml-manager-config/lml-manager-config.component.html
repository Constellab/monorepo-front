<fl-card>
  <fl-card-header>
    <fl-text-icon>
      <mat-icon flIcon="brick"></mat-icon>
      <h2>{{ 'lml.bricks' | translate }}</h2>
    </fl-text-icon>
  </fl-card-header>

  <fl-card-body>
    <fl-section [object]="brickVersions()" [isLoading]="getIsLoading()">
      <ng-container *flSectionBody>
        @if (brickVersions(); as brickVersionsDatasource) {
          <lml-bricks-config-form [brickVersions]="brickVersionsDatasource"></lml-bricks-config-form>
        }
      </ng-container>
    </fl-section>
  </fl-card-body>
</fl-card>
