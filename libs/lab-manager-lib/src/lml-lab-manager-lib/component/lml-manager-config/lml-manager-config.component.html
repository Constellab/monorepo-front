<fl-section [object]="brickVersions" [isLoading]="getIsLoading">
  <ng-container *flSectionBody>
    <lml-bricks-config-form [brickVersions]="brickVersions" (configChange)="onNewConfig()">
      @if (configHasChanged) {
        <p class="help-text g-warn-text">
          {{ 'lml.lab_config_changed' | translate }}
        </p>
      }
      <button
        mat-flat-button
        color="primary"
        type="button"
        (click)="saveConfig()"
        class="g-centered-forced save-button">
        <mat-icon>save</mat-icon>
        {{ 'lml.save' | translate }}
        @if (saveIsLoading) {
          <fl-button-loader></fl-button-loader>
        }
      </button>
    </lml-bricks-config-form>
  </ng-container>
</fl-section>
