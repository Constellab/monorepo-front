<fl-async-section [object]="containers$" [isFlStatusEvent]="true">
  <fl-section-header>
    <h2>{{ 'lml.containers' | translate }}</h2>

    <fl-section-actions>
      <button mat-stroked-button type="button" class="g-button-small button" (click)="refresh()">
        <mat-icon>refresh</mat-icon>
        <span>{{ 'lml.lab_manager_refresh' | translate }}</span>
      </button>
    </fl-section-actions>
  </fl-section-header>
  <ng-container *flSectionBodyStatusObsEvent="containers$ as containers">
    <lml-docker-containers-list [containers]="containers" [readonly]="readonly"></lml-docker-containers-list>
  </ng-container>
</fl-async-section>
