<fl-dialog-header>
  {{ title | translate }}
</fl-dialog-header>

<mat-dialog-content>
  <form (ngSubmit)="submit()" id="lab-up-form" [formGroup]="formGp" class="form">
    <!--  Update containers  -->
    <div>
      <mat-checkbox formControlName="updateContainers">
        {{ 'lml.lab_update_containers' | translate }}
      </mat-checkbox>
    </div>

    <!--  Docker prune  -->
    <div>
      <mat-checkbox formControlName="pruneSystem">
        {{ 'lml.lab_prune_system' | translate }}
      </mat-checkbox>
    </div>

    <!--  Docker destroy container  -->
    @if(isRestart){
    <div>
      <mat-checkbox formControlName="destroyContainers">
        {{ 'lml.lab_restart_destroy_containers' | translate }}
      </mat-checkbox>
    </div>
    }
  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-flat-button color="primary" type="submit" form="lab-up-form" class="g-centered-forced">
    {{ submitLabel | translate }}
  </button>
</div>
