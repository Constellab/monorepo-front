<mat-accordion>
  @for (container of containers; track container.names) {
    <mat-expansion-panel [disabled]="!container.containerExists">
      <mat-expansion-panel-header>
        <mat-panel-title>
          <div class="g-layout-row g-layout-between g-full">
            <div class="g-layout-row g-layout-start-center g-layout-gap-1em">
              <fl-status-chip [status]="container.status"></fl-status-chip>
              <span>{{ container.names }}</span>
            </div>

            <div class="g-layout-row">
              <button
                mat-icon-button
                type="button"
                (click)="viewContainerLogs(container, $event)"
                [matTooltip]="'lml.container_logs' | translate">
                <mat-icon>description</mat-icon>
              </button>

              <button mat-icon-button [matMenuTriggerFor]="menu" (click)="stopEventPropagation($event)">
                <mat-icon>more_vert</mat-icon>
              </button>
              <mat-menu #menu="matMenu" xPosition="before">
                @if (container.containerExists) {
                  <button mat-menu-item type="button" (click)="downloadLogs(container.names)">
                    <mat-icon>cloud_download</mat-icon>
                    <span>{{ 'lml.container_download_logs' | translate }}</span>
                  </button>

                  <button mat-menu-item type="button" (click)="showErrors(container.names)">
                    <mat-icon>error</mat-icon>
                    <span>{{ 'lml.show_errors' | translate }}</span>
                  </button>
                }

                @if (!readonly) {
                  <button mat-menu-item type="button" (click)="startComposeContainer(container)">
                    <mat-icon>play_arrow</mat-icon>
                    <span>{{ 'lml.container_start' | translate }}</span>
                  </button>

                  @if (container.containerExists) {
                    <button mat-menu-item type="button" (click)="stopContainer(container.names)" class="warn">
                      <mat-icon>stop</mat-icon>
                      <span>{{ 'lml.container_stop' | translate }}</span>
                    </button>

                    <button
                      mat-menu-item
                      type="button"
                      (click)="deleteContainer(container.names)"
                      class="warn">
                      <mat-icon>delete</mat-icon>
                      <span>{{ 'lml.container_delete' | translate }}</span>
                    </button>
                  }
                }
              </mat-menu>
            </div>
          </div>
        </mat-panel-title>
      </mat-expansion-panel-header>

      <ng-template matExpansionPanelContent>
        <lml-docker-container-details [containerName]="container.names"></lml-docker-container-details>
      </ng-template>
    </mat-expansion-panel>
  }
</mat-accordion>
