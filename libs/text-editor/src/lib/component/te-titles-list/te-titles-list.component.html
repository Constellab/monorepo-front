@if (titles && titles.length > 0) {
  <h6 class="side-box-title">
    <fl-text-icon>
      <mat-icon>toc</mat-icon>
      {{ 'teTextEditor.table_of_contents' | translate }}
    </fl-text-icon>
  </h6>
  @for (title of titles; track title.text) {
    <a [routerLink]="'.'" [fragment]="title.text.toLowerCase().replaceAll(' ', '-')"
       class="title small-text" [ngClass]="title.level === 2 ? 'big-title' : 'small-title'">
      {{ title.text }}
    </a>
  }
}
