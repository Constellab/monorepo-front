@if (titles().length > 0) {
  <fl-text-icon class="side-box-title">
    <mat-icon>toc</mat-icon>
    {{ 'teTextEditor.table_of_contents' | translate }}
  </fl-text-icon>
  @for (title of titles(); track title.text) {
    <a
      [routerLink]="'.'"
      [fragment]="title.text.toLowerCase().replaceAll(' ', '-')"
      class="title small-text"
      [ngClass]="title.level === header1 ? 'big-title' : 'small-title'">
      {{ title.text }}
    </a>
  }
}
