<figure class="container">
  <div class="video-wrapper" *ngIf="sanitizedUrl">
    <iframe [src]="sanitizedUrl"></iframe>
  </div>

  <div *ngIf="urlError" class="g-text-light g-text-centered">
    <p>{{ 'teTextEditor.video_url_error' | translate }}</p>
  </div>

  <figcaption class="g-text-centered">
    <te-title-caption [(title)]="videoTitle" [(caption)]="caption" [editable]="!disabled"></te-title-caption>
  </figcaption>
</figure>
