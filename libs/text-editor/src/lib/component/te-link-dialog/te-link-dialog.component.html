<fl-dialog-header>
  {{ title | translate }}
</fl-dialog-header>

<mat-dialog-content>
  <form (ngSubmit)="submit()" id="link-form">
    <!--  url  -->
    <mat-form-field class="g-form-input">
      <mat-label>{{ 'teTextEditor.url' | translate }}</mat-label>
      <input matInput [formControl]="linkControl" required [placeholder]="'teTextEditor.url' | translate" />
      @if (linkControl.hasError('required')) {
        <mat-error>{{ 'teTextEditor.url' | flErrorRequired }}</mat-error>
      }
      @if (linkControl.hasError('notYoutube')) {
        <mat-error>{{ linkControl.getError('notYoutube') | translate }}</mat-error>
      }
    </mat-form-field>
  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-flat-button type="submit" form="link-form" class="g-centered-forced primary">
    {{ 'teTextEditor.ok' | translate }}
  </button>
</div>
