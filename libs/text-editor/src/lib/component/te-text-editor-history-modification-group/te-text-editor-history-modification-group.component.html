<div class="modification-group">
  <div class="group-header" (click)="openGroupModificationVisualizer()">
    <div class="group-title">
      <div class="group-title-icon-div">
        <button mat-icon-button (click)="toggleGroup($event)">
          @if(groupOpened){
            <mat-icon>keyboard_arrow_down</mat-icon>
          } @else {
            <mat-icon>keyboard_arrow_right</mat-icon>
          }
        </button>
      </div>
      <span>
      {{ group.end | flDate: 'DATE_TIME' }}
    </span>
    </div>
    <div class="group-users">
      @for (user of users; track user.id) {
        <fl-user-inline [user]="user" [portalOnHover]="false"></fl-user-inline>
      }
    </div>
  </div>
  @if (groupOpened){
    <div class="group-body">
      @for (modification of group.modifications; track group.modifications) {
        <div class="group-body-modification" (click)="openModificationVisualizer(modification)">
          <te-text-editor-history-modification [modification]="modification"></te-text-editor-history-modification>
        </div>
      }
    </div>
  }
</div>
