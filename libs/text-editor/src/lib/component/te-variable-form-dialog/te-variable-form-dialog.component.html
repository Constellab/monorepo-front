<fl-dialog-header>
  {{ 'teTextEditor.variable' | translate }}
</fl-dialog-header>

<mat-dialog-content>

  <form [formGroup]="formGroup" id="te-variable-form"
        (ngSubmit)="save()"
        class="g-full g-form-field-compact g-layout-row-wrap g-layout-between-center">

    <!--  Name  -->
    <mat-form-field class="g-search-field">
      <mat-label>{{ 'teTextEditor.name' | translate }}</mat-label>
      <input matInput formControlName="name" required flInputMaxLength="50"
             [placeholder]="'teTextEditor.name' | translate">
    </mat-form-field>

    <!--    &lt;!&ndash; Type &ndash;&gt;-->
    <!--    <mat-form-field class="g-search-field">-->
    <!--      <mat-label>{{ 'type' | translate }}</mat-label>-->
    <!--      <mat-select formControlName="type">-->
    <!--        <mat-option value="string">String</mat-option>-->
    <!--        <mat-option value="number">Number</mat-option>-->
    <!--        <mat-option value="boolean">Boolean</mat-option>-->
    <!--      </mat-select>-->
    <!--    </mat-form-field>-->


    <!--  Description  -->
    <mat-form-field class="g-full">
      <mat-label>{{ 'teTextEditor.description' | translate }}</mat-label>
      <input matInput formControlName="description"
             flInputMaxLength="255"
             [placeholder]="'teTextEditor.description' | translate">
    </mat-form-field>

    <!--  Value  -->
    <mat-form-field class="g-full g-form-field-no-hint">
      <mat-label>{{ 'teTextEditor.value' | translate }}</mat-label>
      <input matInput formControlName="value" [placeholder]="'teTextEditor.value' | translate">
    </mat-form-field>

  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-flat-button color="primary" type="submit" form="te-variable-form"
          class="g-centered-forced">
    {{ (isEditable ? 'teTextEditor.save' : 'teTextEditor.ok') | translate }}
  </button>
</div>
