<div
  #editorContainer
  class="text-container g-text-editor g-styled-scrollbar"
  (keydown.control.Z)="undoEvent($event)"
  (keydown.control.Y)="redoEvent($event)"
  (keydown.shift.control.Z)="redoEvent($event)"
  flAutoScrollToAnchor
  [flAutoScrollHasIsLoaded]="true"
  [flAutoScrollIsLoaded$]="isLoaded$"></div>
