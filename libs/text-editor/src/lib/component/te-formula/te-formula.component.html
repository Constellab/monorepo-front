<div class="g-layout-row g-layout-center-center g-layout-gap-1em"
     *ngIf="formula$ | async">

  <!-- Fake button to center the formula -->
  <div *ngIf="!disabled" class="fake-button"></div>

  <fl-formula [formula]="formula$"></fl-formula>

  <button *ngIf="!disabled" mat-icon-button type="button"
          class="g-button-icon-small" (click)="updateFormula()"
          [matTooltip]="'flFormula.edit_formula' | translate">
    <mat-icon>edit</mat-icon>
  </button>

</div>

<div class="g-text-centered" contenteditable="false">
  <te-title-caption [(title)]="formulaTitle" [(caption)]="caption"
                    [editable]="!disabled"></te-title-caption>
</div>
