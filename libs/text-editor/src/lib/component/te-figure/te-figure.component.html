@if (imageReady) {
  <figure #figure>
    <div
      flResize="bothKeepRatio"
      class="image-container"
      (flResizeChanged)="onImageResize($event)"
      [disabled$]="disabled$"
      [style.width]="imageWidth + 'px'"
      [style.height]="imageHeight + 'px'">
      <img
        [ngSrc]="sanitizedUrl"
        [width]="imageWidth"
        [height]="imageHeight"
        draggable="false"
        flImageFullscreen
        [alt]="data.title"
        class="image"
        (error)="onImageLoadError()" />
    </div>
    <figcaption class="g-text-centered">
      <te-title-caption
        [(title)]="data.title"
        [(caption)]="data.caption"
        [editable]="!disabled"></te-title-caption>
    </figcaption>
  </figure>
} @else {
  @if (!uploadIsLoading) {
    <fl-input-file-container class="file-input-container primary">
      <input
        flInputFile
        type="file"
        [strictMode]="true"
        [disabled]="disabled"
        accept="image/*"
        [autoClearHtmlInput]="true"
        (fileChange)="onFileSelected($any($event))" />
    </fl-input-file-container>
  }
  @if (uploadIsLoading) {
    <div class="g-text-centered">
      <fl-loader size="medium"></fl-loader>
    </div>
  }
}
