<form [formGroup]="formGroup"
      class="g-full g-form-field-compact g-layout-row-wrap g-layout-between-center">

  <!--  Name  -->
  <mat-form-field class="g-search-field">
    <mat-label>{{ 'name' | translate }}</mat-label>
    <input matInput formControlName="name" required flInputMaxLength="50"
           [placeholder]="'name' | translate">
  </mat-form-field>

  <!-- Type -->
  <mat-form-field class="g-search-field">
    <mat-label>{{ 'type' | translate }}</mat-label>
    <mat-select formControlName="type">
      <mat-option value="string">String</mat-option>
      <mat-option value="number">Number</mat-option>
      <mat-option value="boolean">Boolean</mat-option>
    </mat-select>
  </mat-form-field>


  <!--  Description  -->
  <mat-form-field class="g-full g-form-field-no-hint">
    <mat-label>{{ 'description' | translate }}</mat-label>
    <input matInput formControlName="description" required flInputMaxLength="255"
           [placeholder]="'description' | translate">
  </mat-form-field>

</form>
