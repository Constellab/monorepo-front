@if (browserSide) {
  <te-text-editor-browser-side
    [config]="config"
    [placeholder]="placeholder"
    [event]="event"
    [disabled]="disabled"
    (textChange)="onTextChange($event)"
    [richText]="value"></te-text-editor-browser-side>
} @else {
  <te-text-editor-server-side [richText]="value"></te-text-editor-server-side>
}
