@if (!browserSide) {
  <te-text-editor-server-side [value]="value"></te-text-editor-server-side>
} @else {

  <te-text-editor-browser-side [config]="config" [disabled$]="editorDisabled$" [placeholder]="placeholder"
                               [hideToolbar]="hideToolbar" [disabled]="disabled" [value$]="value$"
                               [includeToolbarButton]="includeToolbarButton" (textChange)="onTextChange($event)"
                               [value]="value"></te-text-editor-browser-side>
}
