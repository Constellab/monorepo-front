@if (!browserSide) {
  <te-text-editor-server-side [value]="value"></te-text-editor-server-side>
} @else {

  <te-text-editor-browser-side [config]="config" [placeholder]="placeholder"
                               [disabled]="disabled"
                               (textChange)="onTextChange($event)"
                               [value]="value"></te-text-editor-browser-side>
}
