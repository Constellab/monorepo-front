@if (fileUrl) {
  <div
    class="g-layout-row g-layout-start-center g-layout-gap-05em file-container"
    (click)="openDocumentPreview()">
    <fl-file-text-icon [filename]="data.name"></fl-file-text-icon>
    <div class="g-text-light">{{ data.size | flByteText }}</div>
  </div>
} @else {
  @if (!uploadIsLoading) {
    <fl-input-file-container class="file-input-container primary">
      <input
        flInputFile
        type="file"
        [autoClearHtmlInput]="true"
        [disabled]="disabled"
        (fileChange)="onFileSelected($any($event))" />
    </fl-input-file-container>
  }

  @if (uploadIsLoading) {
    <div class="g-text-centered">
      <fl-loader size="medium"></fl-loader>
    </div>
  }
}
