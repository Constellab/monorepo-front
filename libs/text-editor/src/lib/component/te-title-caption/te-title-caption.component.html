<span class="container g-text-light g-text-small">
  <span *ngIf="title || caption">
    <strong>{{ title }}</strong>
    <ng-container *ngIf="title && caption">.</ng-container>
    {{ caption }}
  </span>
  <button
    mat-icon-button
    type="button"
    *ngIf="editable"
    class="g-button-icon-tiny"
    (click)="openEditDialog()">
    <mat-icon>edit</mat-icon>
  </button>
</span>

<ng-template #templatePortalContent>
  <mat-dialog-content>
    <form (ngSubmit)="closeDialog()">
      <div class="g-layout-col">
        <mat-form-field>
          <mat-label>{{ 'teTextEditor.title' | translate }}</mat-label>
          <input
            matInput
            [(ngModel)]="title"
            [placeholder]="'teTextEditor.title' | translate"
            name="title"
            flInputMaxLength="50" />
        </mat-form-field>

        <mat-form-field>
          <mat-label>{{ 'teTextEditor.caption' | translate }}</mat-label>
          <textarea
            matInput
            [(ngModel)]="caption"
            [placeholder]="'teTextEditor.caption' | translate"
            name="caption"
            rows="4">
          </textarea>
        </mat-form-field>
        <div class="g-text-centered">
          <button mat-stroked-button type="submit" class="g-button-small">
            {{ 'teTextEditor.ok' | translate }}
          </button>
        </div>
      </div>
    </form>
  </mat-dialog-content>
</ng-template>
