@if (files && files.length > 0) {
  <div class="files-div">
    <h6 class="side-box-title">
      <fl-text-icon>
        <mat-icon>description</mat-icon>
        {{ 'teTextEditor.attached_files' | translate }}
      </fl-text-icon>
    </h6>
    <div class="list-div">
      @for (file of files; track file.name) {
        <div class="file" [matTooltip]="file.name">
          <a type="button" [href]="urlToDownloadPrefix + file.name" download>
            <fl-file-text-icon [filename]="file.name"></fl-file-text-icon>
          </a>
        </div>
      }
    </div>
  </div>
}
