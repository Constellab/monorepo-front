<div class="modification">
  {{ modification.time | flDate: 'DATE_TIME' }}
  <div class="g-text-small">
    <span>
      <fl-user-inline [user]="modification.user" [portalOnHover]="false"></fl-user-inline>
      {{
        'teTextEditor.modification_text'
          | translate
            : { action: ('teTextEditor.' + modification.type | translate), type: modification.blockType }
      }}
    </span>
  </div>
</div>
