<fl-dialog-header [closeButtonData]="config">
  {{ 'td.edit_param_specs' | translate }}
</fl-dialog-header>
<mat-dialog-content>
  <button type="button" mat-raised-button color="primary" (click)="openEditParamSpecDialog()">
    {{ 'td.add_param_spec' | translate }}
  </button>
  <td-editable-param-specs-table
    [editParamSpecState]="dynamicParamSpecState"
    (onEditElementClick)="openEditParamSpecDialog($event)"
    (onDeleteElementClick)="openDeleteParamDialog($event)"></td-editable-param-specs-table>
</mat-dialog-content>
