<fl-dialog-header>
  {{ 'td.edit_param_specs' | translate }}
</fl-dialog-header>

<mat-dialog-content>
  <div class="agent-params-description-div">
    {{ 'td.param_spec_description' | translate }}
  </div>

  <td-editable-param-specs-table
    (editElementClick)="openEditParamSpecDialog($event)"
    (deleteElementClick)="openDeleteParamDialog($event)"></td-editable-param-specs-table>
</mat-dialog-content>
<mat-dialog-actions class="action-div">
  <button mat-flat-button class="primary" (click)="openEditParamSpecDialog()">
    <mat-icon>create</mat-icon>
    {{ 'td.add_param_spec' | translate }}
  </button>
</mat-dialog-actions>
