<span class="td-expression-display">
  @for (seg of segments(); track $index) {
    @if (seg.type === 'text') {
      {{ seg.value }}
    }
    @if (seg.type === 'field') {
      <span
        class="td-field-token"
        [class.td-field-token-outer]="seg.isOuter"
        (mouseenter)="showTooltip($any($event.target), seg)"
        (focus)="(null)"
        (mouseleave)="hideTooltip()"
        (blur)="hideTooltip()"
        >{{ seg.isOuter ? '@@' : '@' }}{{ seg.entry?.spec.human_name || seg.key }}</span
      >
    }
  }
</span>

<ng-template #tooltipTemplate>
  <div class="td-field-tooltip">
    @if (tooltipSpec(); as entry) {
      @if (tooltipIsOuter()) {
        <div class="td-tooltip-outer-badge">{{ 'td.outer_variables' | translate }}</div>
      }
      <td-param-spec-inline [entry]="entry"></td-param-spec-inline>
    }
  </div>
</ng-template>
