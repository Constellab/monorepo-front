<fl-dialog-header>
  @if (isEdit) {
    {{ 'td.edit_param_spec' | translate }}
  } @else {
    {{ 'td.create_param_spec' | translate }}
  }
</fl-dialog-header>

<mat-dialog-content class="content">
  <fl-dynamic-form-group class="g-form-field-compact" [control]="formGroup" [config]="formGroupConfig">
  </fl-dynamic-form-group>
  <button mat-raised-button color="primary" (click)="saveParamSpec()" type="button" class="save-button">
    {{ 'td.save' | translate }}
  </button>
</mat-dialog-content>
