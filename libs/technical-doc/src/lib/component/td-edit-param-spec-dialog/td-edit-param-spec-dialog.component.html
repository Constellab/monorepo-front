<fl-dialog-header>
  @if (isEdit) {
    {{ 'td.edit_param_spec' | translate }}
  } @else {
    {{ 'td.create_param_spec' | translate }}
  }
</fl-dialog-header>

<mat-dialog-content class="content">
  @if (isLoading) {
    <fl-loader class="loader"></fl-loader>
  } @else {
    <fl-dynamic-form-group class="g-form-field-compact" [control]="formGroup" [config]="formGroupConfig">
    </fl-dynamic-form-group>
    <button
      mat-flat-button
      (click)="saveParamSpec()"
      type="button"
      class="save-button primary"
      [disabled]="formGroup.invalid || isButtonLoading">
      {{ 'td.save' | translate }}
      @if (isButtonLoading) {
        <fl-button-loader></fl-button-loader>
      }
    </button>
  }
</mat-dialog-content>
