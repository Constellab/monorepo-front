<div>
  <div class="g-layout-row">
    <div class="name-container">
      <div class="io-human-name g-text-dense-height">{{ ioSpec.human_name }}</div>
      <div *ngIf="ioSpec.short_description" class="g-text-light g-text-dense-height">
        {{ ioSpec.short_description }}
      </div>
    </div>

    <div class="g-layout-row-wrap g-layout-start-start">
      <fl-chip
        class="g-primary-background chip"
        *ngIf="ioSpec.is_optional"
        [matTooltip]="'td.optional_tooltip' | translate"
        size="small">
        {{ 'td.optional' | translate }}
      </fl-chip>
      <fl-chip
        class="g-primary-background chip"
        *ngIf="ioSpec.is_constant"
        [matTooltip]="'td.constant_tooltip' | translate"
        size="small">
        {{ 'td.constant' | translate }}
      </fl-chip>
    </div>

    <div *ngIf="showEditButton">
      <button mat-icon-button [matMenuTriggerFor]="menu" class="g-button-icon-small">
        <mat-icon>more_vert</mat-icon>
      </button>
    </div>
  </div>

  <div class="g-layout-row-wrap resource-types">
    <td-io-resource
      *ngFor="let resourceType of ioSpec.resource_types"
      [resource]="resourceType"
      class="resource-type"></td-io-resource>
  </div>
</div>

<mat-menu #menu="matMenu">
  <button mat-menu-item type="button" (click)="updateSpecClicked()">
    <mat-icon>edit</mat-icon>
    <span>{{ 'td.update_port' | translate }}</span>
  </button>

  <button mat-menu-item type="button" (click)="deleteSpecClicked()">
    <mat-icon color="warn">clear</mat-icon>
    <span class="g-warn-text">{{ 'td.remove_port' | translate }}</span>
  </button>
</mat-menu>
