@if (isParamSet()) {
  <button mat-stroked-button class="g-button-small" (click)="openParamSetDialog()">
    {{ 'td.form_view_table' | translate: { count: paramSetRowCount() } }}
  </button>
} @else {
  <div class="td-param-value-row">
    @if (isComputed()) {
      <span
        class="td-param-value-computed-chip"
        [matTooltip]="
          expression()
            ? ('td.computed_expression_tooltip' | translate) + ': ' + expression()
            : ('td.computed_value_tooltip' | translate)
        ">
        {{ displayValue() }}
      </span>
    } @else {
      <span>{{ displayValue() }}</span>
    }
  </div>
  @if (error()) {
    <span class="td-param-value-error g-text-small">{{ error() }}</span>
  }
}
