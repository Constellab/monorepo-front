<td-main-doc [entity]="resource"></td-main-doc>

<div class="methods-div">
  <h4>{{'td.views' | translate}}</h4>
  @if(orderedViews && orderedViews.length > 0){
    <div *ngFor="let v of orderedViews"  class="method-card">
      <div class="view-title">
        <td-type-icon-badge *ngIf="v.style" [style]="v.style" [iconSize]="30"></td-type-icon-badge>
        <span>{{v.human_name.toUpperCase() + ' - ' +  v.method_name + '()'}}</span>
        <mat-chip *ngIf="v.default_view" color="primary">{{'td.default_view' | translate}}</mat-chip>
      </div>
      <span class="view-description" *ngIf="v?.short_description">{{v.short_description}}</span>
    </div>
  }
</div>

<div class="methods-div">
  <h4>{{'td.functions' | translate}}</h4>
  <div class="method-card">
    <ng-container *ngFor="let func of resource.methods.funcs">
      <a class="func-code-line" [routerLink]="'.'" [fragment]="func.name">
        <code>
          <td-resource-doc-function-signature [func]="func"></td-resource-doc-function-signature>
        </code>
        <br>
      </a>
    </ng-container>
  </div>

  <div *ngFor="let func of resource.methods.funcs" id="{{func.name}}" class="func">
    <td-resource-doc-func-info [func]="func"></td-resource-doc-func-info>
  </div>
</div>
