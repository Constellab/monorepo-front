@if (iconType === 'MATERIAL_ICON' || iconType === 'COMMUNITY_ICON') {
  <mat-icon [flIcon]="iconFull"
            [style.color]="iconColor"
            [style.width]="sizePx"
            [style.height]="sizePx"
            [style.font-size]="sizePx"
            class="icon">
  </mat-icon>
} @else {
  <img [src]="iconFull"
       [width]="iconSize"
       [height]="iconSize">
}
