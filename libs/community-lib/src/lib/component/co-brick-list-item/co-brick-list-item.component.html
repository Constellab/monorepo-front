<co-community-list-item
  [title]="brick.name"
  [space]="brick.space"
  [showVisibility]="true"
  [description]="brick.description"
  [user]="brick.createdBy"
  [date]="brick.createdAt"
  [likes]="brick.likes">
<!--  [comments]="brick.comments">-->
  <div rightSide class="brick-right-side">
    <div class="brick-logo" [style.background-image]="'url(' + brickImage + ')'"></div>
  </div>
</co-community-list-item>
