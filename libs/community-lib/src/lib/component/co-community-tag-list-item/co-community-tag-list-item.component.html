<co-community-list-item
  [title]="tagKey().label"
  [description]="tagKey().description?.getFirstParagraphsText()"
  [user]="tagKey().createdBy"
  [date]="tagKey().publishedAt"
  [space]="tagKey().space"
  [showVisibility]="true">
  <div leftSide>
    @if (tagKey().deprecated) {
      <co-deprecated-tag></co-deprecated-tag>
    }
  </div>
</co-community-list-item>
