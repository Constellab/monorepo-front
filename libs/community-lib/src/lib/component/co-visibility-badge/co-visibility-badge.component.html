<div class="visibility-badge" [style.font-size]="textSize()">
  @if (spacePhoto(); as photo) {
    <div [style.width]="iconSize()" [style.height]="iconSize()" class="space-badge-photo">
      <img [ngSrc]="photo" [alt]="(space()?.name ?? '') + ' image'" fill />
    </div>
  } @else {
    <mat-icon [style.width]="iconSize()" [style.height]="iconSize()" [style.font-size]="iconSize()">
      @if (space()) {
        groups
      } @else {
        public
      }
    </mat-icon>
  }
  <span>
    @if (space(); as currentSpace) {
      {{ currentSpace.name.trim() }}
    } @else {
      {{ 'coCommunityLib.public' | translate }}
    }
  </span>
</div>
