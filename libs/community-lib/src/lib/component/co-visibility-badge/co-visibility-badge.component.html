@if (!space) {
  <div class="g-badge visibility-badge-div public-badge-div">
    <fl-text-icon [gap]="'6px'">
      <mat-icon class="icon">public</mat-icon>
      {{ 'coCommunityLib.public' | translate }}
    </fl-text-icon>
  </div>
} @else {
  <div class="g-badge visibility-badge-div space-badge-div g-text-dense-height">
    @if (space.photo) {
      <img [ngSrc]="spacePhoto" height="20" width="20" class="space-badge-photo"
           [alt]="space.name + 'image'" />
    } @else {
      <mat-icon class="icon">lock</mat-icon>
    }
    <span>{{ space.name.trim() }}</span>
  </div>
}
