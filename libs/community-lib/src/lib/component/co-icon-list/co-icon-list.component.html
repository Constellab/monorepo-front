<div class="icons-search-bar-div">
  <form (ngSubmit)="search()">
    <mat-form-field class="icons-search-bar">
      <input
        matInput
        [formControl]="searchFormControl"
        placeholder="{{ 'coCommunityLib.search_icon' | translate }}" />
      <button mat-icon-button matSuffix type="submit" [matTooltip]="'coCommunityLib.search' | translate">
        <mat-icon>search</mat-icon>
      </button>
    </mat-form-field>
  </form>
</div>

<div
  class="icons-list-div"
  *ngIf="icons"
  (flInfiniteScroll)="loadMoreResults()"
  [flInfiniteDisabled]="icons?.isLoading || icons?.page?.last"
  [flInfiniteMode]="'auto'">
  <div
    class="icon-div"
    *ngFor="let icon of icons | flDatasourceConnect | async"
    (click)="onIconClick($event, icon)">
    <div class="icon-file-div">
      <td-type-icon
        [iconSize]="75"
        [iconTechnicalName]="icon.technicalName"
        [iconType]="icon.type"></td-type-icon>
    </div>
    <div class="icon-name-div">
      <span class="icon-name">{{ icon.name }}</span>
    </div>
  </div>
</div>

<button
  mat-flat-button
  class="load-more-icons-button primary"
  (click)="loadMoreResults()"
  *ngIf="!icons.isLoading && !icons?.page?.last">
  {{ 'coCommunityLib.load_more_icons' | translate }}
</button>
