<mat-dialog-content>
  <form (ngSubmit)="submit()" id="live-task-form" [formGroup]="formGp">

    <mat-form-field class="g-form-input">
      <mat-label>{{ 'coCommunityLib.title' | translate }}</mat-label>
      <input matInput [formControl]="formGp.controls.title" required flInputMaxLength="100"
             [placeholder]="'coCommunityLib.title' | translate">
      <mat-error *ngIf="formGp.get('title').hasError('required')">
        {{ 'title' | flErrorRequired }}
      </mat-error>
    </mat-form-field>

    <div>
      <div class="">{{ 'coCommunityLib.visibility' | translate }}</div>
      <mat-radio-group [formControlName]="'type'" [required]="true">
        <div class="spaces-div">
          <button mat-flat-button type="button" class="space-button">
            <mat-radio-button labelPosition="before" [value]="'PUBLIC'" [color]="'primary'">
              {{ 'coCommunityLib.public' | translate }}
            </mat-radio-button>
          </button>
          <button mat-flat-button type="button" class="space-button">
            <mat-radio-button labelPosition="before" [value]="'SPACE'" [color]="'primary'">
              {{ 'coCommunityLib.space' | translate }}
            </mat-radio-button>
          </button>
        </div>
      </mat-radio-group>
    </div>

    @if(formGp.get('type').value === 'SPACE'){
      <fl-async-section [object]="spaces$">
        <ng-container *flSectionBody="spaces$ as spaces">
          <div class="spaces-title">{{ 'coCommunityLib.your_spaces' | translate }}</div>
          <mat-radio-group [formControlName]="'space'" [required]="true">
            <div class="spaces-div">
              <button mat-flat-button type="button" *ngFor="let space of spaces$ | async" class="space-button">
                <mat-radio-button labelPosition="before" [value]="space" [color]="'primary'">
                  <div class="space-info">
                    @if(space.photo){
                      <img [src]="getSpacePhoto(space.photo)"/>
                    }
                    {{ space.name }}
                  </div>
                </mat-radio-button>
              </button>
            </div>
          </mat-radio-group>
        </ng-container>
      </fl-async-section>
    }

    <ng-content></ng-content>
  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-flat-button color="primary" type="submit" form="live-task-form" class="g-centered-forced"
          [disabled]="!formGp.valid && !isLoading">
    {{ 'coCommunityLib.create' | translate }}
    <fl-button-loader *ngIf="isLoading"></fl-button-loader>
  </button>
</div>
