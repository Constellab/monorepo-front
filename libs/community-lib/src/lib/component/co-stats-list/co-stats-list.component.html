<div class="stats-list" [ngClass]="dense() ? 'stats-list-dense' : ''">
  @if (executions() !== undefined) {
    <div class="stat" [matTooltip]="'coCommunityLib.number_of_run' | translate" [matTooltipDisabled]="dense()">
      <mat-icon class="stat-icon">play_circle</mat-icon>
      <span>{{ executions() }}</span>
    </div>
  }

  <div class="stat" role="button" tabindex="0" (click)="onLikeClicked()" (keydown.enter)="onLikeClicked()" [ngClass]="isClickable() ? 'g-clickable' : ''"
       [matTooltip]="'coCommunityLib.like' | translate" [matTooltipDisabled]="dense()">
    <mat-icon
      class="stat-icon"
      flIcon="like"
      [ngClass]="isLiked() || !isClickable() ? '' : 'stroke-icon'"></mat-icon>
    <span>{{ likes() }}</span>
  </div>

  @if (comments() !== undefined) {
    <div class="stat" role="button" tabindex="0" (click)="onCommentClicked()" (keydown.enter)="onCommentClicked()" [ngClass]="isClickable() ? 'g-clickable' : ''"
         [matTooltip]="'coCommunityLib.comment' | translate" [matTooltipDisabled]="dense()">
      <mat-icon class="stat-icon" flIcon="comment"></mat-icon>
      <span>{{ comments() }}</span>
    </div>
  }
</div>
