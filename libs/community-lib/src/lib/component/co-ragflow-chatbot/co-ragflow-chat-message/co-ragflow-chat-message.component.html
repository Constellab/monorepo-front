<div
  class="co-chat-message"
  [class.co-chat-message--user]="isUser()"
  [class.co-chat-message--assistant]="isAssistant()">
  <div class="co-chat-message-avatar">
    @if (isUser()) {
      <mat-icon class="g-icon-small">person</mat-icon>
    } @else {
      <mat-icon class="g-icon-small">smart_toy</mat-icon>
    }
  </div>
  <div class="co-chat-message-body">
    @if (isUser()) {
      <div class="co-chat-message-content">{{ formattedContent() }}</div>
    } @else {
      <div
        class="co-chat-message-content g-embedded-html"
        [innerHTML]="formattedContent() | flMarkdown"></div>
    }
    <!-- Sources section temporarily hidden
    @if (hasReferences()) {
      <div class="co-chat-message-sources">
        <div class="co-chat-message-sources-title">
          <mat-icon>menu_book</mat-icon>
          {{ 'coCommunityLib.chatbot_sources' | translate }}
        </div>
        <ul class="co-chat-message-sources-list">
          @for (source of uniqueSources(); track source) {
            <li class="co-chat-message-source-item">{{ source }}</li>
          }
        </ul>
      </div>
    }
    -->
  </div>
</div>
