<div (flInfiniteScroll)="loadMoreResults()" [flInfiniteDisabled]="datasource?.isLoading || datasource?.page?.last"
     flInfiniteMode="auto" class="comments-portal-div">
  <div class="comments-portal">
    <h4>{{ 'coCommunityLib.comments' | translate}} - {{entity.comments}}</h4>
    <button mat-icon-button (click)="closePortal()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <mat-card class="comment-write-card" *ngIf="user">
    <mat-card-header>
      <fl-user-inline [user]="user" [portalOnHover]="false"></fl-user-inline>
    </mat-card-header>
    <mat-card-content class="comment-write-card-content">
      <te-text-editor [config]="textEditorConfig" [formControl]="formControl"
                      [placeholder]="'coCommunityLib.write_a_comment' | translate" class="text-editor"
                      (textChange)="checkCommentValidity()" (keydown.control.enter)="sendComment()" ></te-text-editor>
    </mat-card-content>
    <mat-card-footer>
      <div class="comment-write-card-footer">
        <button mat-flat-button color="primary" [disabled]="!commentIsValid || isLoading" (click)="sendComment()">
          <fl-button-loader *ngIf="isLoading"></fl-button-loader>
          @if(!isLoading) {
            {{ 'coCommunityLib.comment' | translate}}
          }
        </button>
      </div>
    </mat-card-footer>
  </mat-card>


  <div class="comments-list-div">
    <co-comment *ngFor="let comment of datasource | flDatasourceConnect | async" [comment]="comment">

    </co-comment>
  </div>
</div>
