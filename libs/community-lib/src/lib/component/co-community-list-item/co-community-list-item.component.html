<div class="community-list-item" [ngClass]="backgroundColor === 'card' ? 'community-list-item-card-bg' : 'community-list-item-main-bg'">
  <div class="community-list-item-left-side">
    <co-community-list-item-main-content
      [title]="title"
      [description]="description"
      [user]="user"
      [date]="date"
      [likes]="likes">
      <ng-content select="[leftSide]"></ng-content>
    </co-community-list-item-main-content>
  </div>
  <div class="community-list-item-right-side">
    <ng-content select="[rightSide]"></ng-content>
  </div>
</div>
