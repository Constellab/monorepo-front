<div class="list-item-container">
  <div class="list-item-div">
    <div class="image-div">
      <co-item-type-icon [type]="type()" size="big"></co-item-type-icon>
    </div>
    <div class="content-div">
      <div class="info-div" [ngClass]="showVisibilityAndStats() ? '' : 'info-div-no-visibility'">
        <co-type-badge [type]="type()"></co-type-badge>
        @if (showVisibilityAndStats()) {
          <co-visibility-badge [space]="space()"></co-visibility-badge>
        }
      </div>
      <div class="text-div">
        <div class="title-div">
          {{ title() }}
        </div>
        <div class="short-description-div">
          {{ shortDescription() }}
        </div>
      </div>
      <div class="stats-discover-div">
        <div class="stats-div">
          @if (showVisibilityAndStats()) {
            <co-stats-list
              [likes]="likes()"
              [comments]="comments()"
              [executions]="executions()"
              [dense]="true"></co-stats-list>
          }
        </div>
        <div class="discover-div">
          {{ 'coCommunityLib.discover' | translate }}
          <mat-icon>chevron_right</mat-icon>
        </div>
      </div>
    </div>
  </div>
</div>
