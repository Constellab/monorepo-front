<div class="list-item-container">
  <div class="list-item-div" [class.main-background-list-item]="mainBackground()">
    <div class="image-div">
      @if (image()) {
        <img [ngSrc]="image()" fill="" alt="" />
      } @else {
        <co-item-type-icon [type]="type()" size="big"></co-item-type-icon>
      }
    </div>
    <div class="content-div">
      <div class="info-div">
        <div class="type-and-publish-div">
          <co-type-badge [type]="type()"></co-type-badge>
          @if (!publishedAt()) {
            <span class="not-published-message">{{ 'coCommunityLib.no_published' | translate }}</span>
          }
        </div>
        @if (showVisibility()) {
          <co-visibility-badge [space]="space()"></co-visibility-badge>
        }
      </div>
      <div class="text-div">
        <div class="title-div">
          {{ title() }}
        </div>
        <div class="short-description-div">
          {{ cleanedShortDescription() }}
        </div>
      </div>
      <div class="stats-discover-div">
        <div class="stats-div">
          <co-stats-list
            [likes]="likes()"
            [comments]="comments()"
            [executions]="executions()"
            [dense]="true"></co-stats-list>
        </div>
        @if (!hideDiscover()) {
          <div class="discover-div">
            {{ 'coCommunityLib.discover' | translate }}
            <mat-icon>chevron_right</mat-icon>
          </div>
        }
      </div>
    </div>
  </div>
</div>
