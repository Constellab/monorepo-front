<co-community-list-item
  type="app"
  [image]="appPicture()"
  [title]="communityApp().title"
  [shortDescription]="communityApp().description?.getFirstParagraphsText()"
  [space]="communityApp().space"
  [likes]="communityApp().likes ?? 0"
  [comments]="communityApp().comments ?? 0"
  [executions]="communityApp().executions ?? 0">
</co-community-list-item>
