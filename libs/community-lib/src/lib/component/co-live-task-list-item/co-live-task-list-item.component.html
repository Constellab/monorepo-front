<co-community-list-item
  [title]="liveTask.title"
  [description]="description"
  [user]="liveTask.createdBy"
  [date]="liveTask.lastModifiedAt"
  [backgroundColor]="backgroundColor">
  <div rightSide class="live-task-card-inner">
    <div>
      <p class="spacing-3-v2">{{ 'coCommunityLib.version' | translate }} :</p>
      <p class="spacing-4-v2" *ngIf="liveTask.latestPublishVersion; else notPublishedYetDiv"><b>{{ 'coCommunityLib.version' | translate }} {{ liveTask.latestPublishVersion }}</b></p>
      <div class="lt-infos-div">
        <div>
          <p class="spacing-3-v2">{{ 'coCommunityLib.task_visibility' | translate }} :</p>
          @if(!liveTask.space){
            <div class="visibility-badge g-accent-background">
              {{'public' | translate}}
            </div>
          } @else {
            <div class="visibility-badge g-warn-background">
              {{liveTask.space.name}}
            </div>
          }
        </div>
      </div>
    </div>
  </div>
</co-community-list-item>

<ng-template #notPublishedYetDiv>
  <div style="color: var(--warn-color)" class="g-text-small">
    <b>{{ 'not_published' | translate }}</b>
  </div>
</ng-template>
