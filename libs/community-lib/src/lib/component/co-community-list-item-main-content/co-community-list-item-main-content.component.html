<span class="title-space-span">
  <h2>{{ title }}</h2>
</span>

<p class="small-text description">{{ description }}</p>
<ng-content></ng-content>
<div class="lower-info-div">
  <div class="small-text user-info">
    <fl-user-inline [user]="user" [portalOnHover]="false"></fl-user-inline>
    <span class="g-text-small date-info">
      @if (date) {
        <fl-from-now [date]="date"></fl-from-now>
      } @else {
        <span class="g-warn-text">{{ 'coCommunityLib.no_published' | translate }}</span>
      }
    </span>
  </div>
  <div class="like-comment-div">
    @if (executions) {
      <fl-text-icon iconPosition="start" [gap]="'8px'">
        <mat-icon>play_circle</mat-icon>
        <span>{{ executions }}</span>
      </fl-text-icon>
    }

    @if (likes || likes === 0) {
      <fl-text-icon iconPosition="start" [gap]="'8px'">
        <mat-icon svgIcon="heart"></mat-icon>
        <span>{{ likes }}</span>
      </fl-text-icon>
    }

    @if (comments) {
      <fl-text-icon iconPosition="start" [gap]="'8px'">
        <mat-icon svgIcon="comment-accent"></mat-icon>
        <span>{{ comments }}</span>
      </fl-text-icon>
    }
  </div>
</div>
