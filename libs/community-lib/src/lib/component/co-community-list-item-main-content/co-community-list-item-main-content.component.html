<span class="title-space-span">
  <h2>{{title}}</h2>
  @if(showVisibility){
    <co-visibility-badge [space]="space"></co-visibility-badge>
  }
</span>

<p class="small-text description">{{description}}</p>
<ng-content></ng-content>
<div class="lower-info-div">
  <p class="small-text user-info">
    <fl-user-inline [user]="user" [portalOnHover]="false"></fl-user-inline>
    <span class="g-text-small date-info">
      <fl-from-now [date]="date"></fl-from-now>
    </span>
  </p>
  <div class="like-comment-div">
    @if(likes !== null){
      <fl-text-icon iconPosition="start" [gap]="'8px'">
        <mat-icon>thumb_up</mat-icon>
        {{likes}}
      </fl-text-icon>
    }
    @if(comments !== null){
      <fl-text-icon iconPosition="start" [gap]="'8px'">
        <mat-icon>comment</mat-icon>
        {{comments}}
      </fl-text-icon>
    }
  </div>
</div>
