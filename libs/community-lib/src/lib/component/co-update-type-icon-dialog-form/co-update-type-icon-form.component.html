<div class="form-div">
  <div class="change-div">
    <label for="change-icon-button">{{ 'coCommunityLib.change_icon' | translate }} : </label>
    <button
      id="change-icon-button"
      mat-raised-button
      type="button"
      (click)="openCommunityIconSelectMode()"
      [matTooltip]="'coCommunityLib.select_an_icon' | translate">
      <td-type-icon
        [iconSize]="30"
        [iconType]="value.icon_type"
        [iconTechnicalName]="value.icon_technical_name"
        [iconColor]="isDarkTheme ? '#FFFFFF' : '#000000'"></td-type-icon>
    </button>
  </div>
  <div class="change-div">
    <label for="change-bg-color">{{ 'coCommunityLib.change_background_color' | translate }} : </label>
    <fl-color-picker
      id="change-bg-color"
      (ngModelChange)="changeBgColor($event)"
      [ngModel]="value.background_color ?? '' | tdIconBackgroundColor"
      size="40px">
    </fl-color-picker>
  </div>
  @if (value.icon_technical_name && value.background_color) {
    <mat-divider class="g-full"></mat-divider>
    <div class="preview">
      <td-type-icon-badge [iconSize]="80" [style]="value"></td-type-icon-badge>
    </div>
  }
</div>
