<div class="g-flex-grow g-layout-col">
  <div class="g-flex-auto">
    <ng-content select="fl-section-header"> </ng-content>
  </div>

  <div class="g-flex-grow content">
    @if (_isLoading) {
      <div class="g-layout-row g-layout-center-center">
        <fl-loader size="medium"></fl-loader>
      </div>
    } @else {
      @if (objectIsNullOrEmpty) {
        <fl-error-text [errorMessage]="emptyText | translate"></fl-error-text>
      }
    }

    <!--  Render the body  -->
    <ng-template [cdkPortalOutlet]="portal"></ng-template>
  </div>
</div>
