<button
  mat-icon-button
  (click)="toggle()"
  [disabled]="state.disabled()"
  [class.fl-bulk-toggle-active]="state.selectionMode()"
  [matTooltip]="
    ('flBulkSelection.multipleSelection' | flTranslatableText | async) +
    '\n' +
    ('flBulkSelection.ctrlClickHint' | flTranslatableText | async)
  "
  matTooltipClass="g-tooltip-multiline">
  <mat-icon>checklist</mat-icon>
</button>
