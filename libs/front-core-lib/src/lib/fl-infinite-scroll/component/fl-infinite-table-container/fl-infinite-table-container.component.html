<div
  class="container g-scrollable-element"
  (flInfiniteScroll)="loadMoreResults()"
  [flInfiniteDisabled]="datasource.isLoading || datasource.page?.last || false">
  <ng-content></ng-content>
  <fl-infinite-load-more-result
    [datasource]="datasource"
    [textNoResult]="textNoResult"
    [textNoMoreResult]="textNoMoreResult"
    class="load-more-button"></fl-infinite-load-more-result>

  <div class="g-text-centered">
    @if (datasource.firstPageIsLoading) {
      <fl-loader size="medium"></fl-loader>
    }
  </div>
</div>
