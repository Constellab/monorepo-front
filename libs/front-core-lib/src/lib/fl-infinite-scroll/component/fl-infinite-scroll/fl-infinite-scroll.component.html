<div
  (flInfiniteScroll)="getNextPage()"
  [flInfiniteDisabled]="isInfiniteDisabled"
  [flInfiniteMode]="infiniteMode"
  [flInfiniteAfterDebounce]="infiniteAfterDebounce"
  [flInfiniteCheckOnInit]="infiniteCheckOnInit"
  [flInfiniteTriggerDistance]="infiniteTriggerDistance"
  [flReverseMode]="reverseMode"
  [ngClass]="{
    'g-scrollable-element': infiniteMode === 'container',
    'g-layout-col': !reverseMode,
    'g-layout-col-reverse': reverseMode,
  }"
  class="container"
  cdkScrollable>
  <ng-content></ng-content>

  <fl-infinite-load-more-result
    [datasource]="datasource"
    [textNoResult]="textNoResult"
    [textNoMoreResult]="textNoMoreResult"></fl-infinite-load-more-result>

  @if (datasource.firstPageIsLoading) {
    <div class="g-centered-forced loader">
      <fl-loader></fl-loader>
    </div>
  }
</div>
