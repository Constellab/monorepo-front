@if (datasource.page) {
  @if (!datasource.page.last) {
    <div class="g-layout-row g-layout-center">
      <button
        [disabled]="datasource.isLoading"
        class="g-button-small primary"
        mat-stroked-button
        type="button"
        (click)="loadMoreResults()">
        {{ 'flInfiniteScroll.show_more_result' | translate }}
        @if (datasource.nextPageIsLoading) {
          <fl-button-loader size="small"></fl-button-loader>
        }
      </button>
    </div>
  } @else {
    @if (emptyText) {
      <div class="g-text-light g-text-centered g-text-small end-result">
        <p>{{ emptyText | translate }}</p>
      </div>
    }
  }
}
