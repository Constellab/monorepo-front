<div
  class="g-layout-row g-layout-between-center"
  [matTooltip]="text"
  matTooltipShowDelay="1000"
  matTooltipPosition="above"
  [routerLink]="link$ | async"
  [ngClass]="{ link: link$ | async }">
  <div class="text">
    {{ text }}
  </div>

  @if (statusEvent$ | async; as statusEvent) {
    @switch (statusEvent.status) {
      @case ('waiting') {
        <mat-icon class="icon">hourglass_empty</mat-icon>
      }
      @case ('loading') {
        <!--   loader the same size as the icons   -->
        <fl-loader [size]="24" class="icon"></fl-loader>
      }
      @case ('progress') {
        <!--   loader the same size as the icons   -->
        <fl-progress-loader
          [percent]="$any(statusEvent).progressValue"
          size="small"
          class="icon"></fl-progress-loader>
      }
      @case ('success') {
        <mat-icon class="g-success-text icon">check_circle</mat-icon>
      }
      @case ('error') {
        <mat-icon class="g-error-text icon">error</mat-icon>
      }
    }
  }
</div>
