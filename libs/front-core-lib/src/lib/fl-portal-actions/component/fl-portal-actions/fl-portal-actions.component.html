<fl-portal class="portal">
  <fl-portal-content class="content">
    <div class="g-layout-row g-layout-between-center">
      <div>{{ 'flPortalAction.actions' | translate }}</div>

      <div>
        <button
          type="button"
          mat-icon-button
          (click)="toggleReducePortal()"
          [matTooltip]="(portalIsReduced ? 'flPortalAction.expand' : 'flPortalAction.reduce') | translate">
          <mat-icon>{{ portalIsReduced ? 'keyboard_arrow_up' : 'keyboard_arrow_down' }}</mat-icon>
        </button>
        <button
          type="button"
          mat-icon-button
          (click)="closePortal()"
          [matTooltip]="'flPortalAction.close' | translate">
          <mat-icon>close</mat-icon>
        </button>
      </div>
    </div>

    @if (!portalIsReduced) {
      <div class="g-layout-col">
        @for (action of actions$ | async; track action.symbol) {
          <div>
            <fl-portal-action-line [action]="action"></fl-portal-action-line>
            <mat-divider></mat-divider>
          </div>
        }
      </div>
    }
  </fl-portal-content>
</fl-portal>
