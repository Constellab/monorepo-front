<mat-menu [hasBackdrop]="hasBackdrop" [xPosition]="xPosition" [yPosition]="yPosition">
  <ng-template matMenuContent>
    <div [ngClass]="containerClass">
      <ng-container *ngFor="let item of menuItems$ | async">
        <mat-divider *ngIf="item.divider"></mat-divider>

        <!-- Handle branch node menu items -->
        <span *ngIf="item.type === 'button' && item.children?.length > 0; else leaf">
          <button
            mat-menu-item
            [matMenuTriggerFor]="subMenu.menu"
            (click)="callItem(item, $event)"
            [disabled]="item.disabled">
            <mat-icon *ngIf="item.icon" [flIcon]="item.icon"></mat-icon>
            {{ item.text | flTranslatableText | async }}
          </button>
          <fl-menu-dynamic #subMenu [menuItems]="item.children" [hasBackdrop]="false"></fl-menu-dynamic>
        </span>

        <!-- Handle leaf node menu items -->
        <ng-template #leaf>
          <fl-menu-dynamic-button
            [menuDynamic]="item"
            (buttonClick)="onButtonClick($event)"></fl-menu-dynamic-button>
        </ng-template>
      </ng-container>
    </div>
  </ng-template>
</mat-menu>
