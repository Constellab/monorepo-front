
<div class="g-flex-grow g-layout-col">
  <div class="g-flex-auto">
    <ng-content select="fl-section-header">
    </ng-content>
  </div>

  <div class="g-flex-grow content">
    <div *ngIf="_isLoading; else notLoading" class="g-layout-row g-layout-center-center">
      <fl-loader size="medium"></fl-loader>
    </div>

    <ng-template #notLoading>
      <fl-error-text *ngIf="objectIsNullOrEmpty" [errorMessage]="emptyText | translate"></fl-error-text>
    </ng-template>

    <!--  Render the body  -->
    <ng-template [cdkPortalOutlet]="portal"></ng-template>
  </div>

</div>
