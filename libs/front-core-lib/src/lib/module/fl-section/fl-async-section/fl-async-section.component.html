<div *ngIf="inputIsProvided" class="g-flex-grow g-layout-col">
  <div>
    <ng-content select="fl-section-header">
    </ng-content>
  </div>

  <div class="g-flex-grow content">
    <div *ngIf="isLoading; else notLoading" class="g-layout-row g-layout-center-center">
      <fl-loader size="medium"></fl-loader>
    </div>

    <ng-template #notLoading>
      <!--  Render the body  -->
      <ng-container *ngIf="showBody; else showErrorText">
        <ng-container *ngTemplateOutlet="lazyContent; context: viewContext"></ng-container>
      </ng-container>

      <ng-template #showErrorText>
        <fl-error-text [errorMessage]="infoText"></fl-error-text>
      </ng-template>
    </ng-template>

  </div>

</div>
