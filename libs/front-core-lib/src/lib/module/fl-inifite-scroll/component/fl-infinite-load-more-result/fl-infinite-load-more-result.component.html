<ng-container *ngIf="datasource.page">
  <div *ngIf="!datasource.page.last; else lastPage" class="g-layout-row g-layout-center">
    <button
      [disabled]="datasource.isLoading"
      class="g-button-small primary"
      mat-stroked-button
      type="button"
      (click)="loadMoreResults()">
      {{ 'show_more_result' | translate }}
      <fl-button-loader *ngIf="datasource.nextPageIsLoading" size="small"></fl-button-loader>
    </button>
  </div>

  <ng-template #lastPage>
    <div *ngIf="emptyText" class="g-text-light g-text-centered g-text-small end-result">
      <p>{{ emptyText | translate }}</p>
    </div>
  </ng-template>
</ng-container>
