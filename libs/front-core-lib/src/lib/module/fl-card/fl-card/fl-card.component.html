<div class="card g-layout-col">
  <div class="g-flex-auto">
    <ng-content select="fl-card-header"> </ng-content>
  </div>

  <div class="g-flex-grow g-layout-row content g-scrollable-element" cdkScrollable>
    <!--  Inject card image if it exist  -->
    <ng-content select="fl-card-image"></ng-content>

    <div class="g-flex-grow g-full-height">
      <ng-content select="fl-card-body"></ng-content>
    </div>
  </div>

  <ng-content select="fl-card-footer"></ng-content>
</div>
