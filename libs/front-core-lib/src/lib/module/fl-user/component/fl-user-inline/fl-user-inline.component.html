<div
  class="g-layout-row g-layout-start-center"
  [flUserMouseHoverPortal]="user"
  [flMouseEnterDelay]="750"
  [flDisabled]="!portalOnHover">
  <fl-user-profile-picture [user]="user" [size]="profilePictureSize"></fl-user-profile-picture>

  @if (showName) {
    <div class="user-name g-text-dense-height" [ngClass]="getTextSizeClass()">
      {{ user?.alias ? user.alias : user?.firstname + ' ' + user?.lastname }}
    </div>
  }
</div>
