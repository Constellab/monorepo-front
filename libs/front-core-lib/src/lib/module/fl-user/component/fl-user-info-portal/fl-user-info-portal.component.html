<fl-portal class="user-info-portal">

  <fl-portal-content>


    <div class="top-section g-primary-background g-layout-row g-layout-start-center">
      <!--  Absolute image   -->
      <fl-user-profile-picture [size]="5" [user]="user" class="profil-picture"></fl-user-profile-picture>

      <div class="user-name g-text-big g-text-dense-height">
        <div class="user-name">{{ user.firstname }}</div>
        <div class="user-name">{{ user.lastname }}</div>
      </div>
    </div>

    <div class="bottom-section">
      <fl-text-icon class="text-info">
        <mat-icon class="g-icon-small">mail</mat-icon>
        <div class="g-text-small email">{{ user.email }}</div>
      </fl-text-icon>

      @if (user.company) {
        <fl-text-icon class="text-info">
          <mat-icon class="g-icon-small">space</mat-icon>
          <div class="g-text-small">{{ user.company }}</div>
        </fl-text-icon>
      }

      @if (user.activity) {
        <fl-text-icon class="text-info">
          <mat-icon class="g-icon-small">badge</mat-icon>
          <div class="g-text-small">{{ user.activity }}</div>
        </fl-text-icon>
      }

    @if (userRoute) {
      <div class="profile-button">
        <a [routerLink]="userRoute" mat-stroked-button
           type="button" class="g-button-small">
          <mat-icon>person</mat-icon>
          {{ 'flUser.view_profile' | translate }}
        </a>
      </div>
    }
    </div>


  </fl-portal-content>

</fl-portal>
