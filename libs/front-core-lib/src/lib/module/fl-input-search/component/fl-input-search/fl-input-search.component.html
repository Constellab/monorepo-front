<mat-form-field class="g-full" subscriptSizing="dynamic">
  <div matPrefix *ngIf="prefixTemplate">
    <ng-container *ngTemplateOutlet="prefixTemplate; context: getPrefixTemplateContext()"></ng-container>
  </div>
  <mat-label>{{placeholder}}</mat-label>
  <input type="text"
         [placeholder]="placeholder"
         matInput
         [formControl]="inputControl"
         [matAutocomplete]="auto"
         #input
         [required]="required"
         (focus)="onFocus()" (blur)="onBlur()">
  <mat-autocomplete autoActiveFirstOption #auto="matAutocomplete" (optionSelected)="itemSelected()">
    <fl-infinite-scroll [datasource]="datasource" class="g-mat-option-infinite-scroll">
      <mat-option *ngFor="let item of items$ | async" [value]="item">
        <ng-container *ngTemplateOutlet="optionTemplate; context: getOptionTemplateContext(item)"></ng-container>
      </mat-option>
    </fl-infinite-scroll>
  </mat-autocomplete>

  <!-- loader suffix -->
  <fl-loader matSuffix *ngIf="datasource.isLoading || initIsLoading; else noLoader" [size]="20"
             class="loader"></fl-loader>

  <ng-template #noLoader>
    <button mat-icon-button type="button" matSuffix *ngIf="advancedButton"
            (click)="callAdvancedButton($event)">
      <mat-icon>loupe</mat-icon>
    </button>
  </ng-template>
</mat-form-field>
