<div class="nav-bar g-layout-row-wrap g-layout-start-center">
  <div class="title-container g-layout-row-wrap g-layout-start-center"
       [ngClass]="{'title-container-small': (showSmallMenu$ | async)}"
       (click)="openMenu()">
    <ng-content></ng-content>

    <mat-icon *ngIf="showSmallMenu$ | async"
              [matMenuTriggerFor]="menu"
    class="expand-icon">expand_more
    </mat-icon>
  </div>

  <ng-container  *ngIf="(showSmallMenu$ | async) === false">
    <a mat-button *ngFor="let item of items"
       class="nav-item"
       [routerLink]="item.route" routerLinkActive="menu-active"
       [routerLinkActiveOptions]="{exact: true}">
      <mat-icon [flIcon]="item.icon">dashboard</mat-icon>
      <span class="item-text">{{item.label | flTranslatableText}}</span>
    </a>
  </ng-container>

  <!-- Small menu -->
  <mat-menu #menu="matMenu" xPosition="before">

    <a mat-menu-item *ngFor="let item of items"
       [routerLink]="item.route" routerLinkActive="small-menu-active"
       [routerLinkActiveOptions]="{exact: true}">
      <mat-icon [flIcon]="item.icon" class="menu-icon">dashboard</mat-icon>
      <span class="menu-icon">{{item.label | flTranslatableText}}</span>
    </a>
  </mat-menu>

</div>
