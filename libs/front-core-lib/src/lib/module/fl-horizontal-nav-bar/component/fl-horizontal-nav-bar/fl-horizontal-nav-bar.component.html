<div class="nav-bar g-layout-row-wrap g-layout-start-center">
  <div class="nav-container g-layout-row-wrap g-layout-start-center">
    <!-- Large Title -->
    <div
      class="title-container g-layout-row-wrap g-layout-start-center"
      *ngIf="(showSmallMenu$ | async) === false; else small">
      <ng-content select="fl-horizontal-nav-bar-title"></ng-content>
    </div>

    <!--  Small title  -->
    <ng-template #small>
      <div
        class="title-container title-container-small g-layout-row-wrap g-layout-start-center"
        (click)="openMenu()">
        <fl-text-icon *ngIf="activeItem$ | async as activeItem">
          <mat-icon class="g-icon-big" [flIcon]="activeItem.icon">admin_panel_settings</mat-icon>
          <h1>{{ activeItem.label | flTranslatableText | async }}</h1>
        </fl-text-icon>

        <mat-icon [matMenuTriggerFor]="menu" class="expand-icon">expand_more </mat-icon>
      </div>

      <!-- Small menu -->
      <mat-menu #menu="matMenu" xPosition="before">
        <a
          mat-menu-item
          *ngFor="let item of items"
          [routerLink]="item.route"
          routerLinkActive="primary"
          [routerLinkActiveOptions]="{ exact: item.linkActiveExact }">
          <mat-icon [flIcon]="item.icon" class="menu-icon"></mat-icon>
          <span class="menu-icon">{{ item.label | flTranslatableText | async }}</span>
        </a>
      </mat-menu>
    </ng-template>

    <!-- Large menu -->
    <div *ngIf="(showSmallMenu$ | async) === false">
      <a
        mat-button
        *ngFor="let item of items"
        class="nav-item"
        [routerLink]="item.route"
        routerLinkActive="primary"
        [routerLinkActiveOptions]="{ exact: item.linkActiveExact }">
        <mat-icon [flIcon]="item.icon"></mat-icon>
        <span class="item-text">{{ item.label | flTranslatableText | async }}</span>
      </a>
    </div>
  </div>

  <ng-content select="fl-horizontal-nav-bar-actions"></ng-content>
</div>
