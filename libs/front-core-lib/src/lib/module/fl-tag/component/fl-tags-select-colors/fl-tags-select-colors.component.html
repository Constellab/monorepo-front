@if (tagGroups?.length > 0) {
  <div class="g-layout-col container">
    @for (tagGroup of tagGroups; track trackByGroupKey($index, tagGroup)) {
      <div class="group">
        <div class="g-full g-layout-row g-layout-between-center g-layout-gap-05em">
          <div>{{ tagGroup.key }}</div>
          <button
            type="button"
            mat-icon-button
            class="g-button-icon-small"
            [ngClass]="groupColor(tagGroup)"
            (click)="toggleGroupColor(tagGroup)">
            <mat-icon>colorize</mat-icon>
          </button>
        </div>
        <div class="g-text-small value-list g-styled-scrollbar">
          @for (tagValue of tagGroup.tags; track trackByTag($index, tagValue)) {
            <fl-chip
              size="small"
              class="tag g-layout-row g-layout-between-center g-layout-gap-05em"
              (click)="toggleTagColor(tagValue)"
              [matTooltip]="tagValue.value | flTagValueToString"
              matTooltipPosition="below"
              [matTooltipShowDelay]="1000">
              <div class="tag-value">{{ tagValue.value }}</div>
              @if (tagValue.activeColor) {
                <div
                  [style.background-color]="tagValue.color"
                  class="color"
                  (click)="openColorSelector(tagValue, $event)"
                  [(flColorSelector)]="tagValue.color"
                (flColorSelectorChange)="emitColors()"></div>
              } @else {
                <div class="color"></div>
              }
            </fl-chip>
          }
        </div>
      </div>
    }
  </div>
} @else {
  <fl-error-text [errorMessage]="'flTag.no_tags' | translate"></fl-error-text>
}
