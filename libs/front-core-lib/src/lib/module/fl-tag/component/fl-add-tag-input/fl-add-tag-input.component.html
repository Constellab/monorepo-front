<mat-form-field class="g-full">
  <mat-label>{{label | translate}}</mat-label>

  <mat-chip-grid #chipGrid>

    <mat-chip-row *ngIf="currentTagKey" (removed)="removeTempTag()">
      <div matChipAvatar class="color"
           [style.background-color]="currentTagKey.key | flTagColor | async">
      </div>
      {{currentTagKey.key}} :
    </mat-chip-row>
    <input
      [placeholder]="'flTag.search_tag' | translate"
      #input
      [formControl]="inputCtrl"
      [matAutocomplete]="auto"
      [matChipInputFor]="chipGrid"
      [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
      (matChipInputTokenEnd)="addUnknownValue()" tabindex="0"
      (keydown.enter)="onEnterDown($event)">
  </mat-chip-grid>
  <mat-autocomplete #auto="matAutocomplete"
                    (optionSelected)="optionSelected($event)" [autoActiveFirstOption]="true">
    <fl-infinite-scroll [datasource]="filteredOptions" class="g-mat-option-infinite-scroll">
      <mat-option *ngFor="let item of filteredOptions | flDatasourceConnect | async" [value]="item">
        <div class="g-layout-row g-layout-start-center g-layout-gap-05em">
          <div *ngIf="(mode$ | async) === 'key'" class="color color-option"
               [style.background-color]="item.key | flTagColor | async">
          </div>
          <span>{{item}}</span>
        </div>
      </mat-option>
    </fl-infinite-scroll>

  </mat-autocomplete>

  <mat-hint *ngIf="allowUnknownTag">{{'flTag.input_helper_text' | translate}}</mat-hint>
</mat-form-field>
