<mat-form-field class="g-full">
  <mat-label>{{ label | translate }}</mat-label>

  <mat-chip-grid #chipGrid>
    <mat-chip-row *ngFor="let tag of value" (removed)="remove(tag)">
      {{ tag.key }} : {{ tag.value }}
      <button matChipRemove>
        <mat-icon>cancel</mat-icon>
      </button>
    </mat-chip-row>
    <mat-chip-row *ngIf="newTag" (removed)="removeTempTag()"> {{ newTag }} : </mat-chip-row>
    <input
      [placeholder]="label | translate"
      #input
      [formControl]="inputCtrl"
      [matChipInputFor]="chipGrid"
      [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
      (matChipInputTokenEnd)="addUnknownValue()"
      tabindex="0"
      [flInputMaxLength]="maxLength"
      (keydown.enter)="onEnterDown($event)" />
  </mat-chip-grid>

  <mat-hint>{{ 'flTag.basic_input_helper_text' | translate }}</mat-hint>
</mat-form-field>
