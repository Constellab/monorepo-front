<div>
  <div class="content-container" #content>
    <ng-content></ng-content>

    @if (heightIsLimited && !_expand) {
      <div class="g-fade-in"></div>
    }
  </div>
  @if (heightIsLimited) {
    @if (!_expand) {
      <p class="g-text-small g-text-light g-text-link" (click)="expand = true">
        {{ 'flCoreComponent.see_more' | translate }}
      </p>
    }
    @if (_expand) {
      <p class="g-text-small g-text-light g-text-link" (click)="expand = false">
        {{ 'flCoreComponent.hide' | translate }}
      </p>
    }
  }
</div>
