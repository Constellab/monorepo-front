<div class="dialog-title" mat-dialog-title>
  <!-- Use to center the title -->
  <div class="fake-icon" *ngIf="!hideCloseButton">
  </div>
  <div class="g-centered-forced title-text">
    <ng-content></ng-content>
  </div>
  <div class="g-layout-row g-layout-start-center">
    <ng-content select="fl-dialog-header-actions"></ng-content>
    <button mat-icon-button type="button" [matTooltip]="'close' | translate"
            [mat-dialog-close]="null" tabindex="-1" *ngIf="!hideCloseButton">
      <mat-icon>close</mat-icon>
    </button>
  </div>
</div>
