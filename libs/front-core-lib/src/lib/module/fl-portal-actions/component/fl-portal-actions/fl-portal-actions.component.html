<fl-portal class="portal">
  <fl-portal-content class="content">
    <div class="g-layout-row g-layout-between-center">
      <div>{{ 'flPortalAction.actions' | translate }}</div>
      <button flPortalClose type="button" mat-icon-button [matTooltip]="'flPortalAction.close' | translate">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <div class="g-layout-col">
      @for (loader of actions$ | async; track trackBySymbole($index, loader)) {
        <div>
          <fl-portal-action-line [action]="loader"></fl-portal-action-line>
          <mat-divider></mat-divider>
        </div>
      }
    </div>
  </fl-portal-content>
</fl-portal>
