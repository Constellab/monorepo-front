<fl-portal class="portal">
  <fl-portal-content class="content">
    <div class="g-layout-row g-layout-between-center">
      <div>{{ 'flPortalAction.actions' | translate }}</div>
      <button flPortalClose type="button" mat-icon-button [matTooltip]="'close' | translate">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <div class="g-layout-col">
      <div *ngFor="let loader of actions$ | async; trackBy: trackBySymbole">
        <fl-portal-action-line [action]="loader"></fl-portal-action-line>

        <mat-divider></mat-divider>
      </div>
    </div>
  </fl-portal-content>
</fl-portal>
