@if (label){
  <div>
    <label>{{label}}</label>
  </div>
}
<div class="form-fields">
  <mat-form-field subscriptSizing="dynamic">
    <mat-label>{{ 'flDate.day' | translate }}</mat-label>
    <input matInput autocomplete="disabled" [min]="minDateDay"
           [matDatepicker]="createdAtFrom" [placeholder]="'flDate.date_picker_placeholder' | translate"
           [max]="maxDate" (dateChange)="onDatePickerChange($event)" [ngModel]="selectedDate">
    <mat-datepicker-toggle matSuffix [for]="createdAtFrom"></mat-datepicker-toggle>
    <mat-datepicker #createdAtFrom></mat-datepicker>
  </mat-form-field>

  <mat-form-field subscriptSizing="dynamic" >
    <mat-label>{{ 'flDate.hour' | translate }}</mat-label>
    <mat-select [ngModel]="selectedHours" (valueChange)="onHoursChange($event)">
      <mat-option [value]="null">
        {{ 'flDate.hour' | translate }}
      </mat-option>
      <mat-option *ngFor="let h of hours" [value]="h">
        {{ h }}
      </mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field subscriptSizing="dynamic" >
    <mat-label>{{ 'flDate.minute' | translate }}</mat-label>
    <mat-select [ngModel]="selectedMinutes" (valueChange)="onMinutesChange($event)">
      <mat-option [value]="null">
        {{ 'flDate.minute' | translate }}
      </mat-option>
      <mat-option *ngFor="let m of minutes" [value]="m">
        {{ m }}
      </mat-option>
    </mat-select>
  </mat-form-field>
</div>
