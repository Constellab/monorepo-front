<div class="page g-layout-row g-layout-center-center">
  <fl-card class="card" flClass.xs="card-xs">
    <fl-card-body>
      <img [src]="logo" alt="Gencovery logo" class="logo" />

      <form (ngSubmit)="submit()" [formGroup]="formGp">
        <fl-signup-form [formGp]="formGp"></fl-signup-form>

        <button mat-flat-button type="submit" class="centered g-button-big accent">
          {{ 'flAuth.signup' | translate }}
          @if (isLoading) {
            <fl-button-loader></fl-button-loader>
          }
        </button>
      </form>

      <ng-content></ng-content>
    </fl-card-body>
  </fl-card>
</div>
