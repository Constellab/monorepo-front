<form [formGroup]="formGp" (ngSubmit)="submit()">
  <fl-form-inputs-manager
    [config]="formInputConfig"
    [skipFalseBoolean]="skipFalseBoolean"></fl-form-inputs-manager>

  <div class="form g-layout-col">
    <ng-content></ng-content>
  </div>

  <button mat-flat-button type="submit" [disabled]="formGp.invalid" class="g-centered-forced primary">
    {{ 'flSearch.search' | translate }}
  </button>
</form>
