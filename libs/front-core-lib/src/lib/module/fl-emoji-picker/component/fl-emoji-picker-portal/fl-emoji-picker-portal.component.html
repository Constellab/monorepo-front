<fl-portal>
  <fl-portal-content>


    <fl-infinite-scroll [datasource]="emojiCategories" class="container"
                        (click)="onParentClick($event)">

      <!--         Use track by index, the track by emoji.id break on search-->
      @for (emojiCategory of emojiCategories | flDatasourceConnect | async; track catIndex; let catIndex = $index) {
        <div class="category">
          @if (emojiCategory.name) {
            <div>{{ ('flEmoji.category_' + emojiCategory.name) | translate }}</div>
          }

          <div class="g-layout-row-wrap">
            @for (emoji of emojiCategory.emojis; track emoji.htmlId) {
              <span class="emoji" [id]="emoji.htmlId">{{ emoji.emoji }}</span>
            }
          </div>
        </div>
      }
    </fl-infinite-scroll>

  </fl-portal-content>
</fl-portal>
