<div class="input-container">
  <ng-content select="input"></ng-content>

  <!-- Label and clear button -->
  <label class="input-file-trigger" tabindex="0">
    <button
      mat-icon-button
      type="button"
      [ngClass]="classes"
      (click)="openFileExplorer()"
      [disabled]="disabled">
      <mat-icon class="g-text-not-selectable" [flIcon]="icon"></mat-icon>
    </button>
  </label>
</div>
