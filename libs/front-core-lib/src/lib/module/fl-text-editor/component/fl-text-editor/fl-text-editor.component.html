<div class="editor g-styled-scrollbar"
     [ngClass]="{'override-buttons': theme === 'OVERRIDE_BUTTON'}" #editor
     (flOutsideClick)="outsideClick($event)">
</div>

<ng-container *ngIf="isReady">
  <div *ngIf="theme !== 'OVERRIDE_BUTTON'" class="snow-menu-div mat-elevation-z0">
    <fl-text-editor-snow-button></fl-text-editor-snow-button>
  </div>

  <fl-text-editor-drag-buttons *ngIf="leftButtons"></fl-text-editor-drag-buttons>
</ng-container>
