<!--  Server info  -->
<mat-form-field class="g-full" subscriptSizing="dynamic">
  <mat-label>{{ placeholder }}</mat-label>
  <mat-select [placeholder]="placeholder" [formControl]="formCtrl" [required]="required">
    @for (option of selectOptions(); track option.key) {
      <mat-option [value]="option.key">{{ option.humanName }}</mat-option>
    }
  </mat-select>

  <span *ngIf="prefix" matPrefix>{{ prefix }}</span>
  <span *ngIf="suffix" matSuffix>{{ suffix }}</span>
  <mat-hint *ngIf="hint">{{ hint }}</mat-hint>

  <mat-error *ngIf="formCtrl.hasError('required')">
    {{ placeholder | flErrorRequired: false }}
  </mat-error>
</mat-form-field>
