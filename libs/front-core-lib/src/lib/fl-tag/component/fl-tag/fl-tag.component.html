<fl-chip
  class="chip g-layout-row g-layout-start-center g-layout-gap-05em"
  [matTooltip]="flTag.value ? flTag.key + ' : ' + flTag.value : flTag.key"
  [matTooltipShowDelay]="2000" matTooltipClass="g-text-capitalize">
  <div class="color" [style.background-color]="flTag | flTagColor: tagColorer | async"></div>

  <div class="text">
    @if (flTag.label) {
      {{flTag.label}}
    } @else {
      {{ flTag.key }}
    }
    @if (flTag.value) {
      : {{ flTag.value }}
    }
  </div>

  @if (showDeleteIcon) {
    <button mat-icon-button class="g-button-icon-tiny" (click)="onDeleteTag($event)" type="button">
      <mat-icon>cancel</mat-icon>
    </button>
  }
</fl-chip>
