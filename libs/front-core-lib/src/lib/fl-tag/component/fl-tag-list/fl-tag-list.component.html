<div>
  @if (tags | flTagsToList: limitNumber | async; as tagList) {
    @for (tag of tagList; track tag) {
      <fl-tag
        [flTag]="tag"
        [tagColorer]="tagColorer"
        [showDeleteIcon]="showDeleteIcon"
        (deleteTag)="deleteTag($event)"
        (click)="selectTag(tag, $event)"
        (auxclick)="onAuxClick(tag, $event)"></fl-tag>
    }
    @if (showNoTagMessage && tagList.length === 0) {
      <div class="g-text-small g-text-light">
        {{ 'flTag.no_tag' | translate }}
      </div>
    }
  }
</div>
