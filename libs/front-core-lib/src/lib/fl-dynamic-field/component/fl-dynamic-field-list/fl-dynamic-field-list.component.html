<fl-form-field>
  <fl-multi-inputs
    [formControl]="formCtrl"
    [required]="required"
    [placeholder]="placeholder"
    [hint]="hint"
    [prefix]="prefix"
    [suffix]="suffix"></fl-multi-inputs>
  @if (formCtrl.hasError('required')) {
    <mat-error>{{ placeholder | flErrorRequired: false }}</mat-error>
  }
</fl-form-field>
