<div [matTooltip]="tooltipError" [matTooltipDisabled]="!cellRendering() || !formCtrl().invalid">
  <fl-input-search
    [selectedItem]="formCtrl().value"
    (selectedItemChange)="selectOption($event)"
    [datasource]="datasource"
    [placeholder]="visibleLabel"
    [required]="required()"
    [disabled]="disabled()"
    [minInputSearchLength]="0">
    <div *flInputSearchOption="datasource as option">
      {{ option }}
    </div>
  </fl-input-search>
</div>

@if (hint() && !cellRendering()) {
  <p class="g-text-light g-text-small">{{ hint() }}</p>
}
