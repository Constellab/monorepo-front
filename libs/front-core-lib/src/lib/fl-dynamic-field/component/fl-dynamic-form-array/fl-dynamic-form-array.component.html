<!--<div class="section-border">-->
@if (config() && control()) {
  <fl-section [disableEmptyText]="true" class="section">
    <fl-section-header>
      <div>{{ config().placeholder }}</div>
      @if (config().hint) {
        <div class="g-text-small g-text-light">{{ config().hint }}</div>
      }
      <fl-section-actions>
        <div [matTooltip]="addTooltip">
          <button
            mat-stroked-button
            type="button"
            (click)="addGroup()"
            [disabled]="disableAdd"
            class="g-button-small">
            <mat-icon>add</mat-icon>
            {{ 'flDynamicField.add_value_in_array' | translate }}
          </button>
        </div>
      </fl-section-actions>
    </fl-section-header>

    <ng-container *flSectionBody>
      @if (hasValue()) {
        <div>
          @for (formGp of control().controls; track formGp; let i = $index; let last = $last) {
            <div class="group">
              <div class="g-layout-row">
                <fl-dynamic-abstract-form
                  [control]="formGp"
                  [config]="config().formGpConfig"
                  class="g-flex-auto">
                </fl-dynamic-abstract-form>
                <div>
                  <div [matTooltip]="removeTooltip">
                    <button mat-icon-button type="button" (click)="removeGroup(i)" [disabled]="disableRemove">
                      <mat-icon>clear</mat-icon>
                    </button>
                  </div>
                </div>
              </div>
              <!--        <mat-divider *ngIf="!last"></mat-divider>-->
            </div>
          }
        </div>
      } @else {
        <div class="g-text-centered">
          <p class="g-text-light">{{ 'flDynamicField.no_value_in_array' | translate }}</p>
          <button mat-stroked-button type="button" (click)="addGroup()" class="g-button-small">
            <mat-icon>add</mat-icon>
            {{ 'flDynamicField.add_value_in_array' | translate }}
          </button>
        </div>
      }
    </ng-container>
  </fl-section>
}
