<mat-form-field class="g-full" subscriptSizing="dynamic">
  @if (placeholder) {
    <mat-label>{{ placeholder }}</mat-label>
  }

  <textarea
    matInput
    [(ngModel)]="value"
    [disabled]="disabled"
    [required]="required"
    [ngModelOptions]="{ standalone: true }"
    [rows]="rows"
  (ngModelChange)="onValueChange()"></textarea>

  @if (!error) {
    <mat-hint>
      @if (hint) {
        <span>{{ hint }} <br /></span>
      }
      <span>{{ 'flDynamicField.multi_input_help' | translate }}</span>
    </mat-hint>
  }
  @if (prefix) {
    <span matPrefix>{{ prefix }}</span>
  }
  @if (suffix) {
    <span matSuffix>{{ suffix }}</span>
  }
</mat-form-field>
