<fl-dialog-header>
  {{ title | flTranslatableText | async }}

  <fl-dialog-header-actions>
    <button
      mat-icon-button
      type="button"
      (click)="copyToClipboard()"
      [matTooltip]="'flJsonEditor.copy_json_to_clipboard' | translate">
      <mat-icon>copy</mat-icon>
    </button>
  </fl-dialog-header-actions>
</fl-dialog-header>

<mat-dialog-content>
  <fl-pretty-json [object]="object"></fl-pretty-json>
</mat-dialog-content>
