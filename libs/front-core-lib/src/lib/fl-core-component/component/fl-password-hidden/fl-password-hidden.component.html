<div class="g-layout-row g-layout-between-center">
  <div>
    <span>{{ label() }} :</span>
    <span
      class="g-text-link password"
      (click)="copyToClipboard()"
      [matTooltip]="'flCoreComponent.copy_to_clipboard' | translate">
      @if (showPassword) {
        {{ password() }}
      } @else {
        ********
      }
    </span>
  </div>
  <button
    mat-icon-button
    type="button"
    class="g-button-icon-small"
    (click)="toggleShowPassword()"
    [matTooltip]="(showPassword ? 'flCoreComponent.hide' : 'flCoreComponent.show') | translate">
    <mat-icon>{{ showPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
  </button>
</div>
