<mat-drawer-container class="g-full-height drawer-container">
  <!-- Advanced section in the right in a drawer -->
  <mat-drawer
    mode="side"
    position="end"
    [opened]="false"
    class="drawer g-styled-scrollbar"
    [flDrawerOver]="drawerOverBreakPoints">
    <ng-content select="fl-search-advanced-form"></ng-content>
  </mat-drawer>

  <mat-drawer-content class="content g-layout-col">
    <ng-content select="fl-search-header"></ng-content>

    <!--   Number of results   -->
    <p class="result-count g-text-light">
      @if (datasource.page?.totalElements > 0) {
        @if (!datasource.page.totalIsApproximate) {
          {{ 'flSearch.count_result' | translate: { count: datasource.page.totalElements } }}
        }
      }
    </p>

    <fl-infinite-table-container [datasource]="datasource" class="g-flex-grow table-container">
      <ng-content select="fl-search-result"></ng-content>
    </fl-infinite-table-container>
  </mat-drawer-content>
</mat-drawer-container>
