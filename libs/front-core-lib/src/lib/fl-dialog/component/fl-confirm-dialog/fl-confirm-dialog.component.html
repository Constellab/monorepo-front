<fl-dialog-header [hideCloseButton]="true">
  <div [innerHTML]="inputData.title | flTranslatableText | async"></div>
</fl-dialog-header>

<div mat-dialog-content>
  <div [innerHTML]="inputData.content | flTranslatableText | async" class="content g-text-with-jump"></div>

  @if (confirmTextFormControl) {
    <p class="confirm-text">
      {{ 'flDialog.confirm_with_text' | translate }} :
      <code class="code">{{ inputData.confirmWithText }}</code>
    </p>
    <mat-form-field class="form-field">
      <mat-label>{{ 'flDialog.confirm_text' | translate }}</mat-label>
      <input
        matInput
        [placeholder]="inputData.confirmWithText"
        [formControl]="confirmTextFormControl"
        required />
      @if (confirmTextFormControl.invalid) {
        <mat-error>{{ 'flDialog.invalid_confirm_text' | translate }}</mat-error>
      }
    </mat-form-field>
  }
</div>

<div mat-dialog-actions>
  <button
    mat-stroked-button
    (click)="closeDialog(true)"
    type="button"
    [disabled]="isLoading"
    tabindex="-1"
    class="yes-button primary">
    {{ 'flDialog.yes' | translate }}
    @if (isLoading) {
      <fl-button-loader></fl-button-loader>
    }
  </button>
  <button
    mat-stroked-button
    type="button"
    (click)="closeDialog(false)"
    [disabled]="isLoading"
    tabindex="-1"
    class="warn">
    {{ 'flDialog.no' | translate }}
  </button>
</div>
