<fl-dialog-header>
  {{ 'flAuth.password_forgotten' | translate }}
</fl-dialog-header>

<mat-dialog-content>
  <form (ngSubmit)="submit()" id="project-form">
    <p class="g-text-light help-text">{{ 'flAuth.password_forgotten_help' | translate }}</p>

    <!--  Email  -->
    <mat-form-field appearance="outline" class="g-form-input">
      <mat-label>{{ 'flAuth.email' | translate }}</mat-label>
      <input
        matInput
        type="email"
        [formControl]="formControl"
        required
        [placeholder]="'flAuth.email' | translate" />
      @if (formControl.hasError('required')) {
        <mat-error>
          {{ 'flAuth.email' | flErrorRequired }}
        </mat-error>
      }
      @if (formControl.hasError('email')) {
        <mat-error>
          {{ 'flAuth.email_invalid' | translate }}
        </mat-error>
      }
    </mat-form-field>
  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-flat-button type="submit" form="project-form" class="g-centered-forced primary">
    {{ 'flAuth.password_forgotten' | translate }}
    @if (isLoading) {
      <fl-button-loader></fl-button-loader>
    }
  </button>
</div>
