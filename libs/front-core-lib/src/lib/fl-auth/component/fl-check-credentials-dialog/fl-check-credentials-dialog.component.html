<fl-dialog-header>
  {{ 'flAuth.please_enter_you_credentials' | translate }}
</fl-dialog-header>

<mat-dialog-content>
  <form (ngSubmit)="onSubmit()" id="check-credentials-form" [formGroup]="formGp">
    <fl-login-form [formGp]="formGp"></fl-login-form>
  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-flat-button type="submit" form="check-credentials-form" class="g-centered-forced primary">
    {{ 'flAuth.validate' | translate }}
    @if (isLoading) {
      <fl-button-loader></fl-button-loader>
    }
  </button>
</div>
