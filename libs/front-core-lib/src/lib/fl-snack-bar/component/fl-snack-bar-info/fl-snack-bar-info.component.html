<div class="g-layout-row g-layout-between-center g-full-height">
  <div>
    <!--  The text color depend on the background  -->
    <div
      [ngClass]="{ 'g-primary-contrast': mode === 'success', 'g-warn-contrast': mode === 'error' }"
      class="message g-text-dense-height"
      [innerHTML]="text | flTranslatableText | async"></div>
  </div>

  @if (showCloseButton) {
    <button
      class="button"
      [ngClass]="{ 'button-success': mode === 'success', 'button-warn': mode === 'error' }"
      mat-button
      type="button"
      (click)="closeSnackBar()">
      {{ 'flSnackBar.ok' | translate }}
    </button>
  }
</div>
