<div class="g-layout-row g-layout-between-center g-full-height">
  <div class="message-container">
    <!-- Text color comes from the snackbar container (on-*-container token) -->
    <div class="message g-text-dense-height" [innerHTML]="text | flTranslatableText | async"></div>
  </div>

  <div class="g-layout-row g-layout-end-center actions">
    @if (action) {
      <button
        class="button"
        [ngClass]="{ primary: mode === 'success', warn: mode === 'error' }"
        mat-flat-button
        type="button"
        (click)="onActionClick()">
        {{ action.label | flTranslatableText | async }}
      </button>
    }

    @if (showCloseButton) {
      <button
        class="button"
        [ngClass]="{ primary: mode === 'success', warn: mode === 'error' }"
        mat-flat-button
        type="button"
        (click)="closeSnackBar()">
        {{ 'flSnackBar.ok' | translate }}
      </button>
    }
  </div>
</div>
