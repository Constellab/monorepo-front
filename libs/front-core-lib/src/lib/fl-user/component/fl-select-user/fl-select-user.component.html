<fl-input-search
  [selectedItem]="selectedUser"
  (selectedItemChange)="setAndEmitValue($event)"
  [datasource]="usersDatasource"
  [placeholder]="placeholder"
  [required]="required"
  [disabled]="disabled"
  (focused)="onFocused($event)">
  <div class="photo" *flInputSearchPrefix="usersDatasource as currentUser">
    @if (currentUser) {
      <fl-user-profile-picture
        [user]="currentUser"
      size="small"></fl-user-profile-picture>
    } @else {
      <mat-icon>account_circle</mat-icon>
    }
  </div>

  <fl-user-inline
    *flInputSearchOption="usersDatasource as user"
    [user]="user"
  [portalOnHover]="false"></fl-user-inline>
</fl-input-search>
