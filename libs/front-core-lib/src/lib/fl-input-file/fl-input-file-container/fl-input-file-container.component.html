<div class="input-container" flDragHover="input-container-drop-hover" (flDrop)="onDropFile($event)">
  <ng-content select="input"></ng-content>

  <!-- Trigger and clear button -->
  <div class="input-file-trigger" tabindex="0">
    <div class="g-layout-row g-layout-start-center">
      @if (icon) {
        <mat-icon [flIcon]="icon" class="icon"></mat-icon>
      }

      <div class="placeholder">
        {{ text() }}
      </div>
      <div>
        @if (hasValue()) {
          <button
            mat-icon-button
            (click)="clearInput()"
            type="button"
            [matTooltip]="'flFileInput.clear_input' | translate">
            <mat-icon>clear</mat-icon>
          </button>
        }
      </div>
    </div>
  </div>
</div>
