@if (menuDynamic().type === 'link') {
  <!--    Link    -->
  <a mat-menu-item [routerLink]="link().link">
    @if (link().icon) {
      <mat-icon [flIcon]="link().icon" [ngClass]="button().color"></mat-icon>
    }
    <div [ngClass]="textColor()">{{ link().text | flTranslatableText | async }}</div>
  </a>
} @else if (menuDynamic().type === 'downloadLink') {
  <!--    Link    -->
  <a mat-menu-item [href]="downloadLink().href" download>
    @if (downloadLink().icon) {
      <mat-icon [flIcon]="downloadLink().icon" [ngClass]="downloadLink().color"></mat-icon>
    }
    <div [ngClass]="textColor()">{{ downloadLink().text | flTranslatableText | async }}</div>
  </a>
} @else {
  <!--    Button    -->
  <button mat-menu-item (click)="callItem(button(), $event)" [disabled]="button().disabled">
    @if (button().icon) {
      <mat-icon [flIcon]="button().icon" [ngClass]="button().color"></mat-icon>
    }
    <div [ngClass]="textColor()">{{ button().text | flTranslatableText | async }}</div>
  </button>
}
