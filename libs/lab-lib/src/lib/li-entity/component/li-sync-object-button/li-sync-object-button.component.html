<div [matTooltip]="'li.sync_object_need_folder' | translate" [matTooltipDisabled]="!!object.folder">
  <button
    mat-stroked-button
    type="button"
    class="g-button-small"
    [disabled]="!object.folder"
    (click)="syncClick()">
    <mat-icon>sync</mat-icon>
    {{ 'li.sync_with_space' | translate }}
    @if (isLoading) {
      <fl-button-loader size="small"></fl-button-loader>
    }
  </button>
</div>
