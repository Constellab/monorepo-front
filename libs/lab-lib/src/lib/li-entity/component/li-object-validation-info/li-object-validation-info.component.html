<!--  Validated info  -->
@if (object.validatedBy && object.validatedAt) {
  <div class="g-layout-row g-layout-start-center g-layout-gap-05em">
    <mat-icon flIcon="validated"></mat-icon>
    <div>{{ 'li.validation_info' | translate }} :</div>
    <fl-user-with-date [user]="object.validatedBy" [date]="object.validatedAt"></fl-user-with-date>
  </div>
}
