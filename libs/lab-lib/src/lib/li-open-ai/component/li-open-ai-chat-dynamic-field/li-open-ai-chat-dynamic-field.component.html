<fl-form-field>
  <p class="g-text-light">{{ 'li.open_ai_help' | translate }}</p>
  <li-open-ai-chat
    [formControl]="formCtrl"
    [placeholder]="placeholder ?? ''"
    [hint]="hint ?? ''"></li-open-ai-chat>

  @if (formCtrl.hasError('required')) {
    <mat-error class="g-warn-text g-text-small">{{ 'li.open_ai_no_message_error' | translate }}</mat-error>
  }
</fl-form-field>
