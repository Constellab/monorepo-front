<fl-portal class="portal" flResize="both">
  <fl-portal-header [enableDrag]="true">
    <h2>{{ 'li.transform_resource' | translate: { resourceName: resourceName } }}</h2>
  </fl-portal-header>

  <fl-portal-content>
    <form id="transform-form" (ngSubmit)="submit()" [formGroup]="formGp">
      <li-transform-resource formArrayName="transformers" [resourceTypingName]="resourceTypingName">
      </li-transform-resource>
    </form>
  </fl-portal-content>

  <fl-portal-footer>
    <button mat-flat-button type="submit" form="transform-form" class="g-centered-forced primary">
      {{ 'li.call_transform' | translate }}
      @if (isLoading) {
        <fl-button-loader></fl-button-loader>
      }
    </button>
  </fl-portal-footer>
</fl-portal>
