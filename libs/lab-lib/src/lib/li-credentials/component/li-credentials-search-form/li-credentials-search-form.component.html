<div class="form g-layout-col" [formGroup]="formGp">
  <div class="g-full main-fields">
    <mat-form-field class="g-full">
      <mat-label>{{ 'li.name' | translate }}</mat-label>
      <input matInput formControlName="name" [placeholder]="'li.name' | translate" autocomplete="off" />
    </mat-form-field>

    <mat-form-field class="g-full">
      <mat-label>{{ 'li.credentials_type' | translate }}</mat-label>
      <mat-select formControlName="type" [placeholder]="'li.credentials_type' | translate">
        @for (key of credentialsTypes | flObjectKeys; track key) {
          <mat-option [value]="key">
            {{ 'li.credentials_type_' + credentialsTypes[key] | translate }}
          </mat-option>
        }
      </mat-select>
    </mat-form-field>
  </div>
</div>
