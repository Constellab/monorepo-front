<fl-search class="g-full-height">
  <!-- Advanced section in the right in a drawer -->
  <fl-search-advanced-form>
    <li-credentials-search-form></li-credentials-search-form>
  </fl-search-advanced-form>

  <!--  Center header  -->
  <fl-search-header>
    <fl-text-icon>
      <mat-icon>key</mat-icon>
      <h2>{{ 'biox.credentials' | translate }}</h2>
    </fl-text-icon>

    <fl-search-header-actions class="g-layout-row g-layout-start-center">
      <button
        mat-icon-button
        type="button"
        class="primary"
        [matTooltip]="'biox.create_credentials' | translate"
        matTooltipPosition="before"
        (click)="createCredentials()">
        <mat-icon>add</mat-icon>
      </button>
    </fl-search-header-actions>
  </fl-search-header>

  <fl-search-result>
    <li-credentials-table
      [datasource]="datasource"
      [columns]="columns"
      [rowSelectable]="credentialsSelectable"
      (credentialsSelected)="selectCredentials($event)"></li-credentials-table>
  </fl-search-result>
</fl-search>
