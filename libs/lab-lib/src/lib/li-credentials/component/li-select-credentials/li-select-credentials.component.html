<fl-input-search
  [selectedItem]="selectedCredentials"
  (selectedItemChange)="setAndEmitValue($event)"
  [datasource]="datasource"
  [placeholder]="placeholder | flTranslatableText | async"
  [required]="required"
  [disabled]="disabled"
  [minInputSearchLength]="0"
  [initSearchOnFocus]="true"
  [advancedButton]="advancedButton">
  <div class="photo" *flInputSearchPrefix="datasource as credentials">
    @if (credentials) {
      <fl-user-profile-picture [user]="credentials.createdBy" size="small"></fl-user-profile-picture>
    } @else {
      <mat-icon>key</mat-icon>
    }
  </div>

  <li-credentials-inline *flInputSearchOption="datasource as credentials" [credentials]="credentials">
  </li-credentials-inline>
</fl-input-search>
