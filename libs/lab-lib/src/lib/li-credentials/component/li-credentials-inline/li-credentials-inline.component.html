<div class="g-layout-row g-layout-start-center g-layout-gap-05em">
  <fl-user-profile-picture [user]="credentials.createdBy" size="small"></fl-user-profile-picture>
  <div>
    {{ credentials.name }}

    <div class="g-text-small g-text-light">{{ 'li.credentials_type_' + credentials.type | translate }}</div>
    <div class="g-text-small g-text-light g-text-dense-height">{{ credentials.description }}</div>
  </div>
</div>
