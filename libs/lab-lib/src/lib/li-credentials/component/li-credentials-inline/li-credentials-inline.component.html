<div class="g-layout-row g-layout-start-center g-layout-gap-05em">
  <fl-user-profile-picture [user]="credentials.createdBy" size="small"></fl-user-profile-picture>
  <div>
    <div>
      {{ credentials.name }}
      <span class="g-text-small g-text-light">
        ({{ 'biox.credentials_type_' + credentials.type | translate }})
      </span>
    </div>
    <div class="g-text-small g-text-light">{{ credentials.description }}</div>
  </div>
</div>
