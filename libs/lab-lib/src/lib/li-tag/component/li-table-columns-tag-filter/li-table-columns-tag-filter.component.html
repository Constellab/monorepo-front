<mat-expansion-panel [expanded]="true">
  <mat-expansion-panel-header>
    <mat-panel-title>
      <fl-text-icon>
        <mat-icon flIcon="tag"></mat-icon>
        {{ 'li.table_column_tags' | translate }}
      </fl-text-icon>
    </mat-panel-title>
  </mat-expansion-panel-header>

  <mat-panel-description class="g-text-small">
    {{ 'li.table_column_tags_description' | translate }}
  </mat-panel-description>

  <fl-tag-list
    [tags]="selectedTags"
    class="g-text-small"
    [showDeleteIcon]="true"
    (tagDeleted)="removeTag($event)"></fl-tag-list>

  <fl-add-tag-input
    class="global-input"
    [label]="'li.table_column_tags'"
    (addTag)="addTag($event)"
    [disableFilteredOptions]="true"
    [allowUnknownTag]="true"></fl-add-tag-input>

  @if (value?.length > 0) {
    <div class="g-layout-row-wrap g-layout-gap-05em g-text-small">
      @for (tag of value; track tag.key) {
        <fl-tag class="chip" [flTag]="tag" (click)="onKeyClick(tag.key)"></fl-tag>
      }
    </div>
  }
</mat-expansion-panel>
