<div class="form g-layout-col" [formGroup]="formGp">
  <div class="g-full main-fields">
    <!--  Key  -->
    <mat-form-field class="g-full">
      <mat-label>{{ 'li.key' | translate }}</mat-label>
      <input matInput formControlName="key" [placeholder]="'li.key' | translate" autocomplete="off" />
    </mat-form-field>

    <!-- Label -->
    <mat-form-field class="g-full">
      <mat-label>{{ 'li.label' | translate }}</mat-label>
      <input matInput formControlName="label" [placeholder]="'li.label' | translate" autocomplete="off" />
    </mat-form-field>
  </div>

  <mat-expansion-panel>
    <mat-expansion-panel-header>
      <mat-panel-title>
        <fl-text-icon>
          <mat-icon>manage_search</mat-icon>
          {{ 'li.advanced_search' | translate }}
        </fl-text-icon>
      </mat-panel-title>
    </mat-expansion-panel-header>
    <div class="g-full g-form-field-compact g-layout-row-wrap g-layout-between-center">
      <!-- Value format -->
      <mat-form-field class="g-search-field">
        <mat-label>{{ 'li.value_format' | translate}}</mat-label>
        <mat-select formControlName="valueFormat" [placeholder]="'li.value_format' | translate">
          <li-tag-value-format-options></li-tag-value-format-options>
        </mat-select>
      </mat-form-field>

      <!--  Creation data  -->
      <div class="g-form-field-no-hint g-full g-form-field-compact">
        <p class="g-text-small subtitle">{{'li.creation_date' | translate}}</p>
        <fl-search-date-interval formGroupName="createdAt"></fl-search-date-interval>
      </div>

      <!-- Deprecated -->
      <mat-checkbox formControlName="deprecated" class="checkbox g-full">
        {{ 'li.deprecated' | translate }}
      </mat-checkbox>

    </div>
  </mat-expansion-panel>

</div>
