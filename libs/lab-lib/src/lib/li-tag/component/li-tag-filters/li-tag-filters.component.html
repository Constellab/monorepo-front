<mat-expansion-panel [expanded]="true">
  <mat-expansion-panel-header>
    <mat-panel-title>
      <fl-text-icon>
        <mat-icon flIcon="tag"></mat-icon>
        {{ 'li.tags' | translate }}
      </fl-text-icon>
    </mat-panel-title>

    <mat-panel-description class="g-layout-row g-layout-end">
      <a
        mat-icon-button
        [routerLink]="tagMonitoringRoute"
        [matTooltip]="'li.go_to_tag_management' | translate">
        <mat-icon>settings</mat-icon>
      </a>
    </mat-panel-description>
  </mat-expansion-panel-header>

  <fl-tag-list
    [tags]="selectedTags"
    class="g-text-small"
    [showDeleteIcon]="true"
    (tagDeleted)="removeTag($event)"></fl-tag-list>

  <fl-add-tag-input
    class="global-input"
    (addTag)="addTag($event)"
    [allowUnknownTag]="false"></fl-add-tag-input>

  <fl-infinite-scroll
    [datasource]="tagKeys"
    class="tag-key-list g-infinite-table"
    textNoResult="li.no_tags_filters"
    textNoMoreResult="">
    <div class="g-layout-row-wrap g-layout-gap-05em g-text-small">
      @for (tagKey of tagKeys | flDatasourceConnect | async; track tagKey.key) {
        <fl-tag class="chip" [flTag]="tagKey.toFlTag()" (click)="onKeyClick(tagKey)"></fl-tag>
      }
    </div>
  </fl-infinite-scroll>
</mat-expansion-panel>
