<fl-dialog-header>
  <fl-text-icon>
    <mat-icon flIcon="tag"></mat-icon>
    {{ 'li.tags' | translate }}
  </fl-text-icon>
</fl-dialog-header>

<mat-dialog-content>
  <!-- Existing/Delete section -->
  <h2>{{ 'li.existing_tags' | translate }}</h2>
  <li-tag-list
    [tags]="currentTags"
    class="tag-list"
    mode="edit"
    [showNoTagMessage]="true"
    [enableDetails]="true"
    (tagDeleted)="deleteExistingTag($event)"></li-tag-list>

  <mat-divider class="divider"></mat-divider>

  <!-- Add section -->
  <h2>{{ 'li.add_tags_to_entity' | translate }}</h2>

  <fl-add-tag-input class="section" (addTag)="addTag($event)"></fl-add-tag-input>

  <li-tag-list
    [tags]="newTags"
    class="tag-list"
    mode="edit"
    (tagDeleted)="removeNewTag($event)"></li-tag-list>

  <mat-checkbox [(ngModel)]="isPropagable" class="section">
    {{ 'li.propagate_tags' | translate }}
  </mat-checkbox>

  <button mat-flat-button type="button" (click)="saveTags()" class="g-centered-forced add-button primary">
    {{ 'li.add_tags_to_entity' | translate }}
  </button>
</mat-dialog-content>
