<fl-dialog-header>
  {{ 'li.update_folder' | translate }}
</fl-dialog-header>

<mat-dialog-content>
  <form (ngSubmit)="submit()" id="folder-form">
    <p class="help-text g-text-light">
      {{
        (isUpdateResourceFolderMode
          ? 'li.associate_resource_to_folder'
          : 'li.associate_resource_scenario_to_folder'
        ) | translate
      }}
    </p>

    <!--    Folder      -->
    <li-folder-select [formControl]="formControl" [multiple]="false"></li-folder-select>
  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-flat-button type="submit" form="folder-form" class="g-centered-forced primary">
    {{ 'li.save' | translate }}
    @if (isLoading) {
      <fl-button-loader></fl-button-loader>
    }
  </button>
</div>
