<fl-card>
  <fl-card-header>
    {{ resource.name }}

    <fl-card-actions>
      <button
        mat-icon-button
        (click)="openResourceDetail()"
        type="button"
        class="primary"
        [matTooltip]="'li.resource' | translate">
        <mat-icon flIcon="resource"></mat-icon>
      </button>
    </fl-card-actions>
  </fl-card-header>

  <fl-card-body>
    <p>{{ 'li.resource_type' | translate }} : {{ resource.resourceType.human_name }}</p>
  </fl-card-body>

  <fl-card-footer class="g-text-light g-text-small">
    <fl-from-now [prefix]="'li.created' | translate" [date]="resource.createdAt"></fl-from-now>
  </fl-card-footer>
</fl-card>
