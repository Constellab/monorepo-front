<fl-dialog-header>
  {{ 'li.update_resource_name' | translate }}
</fl-dialog-header>

<mat-dialog-content>
  <form (ngSubmit)="submit()" id="resource-name-form">
    <mat-form-field class="g-form-input">
      <mat-label>{{ 'li.name' | translate }}</mat-label>
      <input
        matInput
        [formControl]="formCtrl"
        required
        flInputMaxLength="50"
        placeholder="{{ 'li.name' | translate }}" />
      @if (formCtrl.hasError('required')) {
        <mat-error>{{ 'li.name' | flErrorRequired }}</mat-error>
      }
    </mat-form-field>
  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-flat-button type="submit" form="resource-name-form" class="g-centered-forced primary">
    {{ 'li.save' | translate }}
    @if (isLoading) {
      <fl-button-loader></fl-button-loader>
    }
  </button>
</div>
