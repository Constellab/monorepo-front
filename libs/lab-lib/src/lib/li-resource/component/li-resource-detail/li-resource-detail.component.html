<div class="g-layout-col g-full-height li-resource-detail-container">
  @if (headerHidden()) {
    <div class="header-reveal-zone" (click)="showHeader()" (keydown.enter)="showHeader()" tabindex="0">
      <mat-icon class="show-header-button" [matTooltip]="'li.show_header' | translate">expand_more</mat-icon>
    </div>
  } @else {
    @if (hasChildren()) {
      <li-resource-children-tabs></li-resource-children-tabs>
    }
    <li-resource-detail-header
      [displayMode]="displayMode"
      class="header"
      [class.header-border]="displayMode === 'fullPage'"></li-resource-detail-header>
  }

  <!-- View -->
  <fl-async-section
    [object]="selectedView()"
    [isFlStatusEvent]="true"
    [showServerErrorText]="true"
    class="g-flex-auto main-view">
    <ng-container *flSectionBodyStatusEvent="selectedView() ?? '' as view">
      @if (view) {
        <li-resource-view-detail [labView]="view" class="g-full-height">
          <button
            mat-icon-button
            type="button"
            [matTooltip]="'li.hide_header' | translate"
            (click)="hideHeader()">
            <mat-icon>expand_less</mat-icon>
          </button>
          <button
            mat-icon-button
            type="button"
            [matTooltip]="'li.undock_view' | translate"
            (click)="undockView()">
            <mat-icon>open_in_browser</mat-icon>
          </button>
        </li-resource-view-detail>
      }
    </ng-container>
  </fl-async-section>
</div>
