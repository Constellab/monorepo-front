<div class="container g-layout-col">
  <fl-text-icon>
    <mat-icon flIcon="view"></mat-icon>
    <h2>{{ 'li.views' | translate }}</h2>
  </fl-text-icon>

  <ng-content></ng-content>

  <div
    class="g-flex-grow g-layout-row-wrap g-layout-start-stretch g-layout-gap-05em view-list g-scrollable-element">
    @for (viewSpec of viewSpecs$ | async; track viewSpec) {
      <li-resource-view-spec-card
        [viewType]="viewSpec.viewType"
        [name]="viewSpec.getName()"
        [shortDescription]="viewSpec.shortDescription"
        [style]="viewSpec.style"
        class="view-spec"
        (click)="openConfigPortal(viewSpec)">
      </li-resource-view-spec-card>
    }
  </div>
</div>
