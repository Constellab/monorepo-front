<fl-dialog-header>
  {{ 'li.select_resource' | translate }}
</fl-dialog-header>

<mat-dialog-content>
  <li-resource-search
    [resourceSelectable]="true"
    [fullPageSearch]="false"
    [customSavedSearches]="savedSearch"
    [defaultFilters]="defaultFilters"
    [columnTagsFilterKeys]="columnTagsFilterKeys"
    class="search"
    (resourceSelected)="onResourceSelected($event)"></li-resource-search>
</mat-dialog-content>
