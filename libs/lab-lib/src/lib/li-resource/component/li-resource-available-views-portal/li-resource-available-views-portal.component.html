<fl-portal>
  <fl-portal-content>
    <fl-async-section [arrayObs]="favoritesViews$" [emptyText]="'li.no_favorite_views'">
      <fl-section-header>
        <fl-text-icon iconPosition="end" class="title">
          <h2>{{ 'li.favorite_views' | translate }}</h2>
          <mat-icon class="primary">star</mat-icon>
        </fl-text-icon>
      </fl-section-header>
      <ng-container *flSectionBodyDatasource="favoritesViews$ as favoritesViews">
        <div class="container">
          @for (viewConfig of favoritesViews; track viewConfig) {
            <li-resource-view-spec-card
              [viewType]="viewConfig.viewType"
              [name]="viewConfig.title"
              [user]="viewConfig.createdBy"
              [creationDate]="viewConfig.createdAt"
              [style]="viewConfig.style"
              (click)="openFavoriteView(viewConfig)">
            </li-resource-view-spec-card>
          }
        </div>
      </ng-container>
    </fl-async-section>

    <h2 class="title native-views">{{ 'li.native_views' | translate }}</h2>
    <div class="container">
      @for (viewSpec of viewSpecs$ | async; track viewSpec) {
        <li-resource-view-spec-card
          [viewType]="viewSpec.viewType"
          [name]="viewSpec.getName()"
          [shortDescription]="viewSpec.shortDescription"
          [style]="viewSpec.style"
          (click)="openConfigPortal(viewSpec)">
        </li-resource-view-spec-card>
      }
    </div>
  </fl-portal-content>
</fl-portal>
