<fl-search
  class="g-full-height drop-zone"
  flDragHover="drag-file-hover"
  (flDrop)="onFileDrop($event)"
  flBulkSelection
  [flBulkSelectionDatasource]="datasource"
  [flBulkSelectionActions]="bulkActions"
  [flBulkSelectionAllowSelectEntireSearch]="false"
  [flBulkSelectionDisabled]="!bulkEnabled"
  flBulkSelectionRowSelector="mat-row.g-row-link-container">
  <!-- Advanced section in the right in a drawer -->
  <fl-search-advanced-form>
    <li-resource-search-form></li-resource-search-form>
  </fl-search-advanced-form>

  <!--  Center header  -->
  <fl-search-header>
    <fl-text-icon>
      <mat-icon flIcon="resource"></mat-icon>
      <h2>{{ 'li.resources' | translate }}</h2>
    </fl-text-icon>

    <fl-search-header-actions class="g-layout-row">
      @if (bulkEnabled) {
        <fl-bulk-selection-toggle></fl-bulk-selection-toggle>
      }

      <!--   Upload files     -->
      <fl-input-file-icon-container
        [matTooltip]="'li.upload_file' | translate"
        icon="upload_file"
        class="upload-button primary">
        <input
          flInputFile
          [multiple]="true"
          type="file"
          (fileChange)="openUploadFiles($event)"
          [autoClearHtmlInput]="true" />
      </fl-input-file-icon-container>

      <!--   Upload folders     -->
      <fl-input-file-icon-container
        [matTooltip]="'li.upload_folder' | translate"
        icon="drive_folder_upload"
        class="upload-button primary">
        <input
          flInputFile
          type="file"
          (fileChange)="openUploadFolder($event)"
          [multiple]="true"
          webkitdirectory
          mozdirectory
          [strictMode]="false"
          [autoClearHtmlInput]="true" />
      </fl-input-file-icon-container>

      <button
        mat-icon-button
        type="button"
        class="primary"
        (click)="openImportFromUrlDialog()"
        [matTooltip]="'li.import_resource_from_link' | translate">
        <mat-icon>cloud_download</mat-icon>
      </button>
    </fl-search-header-actions>
  </fl-search-header>

  <fl-search-result>
    <li-resource-table
      class="card-table"
      [datasource]="datasource"
      [columns]="columns"
      [selectableRow]="resourceSelectable"
      (resourceSelected)="selectResource($event)"
      (tagSelected)="searchOnTag($event)"></li-resource-table>

    <div class="drop-info g-layout-col g-layout-center-center g-text-centered">
      <mat-icon>upload_file</mat-icon>
      <div class="g-text-big">{{ 'li.upload_file_drop' | translate }}</div>
    </div>
  </fl-search-result>
</fl-search>
