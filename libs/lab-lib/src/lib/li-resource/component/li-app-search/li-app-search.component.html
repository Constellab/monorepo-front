<fl-search class="g-full-height">
  <!-- Advanced section in the right in a drawer -->
  <fl-search-advanced-form>
    <li-resource-search-form mode="app"></li-resource-search-form>
  </fl-search-advanced-form>

  <!--  Center header  -->
  <fl-search-header>
    <fl-text-icon>
      <mat-icon flIcon="dashboard"></mat-icon>
      <h2>{{ 'li.apps' | translate }}</h2>
    </fl-text-icon>
  </fl-search-header>

  <fl-search-result>
    <li-resource-table
      [datasource]="datasource"
      [columns]="columns"
      [selectableRow]="false"
      (tagSelected)="searchOnTag($event)"></li-resource-table>
  </fl-search-result>
</fl-search>
