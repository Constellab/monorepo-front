<fl-card class="g-full-height">
  <fl-card-header>
    <fl-text-icon>
      <mat-icon flIcon="scenario"></mat-icon>
      <h2>{{ 'li.scenarios_that_use_the_resource' | translate }}</h2>
    </fl-text-icon>
  </fl-card-header>

  <fl-card-body class="card-body">
    <fl-infinite-table-container [datasource]="datasource">
      <li-scenario-table [datasource]="datasource" [columns]="columns"></li-scenario-table>
    </fl-infinite-table-container>
  </fl-card-body>
</fl-card>
