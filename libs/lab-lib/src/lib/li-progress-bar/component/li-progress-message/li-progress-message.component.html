<div class="g-layout-row g-layout-between g-full">
  <fl-status-chip [status]="progressMessage.type" mode="iconText" size="small"></fl-status-chip>
  <div class="g-text-light date" [matTooltip]="progressMessage.datetime | flDate: 'DATE_TIME_WITH_SECONDS'">
    {{ progressMessage.datetime | flDate: 'TIME_WITH_SECONDS' }}
  </div>
</div>

<fl-limit-height>
  @if (progressMessage.progress) {
    {{ progressMessage.progress | number: '1.0-1' }}%
  }
  <span class="text">{{ progressMessage.text }}</span>
</fl-limit-height>
