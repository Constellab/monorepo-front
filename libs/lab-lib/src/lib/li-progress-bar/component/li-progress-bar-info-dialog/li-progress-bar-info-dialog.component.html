<fl-dialog-header>
  {{ 'li.node_progress_detail' | translate }}
  <fl-dialog-header-actions>
    <a
      [href]="downloadUrl$ | async"
      download
      mat-icon-button
      [matTooltip]="'li.download_messages' | translate">
      <mat-icon>cloud_download</mat-icon>
    </a>
  </fl-dialog-header-actions>
</fl-dialog-header>

<mat-dialog-content #content class="g-styled-scrollbar">
  <fl-async-section [object]="progressBar$">
    <ng-container *flSectionBody>
      <li-progress-bar-info
        [progressBar$]="progressBar$"
        [scrollableElement]="content"
        class="container"></li-progress-bar-info>
    </ng-container>
  </fl-async-section>
</mat-dialog-content>
