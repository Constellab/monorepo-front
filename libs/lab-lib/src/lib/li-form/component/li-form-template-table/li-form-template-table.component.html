<mat-table mat-table [dataSource]="datasource" flSearchTableSort>
  <!-- Name -->
  <ng-container matColumnDef="name">
    <mat-header-cell *matHeaderCellDef mat-sort-header>
      <span>{{ 'li.name' | translate }}</span>
    </mat-header-cell>
    <mat-cell *matCellDef="let template">
      @if (!rowSelectable) {
        <a [routerLink]="template | liDetailRoute" class="g-row-link" aria-hidden="true"></a>
      }
      @if (template.isArchived) {
        <mat-icon
          class="status-icon over-link"
          style="margin-right: 0.5em"
          [matTooltip]="'li.archived' | translate"
          flIcon="archive">
        </mat-icon>
      }
      <div>
        <div class="g-text-dense-height text">{{ template.name }}</div>
        @if (template.description) {
          <div class="g-text-tiny g-text-light g-text-dense-height">{{ template.description }}</div>
        }
      </div>
    </mat-cell>
  </ng-container>

  <!-- Tags -->
  <ng-container matColumnDef="tags">
    <mat-header-cell *matHeaderCellDef class="g-column-width-2">
      <span>{{ 'li.tags' | translate }}</span>
    </mat-header-cell>
    <mat-cell *matCellDef="let template" class="g-column-width-2">
      @defer (on viewport) {
        <li-tag-list [tags]="template | labGetEntityTags"></li-tag-list>
      } @placeholder {
        <div></div>
      }
    </mat-cell>
  </ng-container>

  <!-- Last Modification -->
  <ng-container matColumnDef="lastModification">
    <mat-header-cell *matHeaderCellDef mat-sort-header>
      <span>{{ 'li.last_modification_info' | translate }}</span>
    </mat-header-cell>
    <mat-cell *matCellDef="let row">
      <fl-user-with-date
        [user]="row.lastModifiedBy"
        [date]="row.lastModifiedAt"
        class="over-link"></fl-user-with-date>
    </mat-cell>
  </ng-container>

  <!-- Actions -->
  <ng-container matColumnDef="actions">
    <mat-header-cell *matHeaderCellDef class="g-table-icon-button-cell"> </mat-header-cell>
    <mat-cell *matCellDef="let row" class="g-table-icon-button-cell">
      <button mat-icon-button type="button" (click)="openActionMenu(row, $event)" class="g-row-button">
        <mat-icon>more_vert</mat-icon>
      </button>
    </mat-cell>
  </ng-container>

  <mat-header-row *matHeaderRowDef="columns; sticky: true"></mat-header-row>
  <mat-row
    *matRowDef="let row; columns: columns"
    class="g-table-row-selectable g-row-link-container"
    (click)="rowClicked(row)"></mat-row>
</mat-table>
