<fl-input-search
  [selectedItem]="selectedForm"
  (selectedItemChange)="setAndEmitValue($event)"
  [datasource]="datasource"
  [placeholder]="(placeholder() | flTranslatableText | async) ?? ''"
  [required]="required"
  [disabled]="disabled"
  [minInputSearchLength]="0"
  [initSearchOnFocus]="true"
  [advancedButton]="advancedButton">
  <div *flInputSearchPrefix="datasource as form">
    <mat-icon flIcon="form"></mat-icon>
  </div>

  <span *flInputSearchOption="datasource as form">
    {{ form.name }}
  </span>
</fl-input-search>
