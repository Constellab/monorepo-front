<fl-dialog-header>
  {{ title | translate }}
</fl-dialog-header>

<mat-dialog-content>
  <p class="g-text-light hint">
    {{ 'li.form_duplicate_template_hint' | translate: { version: sourceVersionLabel } }}
  </p>

  <form (ngSubmit)="submit()" id="form-template-duplicate-form" [formGroup]="formGp">
    <!-- Name -->
    <mat-form-field class="g-form-input">
      <mat-label>{{ 'li.name' | translate }}</mat-label>
      <input
        matInput
        formControlName="name"
        required
        flInputMaxLength="255"
        placeholder="{{ 'li.name' | translate }}" />
      @if (formGp.get('name').hasError('required')) {
        <mat-error>{{ 'li.name' | flErrorRequired }}</mat-error>
      }
    </mat-form-field>

    <!-- Description -->
    <mat-form-field class="g-form-input">
      <mat-label>{{ 'li.description' | translate }}</mat-label>
      <input matInput formControlName="description" placeholder="{{ 'li.description' | translate }}" />
    </mat-form-field>
  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button
    mat-flat-button
    type="submit"
    form="form-template-duplicate-form"
    class="g-centered-forced primary"
    [disabled]="isLoading">
    {{ 'li.form_duplicate' | translate }}
    @if (isLoading) {
      <fl-button-loader></fl-button-loader>
    }
  </button>
</div>
