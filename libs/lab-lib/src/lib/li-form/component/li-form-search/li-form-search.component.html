<fl-search class="g-full-height">
  <!-- Advanced section in the right in a drawer -->
  <fl-search-advanced-form>
    <li-form-search-form></li-form-search-form>
  </fl-search-advanced-form>

  <!-- Center header -->
  <fl-search-header>
    <fl-text-icon>
      <mat-icon flIcon="form"></mat-icon>
      <h2>{{ 'li.forms' | translate }}</h2>
    </fl-text-icon>
  </fl-search-header>

  <fl-search-result>
    <li-form-table
      [datasource]="datasource"
      [columns]="columns"
      [rowSelectable]="formSelectable"
      (formSelected)="selectForm($event)"></li-form-table>
  </fl-search-result>
</fl-search>
