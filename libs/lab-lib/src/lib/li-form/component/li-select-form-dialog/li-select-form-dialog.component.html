<fl-dialog-header>
  {{ title | translate }}
</fl-dialog-header>

<mat-dialog-content>
  <li-form-search
    [formSelectable]="formSelectable"
    [fullPageSearch]="false"
    [columns]="columns"
    [defaultFilters]="defaultFilters"
    [disabledFilters]="disabledFilters"
    (formSelected)="onFormSelected($event)">
  </li-form-search>
</mat-dialog-content>
