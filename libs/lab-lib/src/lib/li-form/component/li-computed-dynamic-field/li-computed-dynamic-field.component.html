<div class="computed-field">
  <span class="computed-field-label">{{ placeholder }} :&nbsp;</span>

  <div class="computed-field-row">
    <span class="computed-field-value">{{ displayValue }}</span>
    @if (expression) {
      <mat-icon
        class="computed-field-info"
        [matTooltip]="('li.computed_expression_tooltip' | translate) + ': ' + expression"
        >info_outline</mat-icon
      >
    }
  </div>
</div>

@if (formCtrl.value?.errors) {
  <span class="computed-field-error">{{ formCtrl.value.errors }}</span>
}
