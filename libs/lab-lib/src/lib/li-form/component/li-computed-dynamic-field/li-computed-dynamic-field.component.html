<div class="computed-field">
  <div class="computed-field-header">
    <span class="computed-field-label">{{ placeholder }}</span>
    @if (expression) {
      <mat-icon class="computed-field-info" [matTooltip]="expression">info_outline</mat-icon>
    }
  </div>

  <span class="computed-field-value">{{ formCtrl.value?.value ?? '-' }}</span>

  @if (formCtrl.value?.errors) {
    <span class="computed-field-error">{{ formCtrl.value.errors }}</span>
  }
</div>
