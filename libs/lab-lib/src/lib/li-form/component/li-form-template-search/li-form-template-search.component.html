<fl-search class="g-full-height">
  <!-- Advanced section in the right in a drawer -->
  <fl-search-advanced-form>
    <li-form-template-search-form></li-form-template-search-form>
  </fl-search-advanced-form>

  <!-- Center header -->
  <fl-search-header>
    <fl-text-icon>
      <mat-icon>description</mat-icon>
      <h2>{{ 'li.form_templates' | translate }}</h2>
    </fl-text-icon>

    <fl-search-header-actions class="g-layout-row g-layout-start-center">
      <button
        mat-icon-button
        type="button"
        class="primary"
        [matTooltip]="'li.form_create_template' | translate"
        matTooltipPosition="before"
        (click)="openCreateFormTemplateDialog()">
        <mat-icon>add</mat-icon>
      </button>
    </fl-search-header-actions>
  </fl-search-header>

  <fl-search-result>
    <li-form-template-table
      [datasource]="datasource"
      [columns]="columns"
      [rowSelectable]="templateSelectable"
      (templateSelected)="selectTemplate($event)"></li-form-template-table>
  </fl-search-result>
</fl-search>
