<fl-search class="g-full-height">
  <!-- Advanced section in the right in a drawer -->
  <fl-search-advanced-form>
    <li-lab-search-form></li-lab-search-form>
  </fl-search-advanced-form>

  <!--  Center header  -->
  <fl-search-header>
    <fl-text-icon>
      <mat-icon flIcon="lab"></mat-icon>
      <h2>{{ 'monitoring.labs' | translate }}</h2>
    </fl-text-icon>

    <fl-search-header-actions class="g-layout-row g-layout-start-center">
      <button
        mat-icon-button
        type="button"
        class="primary"
        [matTooltip]="'monitoring.add_lab' | translate"
        matTooltipPosition="before"
        (click)="openRegistrationDialog()">
        <mat-icon>add</mat-icon>
      </button>
    </fl-search-header-actions>
  </fl-search-header>

  <fl-search-result>
    <li-lab-table
      [datasource]="datasource"
      [columns]="columns"
      [rowSelectable]="labSelectable"
      (labSelected)="selectLab($event)"></li-lab-table>
  </fl-search-result>
</fl-search>
