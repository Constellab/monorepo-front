<div class="g-layout-row g-layout-start-center g-layout-gap-05em">
  <mat-icon
    flIcon="folder"
    class="folder-icon"
    [style.background-color]="folder().id | flStringToRgb"
    [style.color]="folder().id | flStringToRgb | flContrastColor">
  </mat-icon>

  <div class="text">
    {{ folder().name }}
  </div>
</div>
