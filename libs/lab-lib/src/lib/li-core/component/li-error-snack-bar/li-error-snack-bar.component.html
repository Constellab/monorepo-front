<div class="g-layout-row g-layout-between-center g-full-height">
  <div
    class="message g-text-dense-height"
    [ngClass]="showAsSuccess ? 'message-success' : 'message-warn'"
    [innerHTML]="text"></div>

  @if (showSendToSupport) {
    <button class="button warn" mat-flat-button type="button" (click)="sendToSupport()">
      {{ 'li.send_to_support' | translate }}
    </button>
  }

  <button
    class="button"
    [ngClass]="{ primary: showAsSuccess, warn: !showAsSuccess }"
    mat-flat-button
    type="button"
    (click)="close()">
    {{ 'flSnackBar.ok' | translate }}
  </button>
</div>
