<div class="code-editor-dynamic-field-div">
  @if (placeholder) {
    <p>{{ placeholder }}</p>
  }
  <fl-code-editor [language]="language" [formCtrl]="formCtrl"></fl-code-editor>
  @if (hint) {
    <p class="g-text-light g-text-small">{{ hint }}</p>
  }

  @if (formCtrl.touched && formCtrl.hasError('required')) {
    <mat-error class="g-mat-error">{{ placeholder | flErrorRequired: false }} </mat-error>
  }
</div>
