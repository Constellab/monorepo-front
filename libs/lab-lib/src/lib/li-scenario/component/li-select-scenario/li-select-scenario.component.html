<fl-input-search
  [selectedItem]="selectedScenario"
  (selectedItemChange)="setAndEmitValue($event)"
  [datasource]="datasource"
  [placeholder]="placeholder() | flTranslatableText | async"
  [required]="required"
  [disabled]="disabled"
  [minInputSearchLength]="0"
  [initSearchOnFocus]="true"
  [advancedButton]="advancedButton">
  <ng-container *flInputSearchPrefix="datasource as scenario">
    <div class="photo">
      @if (scenario) {
        <fl-user-profile-picture [user]="scenario.createdBy" size="small"></fl-user-profile-picture>
      } @else {
        <mat-icon flIcon="scenario"></mat-icon>
      }
    </div>
  </ng-container>

  <li-scenario-inline *flInputSearchOption="datasource as scenario" [scenario]="scenario">
  </li-scenario-inline>
</fl-input-search>
