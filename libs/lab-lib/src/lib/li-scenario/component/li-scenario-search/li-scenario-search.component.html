<fl-search class="g-full-height">
  <!-- Advanced section in the right in a drawer -->
  <fl-search-advanced-form>
    <li-scenario-search-form></li-scenario-search-form>
  </fl-search-advanced-form>

  <!--  Center header  -->
  <fl-search-header>
    <fl-text-icon>
      <mat-icon flIcon="scenario"></mat-icon>
      <h2>{{ 'li.scenarios' | translate }}</h2>
    </fl-text-icon>

    <fl-search-header-actions class="g-layout-row g-layout-start-center">
      <button
        mat-icon-button
        type="button"
        class="primary"
        [matTooltip]="'li.new_scenario' | translate"
        matTooltipPosition="before"
        (click)="createScenario()">
        <mat-icon>add</mat-icon>
      </button>

      <button
        mat-icon-button
        type="button"
        class="primary"
        (click)="openImportFromUrlDialog()"
        [matTooltip]="'li.import_scenario_from_lab' | translate">
        <mat-icon>cloud_download</mat-icon>
      </button>
    </fl-search-header-actions>
  </fl-search-header>

  <fl-search-result>
    <li-scenario-table
      [datasource]="datasource"
      [columns]="columns"
      [rowSelectable]="scenarioSelectable"
      (scenarioSelected)="selectScenario($event)"></li-scenario-table>
  </fl-search-result>
</fl-search>
