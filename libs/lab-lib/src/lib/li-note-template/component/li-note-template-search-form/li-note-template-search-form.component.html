<div class="form g-layout-col" [formGroup]="formGp">
  <!--  Main search fields    -->
  <div class="g-full main-fields">
    <!--  Title  -->
    <mat-form-field class="g-full">
      <mat-label>{{ 'li.title' | translate }}</mat-label>
      <input matInput formControlName="title" [placeholder]="'li.title' | translate" autocomplete="off" />
    </mat-form-field>
  </div>

  <!--   Tags    -->
  <li-tag-filters formControlName="tags"></li-tag-filters>

  <mat-expansion-panel>
    <mat-expansion-panel-header>
      <mat-panel-title>
        <fl-text-icon>
          <mat-icon>manage_search</mat-icon>
          {{ 'li.advanced_search' | translate }}
        </fl-text-icon>
      </mat-panel-title>
    </mat-expansion-panel-header>
    <div class="g-full g-form-field-compact g-layout-row-wrap g-layout-between-center">
      <!--  Created by  -->
      <fl-form-field class="g-search-field g-form-field-compact">
        <fl-select-user
          formControlName="createdBy"
          [placeholder]="'li.created_by' | translate"></fl-select-user>
      </fl-form-field>

      <!--  Last Modified by  -->
      <fl-form-field class="g-search-field g-form-field-compact">
        <fl-select-user
          formControlName="lastModifiedBy"
          [placeholder]="'li.last_modified_by' | translate"></fl-select-user>
      </fl-form-field>

      <!--  Id -->
      <mat-form-field class="g-search-field g-form-field-compact">
        <mat-label>{{ 'li.id' | translate }}</mat-label>
        <input matInput formControlName="id" [placeholder]="'li.id' | translate" autocomplete="off" />
      </mat-form-field>

      <!-- Form template -->
      <fl-form-field class="g-search-field g-form-field-compact">
        <li-select-form-template
          formControlName="formTemplateId"
          [placeholder]="'li.note_template_uses_form_template' | translate">
        </li-select-form-template>
      </fl-form-field>

      <!--  Creation date  -->
      <div class="g-form-field-no-hint g-full g-form-field-compact">
        <p class="g-text-small subtitle">{{ 'li.creation_date' | translate }}</p>
        <fl-search-date-interval formGroupName="createdAt"> </fl-search-date-interval>
      </div>

      <!--  Last modification date  -->
      <div class="g-form-field-no-hint g-full g-form-field-compact">
        <p class="g-text-small subtitle">{{ 'li.last_modified_date' | translate }}</p>
        <fl-search-date-interval formGroupName="lastModifiedAt"> </fl-search-date-interval>
      </div>
    </div>
  </mat-expansion-panel>
</div>
