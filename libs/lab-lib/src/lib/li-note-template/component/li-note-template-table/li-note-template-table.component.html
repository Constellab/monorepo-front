<mat-table mat-table [dataSource]="datasource" class="table" flSearchTableSort>
  <!-- Title -->
  <ng-container matColumnDef="title">
    <mat-header-cell *matHeaderCellDef mat-sort-header>
      <span> {{ 'li.title' | translate }}</span>
    </mat-header-cell>
    <mat-cell *matCellDef="let row">
      <div class="text g-text-dense-height">{{ row.title }}</div>

      <!--    Invisible link  -->
      @if (!rowSelectable) {
        <a [routerLink]="row | liDetailRoute" class="g-row-link"></a>
      }
    </mat-cell>
  </ng-container>

  <!-- Creation -->
  <ng-container matColumnDef="creation">
    <mat-header-cell *matHeaderCellDef mat-sort-header>
      <span>{{ 'li.creation_info' | translate }}</span>
    </mat-header-cell>
    <mat-cell *matCellDef="let row">
      <fl-user-with-date [user]="row.createdBy" [date]="row.createdAt"></fl-user-with-date>
    </mat-cell>
  </ng-container>

  <!-- Last Modification -->
  <ng-container matColumnDef="lastModification">
    <mat-header-cell *matHeaderCellDef mat-sort-header>
      <span>{{ 'li.last_modification_info' | translate }}</span>
    </mat-header-cell>
    <mat-cell *matCellDef="let row">
      <fl-user-with-date [user]="row.lastModifiedBy" [date]="row.lastModifiedAt"></fl-user-with-date>
    </mat-cell>
  </ng-container>

  <mat-header-row *matHeaderRowDef="columns; sticky: true"></mat-header-row>
  <mat-row
    *matRowDef="let row; columns: columns"
    class="g-table-row-selectable g-row-link-container"
    (click)="rowClicked(row)"></mat-row>
</mat-table>
