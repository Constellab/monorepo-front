<mat-table mat-table [dataSource]="datasource" class="table" flSearchTableSort>
  <!-- Title -->
  <ng-container matColumnDef="title">
    <mat-header-cell *matHeaderCellDef mat-sort-header>
      <span> {{ 'li.title' | translate }}</span>
    </mat-header-cell>
    <mat-cell *matCellDef="let row">
      <div class="text g-text-dense-height">{{ row.title }}</div>

      <!--    Invisible link  -->
      @if (!rowSelectable) {
        <!-- eslint-disable-next-line @angular-eslint/template/elements-content -->
        <a [routerLink]="row | liDetailRoute" class="g-row-link"></a>
      }
    </mat-cell>
  </ng-container>

  <!-- Tags -->
  <ng-container matColumnDef="tags">
    <mat-header-cell *matHeaderCellDef>
      <span> {{ 'li.tags' | translate }}</span>
    </mat-header-cell>
    <mat-cell *matCellDef="let row">
      @defer (on viewport) {
        <li-tag-list [tags]="row | labGetEntityTags"></li-tag-list>
      } @placeholder {
        <div></div>
      }
    </mat-cell>
  </ng-container>

  <!-- Last Modification -->
  <ng-container matColumnDef="lastModification">
    <mat-header-cell *matHeaderCellDef mat-sort-header>
      <span>{{ 'li.last_modification_info' | translate }}</span>
    </mat-header-cell>
    <mat-cell *matCellDef="let row">
      <fl-user-with-date [user]="row.lastModifiedBy" [date]="row.lastModifiedAt"></fl-user-with-date>
    </mat-cell>
  </ng-container>

  <!-- Actions -->
  <ng-container matColumnDef="actions">
    <mat-header-cell *matHeaderCellDef class="g-table-icon-button-cell"> </mat-header-cell>
    <mat-cell *matCellDef="let row" class="g-table-icon-button-cell">
      <button mat-icon-button type="button" (click)="openActionMenu(row, $event)" class="g-row-button">
        <mat-icon>more_vert</mat-icon>
      </button>
    </mat-cell>
  </ng-container>

  <mat-header-row *matHeaderRowDef="columns; sticky: true"></mat-header-row>
  <mat-row
    *matRowDef="let row; columns: columns"
    class="g-table-row-selectable g-row-link-container"
    (click)="rowClicked(row)"></mat-row>
</mat-table>
