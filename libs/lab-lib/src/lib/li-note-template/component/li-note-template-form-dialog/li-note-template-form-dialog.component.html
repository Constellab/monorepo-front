<fl-dialog-header>
  {{ title | translate }}
</fl-dialog-header>

<mat-dialog-content>
  <form (ngSubmit)="submit()" id="doc-template-form" [formGroup]="formGp">
    <!--  Title  -->
    <mat-form-field class="g-form-input">
      <mat-label>{{ 'li.title' | translate }}</mat-label>
      <input
        matInput
        formControlName="title"
        required
        flInputMaxLength="255"
        placeholder="{{ 'li.title' | translate }}" />
      @if (formGp.get('title').hasError('required')) {
        <mat-error>{{ 'li.title' | flErrorRequired }}</mat-error>
      }
    </mat-form-field>
  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-flat-button type="submit" form="doc-template-form" class="g-centered-forced primary">
    {{ 'li.save' | translate }}
    @if (isLoading) {
      <fl-button-loader></fl-button-loader>
    }
  </button>
</div>
