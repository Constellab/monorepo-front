<fl-dialog-header>
  {{ title | translate }}
</fl-dialog-header>

<mat-dialog-content>
  <form (ngSubmit)="submit()" id="scenario-template-form" [formGroup]="formGp">
    @if (isCreateMode()) {
      <p class="g-text-light help-text">
        {{ 'li.scenario_template_explication' | translate }}
      </p>
    }

    <!--  name  -->
    <mat-form-field class="g-form-input">
      <mat-label>{{ 'li.name' | translate }}</mat-label>
      <input
        matInput
        formControlName="name"
        required
        flInputMaxLength="255"
        [placeholder]="'li.name' | translate" />
      @if (formGp.get('name').hasError('required')) {
        <mat-error>{{ 'li.name' | flErrorRequired }}</mat-error>
      }
    </mat-form-field>

    <!--  Description-->
    <te-text-editor
      [config]="textEditorConfig"
      formControlName="description"
      class="text-editor"
      [placeholder]="'li.protocol_description_placeholder' | translate"></te-text-editor>
  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-flat-button type="submit" form="scenario-template-form" class="g-centered-forced primary">
    {{ 'li.save' | translate }}
    @if (isLoading) {
      <fl-button-loader></fl-button-loader>
    }
  </button>
</div>
