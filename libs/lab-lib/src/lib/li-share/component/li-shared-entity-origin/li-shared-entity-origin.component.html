<fl-key-value>
  <fl-key>{{ 'li.share_origin_lab' | translate }}</fl-key>
  {{ sharedEntity.lab.name }}
  @if (sharedEntity.lab.labId) {
    <span class="g-text-small"> ({{ sharedEntity.lab.labId }})</span>
  }
</fl-key-value>

<fl-key-value>
  <fl-key>{{ 'li.share_origin_by' | translate }}</fl-key>
  <fl-user-inline [user]="sharedEntity.user"></fl-user-inline>
</fl-key-value>

<fl-key-value>
  <fl-key>{{ 'li.share_origin_space' | translate }}</fl-key>
  {{ sharedEntity.lab.spaceName }}
</fl-key-value>

<fl-key-value>
  <fl-key>{{ 'li.share_origin_at' | translate }}</fl-key>
  <fl-from-now [date]="sharedEntity.createdAt"></fl-from-now>
</fl-key-value>
