<mat-table mat-table [dataSource]="datasource" class="table">
  <!-- Lab -->
  <ng-container matColumnDef="lab">
    <mat-header-cell *matHeaderCellDef>
      {{ 'li.share_to_lab' | translate }}
    </mat-header-cell>
    <mat-cell *matCellDef="let row">
      {{ row.labName }}
    </mat-cell>
  </ng-container>

  <!-- Space -->
  <ng-container matColumnDef="space">
    <mat-header-cell *matHeaderCellDef>
      {{ 'li.share_to_space' | translate }}
    </mat-header-cell>
    <mat-cell *matCellDef="let row">
      {{ row.spaceName }}
    </mat-cell>
  </ng-container>

  <!-- Receiver -->
  <ng-container matColumnDef="receiver">
    <mat-header-cell *matHeaderCellDef>
      {{ 'li.received_by' | translate }}
    </mat-header-cell>
    <mat-cell *matCellDef="let row"> {{ row.userFirstname }} {{ row.userLastname }} </mat-cell>
  </ng-container>

  <!-- SharedBy -->
  <ng-container matColumnDef="sharedBy">
    <mat-header-cell *matHeaderCellDef>
      <span>{{ 'li.shared_by' | translate }}</span>
    </mat-header-cell>
    <mat-cell *matCellDef="let row">
      <fl-user-with-date [user]="row.createdBy" [date]="row.createdAt"></fl-user-with-date>
    </mat-cell>
  </ng-container>

  <mat-header-row *matHeaderRowDef="columns; sticky: true"></mat-header-row>
  <mat-row *matRowDef="let row; columns: columns"></mat-row>
</mat-table>
