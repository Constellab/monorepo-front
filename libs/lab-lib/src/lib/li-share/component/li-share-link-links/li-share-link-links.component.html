<div>
  <strong>{{ 'li.share_link_download' | translate }}</strong> -
  <span>{{ 'li.share_link_download_help' | translate }}</span> :
  <div
    class="g-text-link g-text-light"
    (click)="copyDownloadLink()"
    [matTooltip]="'li.share_link_click_to_copy' | translate">
    {{ shareLink().downloadLink }}
  </div>
</div>

@if (shareLink().previewLink) {
  <div class="preview-link">
    <strong>{{ 'li.share_link_preview' | translate }}</strong> -
    <span>{{ 'li.share_link_preview_help' | translate }}</span> :
    <div
      class="g-text-link g-text-light"
      (click)="copyPreviewLink()"
      [matTooltip]="'li.share_link_click_to_copy' | translate">
      {{ shareLink().previewLink }}
    </div>
  </div>
}
