<fl-dialog-header>
  {{ 'li.note_select' | translate }}
</fl-dialog-header>

<mat-dialog-content>
  <li-note-search
    [noteSelectable]="true"
    [fullPageSearch]="false"
    [defaultFilters]="defaultFilters"
    [disabledFilters]="disabledFilters"
    (noteSelected)="onNoteSelected($event)"></li-note-search>
</mat-dialog-content>
