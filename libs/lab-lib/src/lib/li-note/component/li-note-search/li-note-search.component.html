<fl-search class="g-full-height">
  <!-- Advanced section in the right in a drawer -->
  <fl-search-advanced-form>
    <li-note-search-form></li-note-search-form>
  </fl-search-advanced-form>

  <!--  Center header  -->
  <fl-search-header>
    <fl-text-icon>
      <mat-icon flIcon="note"></mat-icon>
      <h2>{{ 'li.notes' | translate }}</h2>
    </fl-text-icon>

    <fl-search-header-actions class="g-layout-row g-layout-start-center">
      <button
        mat-icon-button
        type="button"
        class="primary"
        [matTooltip]="'li.create_note' | translate"
        matTooltipPosition="before"
        (click)="openCreateNoteFormDialog()">
        <mat-icon>add</mat-icon>
      </button>
    </fl-search-header-actions>
  </fl-search-header>

  <fl-search-result>
    <li-note-table
      [datasource]="datasource"
      [columns]="columns"
      [rowSelectable]="noteSelectable"
      (noteSelected)="selectNote($event)"></li-note-table>
  </fl-search-result>
</fl-search>
