<div>
  <fl-key-value>
    <fl-key>{{ 'li.name' | translate }}</fl-key>
    {{ log.logInfo.name }}
  </fl-key-value>

  <fl-key-value>
    <fl-key>{{ 'li.log_size' | translate }}</fl-key>
    {{ log.logInfo.fileSize | flByteText }}
  </fl-key-value>

  <div class="configuration-container">
    <h2>{{ 'li.log_content' | translate }}</h2>
    <li-log-lines [logLines]="log.content"></li-log-lines>
  </div>
</div>
