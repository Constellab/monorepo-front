<table>
  <tbody>
    @for (line of logLines(); track line) {
      <tr>
        <td class="info">
          <span class="head">{{ line.datetime | flDate: 'DATE_TIME_WITH_SECONDS' }} - {{ line.level }}</span>
          @if (showContext() && line.context !== 'MAIN') {
            <br />
            <div class="g-text-tiny g-text-dense-height" [matTooltip]="line.context">
              {{ line.context }}
              @if (line.contextId) {
                : {{ line.contextId }}
              }
            </div>
          }
        </td>
        <td class="message">
          {{ line.message }}
        </td>
      </tr>
    }
  </tbody>
</table>
