<fl-dialog-header>
  {{ 'monitoring.system_config' | translate }}
</fl-dialog-header>

<mat-dialog-content>
  <fl-async-section [object]="systemConfig$">
    <ng-container *flSectionBody="systemConfig$ as systemConfig">
      <fl-key-value class="python-version">
        <fl-key>{{ 'monitoring.python_version' | translate }}</fl-key>
        {{ systemConfig.python_version }}
      </fl-key-value>

      @for (pipPackage of systemConfig.pip_packages; track pipPackage.name) {
        <fl-key-value>
          <fl-key>{{ pipPackage.name }}</fl-key>
          {{ pipPackage.version }}
        </fl-key-value>
      }
    </ng-container>
  </fl-async-section>
</mat-dialog-content>
