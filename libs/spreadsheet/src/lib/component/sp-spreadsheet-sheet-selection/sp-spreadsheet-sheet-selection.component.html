@if (sheets$ | async; as sheets) {
  @if (sheets?.length > 1) {
    <div class="container">
      <mat-button-toggle-group
        [formControl]="formControl"
        class="g-mat-button-toggle-small"
        (change)="selectSpreadsheet($event)">
        @for (sheet of sheets; track sheet) {
          <mat-button-toggle [value]="sheet.id">{{ sheet.name }}</mat-button-toggle>
        }
      </mat-button-toggle-group>
    </div>
  }
}
