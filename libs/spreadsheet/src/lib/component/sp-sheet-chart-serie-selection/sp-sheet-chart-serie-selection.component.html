<fl-portal>

  <fl-portal-header [enableDrag]="true">
    <h2>{{'spSpreadsheet.chart_serie_selection' | translate}}</h2>
  </fl-portal-header>

  <fl-portal-content>
    <form [formGroup]="formGp" (ngSubmit)="submit()"
          class="form">

      <!--   Serie's name   -->
      <mat-form-field class="g-form-input" appearance="outline">
        <mat-label>{{'spSpreadsheet.serie_name' | translate}}</mat-label>
        <input matInput formControlName="name" required
               placeholder="{{'spSpreadsheet.serie_name' | translate}}">
        <mat-error *ngIf="formGp.get('name').hasError('required')">
          {{'spSpreadsheet.serie_name' | flErrorRequired}}
        </mat-error>
      </mat-form-field>

      <!--   X values selection   -->
      <sp-sheet-ranges-input formControlName="x" *ngIf="formGp.get('x')"  selectionListenerGroup="sheet-chart"
                                   [rangeMode]="input.xSelectionMode"
                                   [placeholder]="'spSpreadsheet.chart_serie_selection_x' | translate"></sp-sheet-ranges-input>

      <!--   Y values selection   -->
      <sp-sheet-ranges-input formControlName="y"  selectionListenerGroup="sheet-chart" [required]="true"
                                   [rangeMode]="input.ySelectionMode"
                                   [placeholder]="'spSpreadsheet.chart_serie_selection_y' | translate"></sp-sheet-ranges-input>
<!--<fl-tag-input formControlName="y" [required]=""-->

      <div class="g-text-centered validate-button">
        <button mat-flat-button color="primary" type="submit">
          {{'spSpreadsheet.create_chart_validate' | translate}}
        </button>
      </div>
    </form>
  </fl-portal-content>
</fl-portal>
