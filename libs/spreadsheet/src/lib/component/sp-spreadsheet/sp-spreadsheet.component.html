<mat-drawer-container class="g-full g-full-height" [hasBackdrop]="false">
  <!-- Drawer with auto focus to false because this scroll the element when use in note -->
  <mat-drawer #drawer mode="over" position="end" [autoFocus]="false">
    <sp-spreadsheet-drawer></sp-spreadsheet-drawer>
  </mat-drawer>

  <mat-drawer-content>
    <div class="g-layout-row g-full-height">
      <div class="table-container g-layout-col">
        <div class="table-container g-layout-row" #tableContainer>
          <div class="horizontal-scroll" #horizontalScroller>
            <table class="table">
              <!--   Header columns cells     -->
              <thead>
                <tr>
                  <sp-spreadsheet-header-cell
                    *ngFor="let column of columns$ | async; trackBy: trackHeaderById"
                    [index]="column.index"
                    [header]="column"
                    type="column"
                    class="header-cell g-not-selectable"
                    flResize="width">
                  </sp-spreadsheet-header-cell>
                </tr>
              </thead>

              <tbody>
                <tr *ngFor="let row of rows$ | async; trackBy: trackRowById">
                  <!--  Row header cells  -->
                  <sp-spreadsheet-header-cell
                    [index]="row.index"
                    [header]="row"
                    type="row"
                    class="g-not-selectable"></sp-spreadsheet-header-cell>
                  <sp-spreadsheet-cell
                    *ngFor="let cell of row.cells; let columnIndex = index"
                    [cell]="cell"
                    [row]="row.index"
                    [column]="columnIndex"
                    class="g-not-selectable"></sp-spreadsheet-cell>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- Manage the scroll -->
          <div class="g-scrollable-element scroll-container" #scroller>
            <div class="scroller" #heightSimulator></div>
          </div>
        </div>

        <sp-spreadsheet-sheet-selection></sp-spreadsheet-sheet-selection>
      </div>
      <!--   Drawer opener   -->
      <fl-drawer-opener [drawer]="drawer" class="g-print-hide"></fl-drawer-opener>
    </div>
  </mat-drawer-content>
</mat-drawer-container>
