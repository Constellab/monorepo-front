<div
  class="container"
  tabindex="-1"
  flMouseHover
  [flMouseEnterDelay]="500"
  (flMouseEnter)="openInfoPortal()"
  (flMouseLeave)="closePortal()">
  @if (!edit) {
    <div class="view-content g-not-selectable">
      @if (!cellValueIsObject) {
        {{ cellValue }}
      } @else {
        <fl-text-icon iconPosition="end">
          <div>{{ 'spSpreadsheet.cell_value_object' | translate }}</div>
          <mat-icon
            class="g-icon-tiny open-icon"
            (click)="openCellValueIsNewSheet()"
            [matTooltip]="'spSpreadsheet.open_cell_object_in_sheet' | translate"
            >open_in_full
          </mat-icon>
        </fl-text-icon>
      }
    </div>
  } @else {
    <input
      class="input"
      #input
      [(ngModel)]="inputValue"
      size="1"
      (blur)="saveValueAndDisableEdit()"
      (keyup)="onInputKeyup($event)" />
  }
</div>
