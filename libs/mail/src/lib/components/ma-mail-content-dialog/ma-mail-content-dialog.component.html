<fl-dialog-header>
  {{ mail.subject }}
</fl-dialog-header>

<mat-dialog-content>
  <div [innerHTML]="mail.mail" class="mail"></div>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-flat-button color="primary" type="button" matDialogClose class="g-centered-forced">
    {{ 'maMail.ok' | translate }}
  </button>
</div>
