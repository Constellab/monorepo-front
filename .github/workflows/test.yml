name: Test

on:
  workflow_call:
    inputs:
      projects:
        description: >-
          Comma separated list of Nx projects to test. Leave empty to run every
          project that has a `test` target.
        required: false
        type: string
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6.0.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `nx.json` serialises the `test` target (`parallelism: false`) and `vitest.shared.mts`
      # caps each instance at 2 workers, so the whole suite stays inside the runner's memory.
      - name: Run tests
        run: |
          if [ -n "${{ inputs.projects }}" ]; then
            bunx nx run-many -t test --projects="${{ inputs.projects }}"
          else
            bunx nx run-many -t test
          fi
