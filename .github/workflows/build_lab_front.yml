name: Main Workflow lab front

on:
  push:
    tags:
      - 'lab_*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test.yml

  call_reusable_workflow:
    needs: test
    uses: ./.github/workflows/build_github_package.yml
    with:
      registry: docker.io
      image_name: constellab/lab-front
      github_ref: ${{ github.ref }}
      tag_prefix: lab_
      dockerfile_path: ./apps/lab-front/Dockerfile
    secrets:
      registry_username: ${{ secrets.DOCKER_USERNAME }}
      registry_password: ${{ secrets.DOCKER_PASSWORD }}

  update_readme:
    needs: call_reusable_workflow
    uses: ./.github/workflows/update_dockerhub_readme.yml
    with:
      repository: constellab/lab-front
      readme_filepath: ./apps/lab-front/README.md
    secrets:
      docker_username: ${{ secrets.DOCKER_USERNAME }}
      docker_password: ${{ secrets.DOCKER_PASSWORD }}
