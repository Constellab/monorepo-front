name: Main Workflow lab front

on:
  push:
    tags:
      - "lab_*"

jobs:
  call_reusable_workflow:
    uses: ./.github/workflows/build_github_package.yml
    with:
      registry: docker.io
      image_name: constellab/lab-front
      github_ref: ${{ github.ref }}
      tag_prefix: lab_
      dockerfile_path: ./apps/lab-front/Dockerfile
    secrets:
      registry_username: ${{ secrets.DOCKER_USERNAME }}
      registry_password: ${{ secrets.DOCKER_PASSWORD }}

  update_readme:
    runs-on: ubuntu-latest
    needs: call_reusable_workflow
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6.0.2

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.1.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # step to set the docker image description from docker_hub_README.md
      - name: Docker Hub Description
        uses: peter-evans/dockerhub-description@v4.0.2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: constellab/lab-front
          readme-filepath: ./apps/lab-front/README.md
