name: Main Workflow community front

on:
  push:
    tags:
      - 'ha_*'

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test.yml

  call_reusable_workflow:
    needs: test
    uses: ./.github/workflows/build_github_package.yml
    with:
      registry: ghcr.io
      image_name: ghcr.io/constellab/community-front
      github_ref: ${{ github.ref }}
      tag_prefix: ha_
      dockerfile_path: ./apps/ha-community-front/Dockerfile
    secrets:
      registry_username: ${{ github.actor }}
      registry_password: ${{ secrets.GITHUB_TOKEN }}
