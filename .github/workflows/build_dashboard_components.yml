name: Build dashboard components

on:
  push:
    tags:
      - "dc_*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app_name:
          [streamlit-iframe-message, streamlit-components, reflex-components]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6.0.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build ${{ matrix.app_name }}
        run: bun run dc-${{ matrix.app_name }}:build-prod

      - name: Create version.json file
        run: echo '{"version":"${{ github.ref_name }}" }' > dist/apps/dc-dashboard-components/${{ matrix.app_name }}/gws_plugin/version.json

      - name: Zip the build artifacts
        run: cd dist/apps/dc-dashboard-components/${{ matrix.app_name }}/gws_plugin && zip -r ../../../../../${{ matrix.app_name }}.zip ./*

      - name: Release ${{ matrix.app_name }}
        uses: softprops/action-gh-release@v3.0.0
        with:
          files: ${{ matrix.app_name }}.zip
          repository: Constellab/dashboard-components
          tag_name: ${{ github.ref_name }}
          token: ${{ secrets.RELEASE_DASHBOARD_COMPONENTS }}
