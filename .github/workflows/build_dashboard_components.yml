name: Build dashboard components

on:
  push:
    tags:
      - "dc_*"
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app_name:
          [streamlit-iframe-message, streamlit-components, reflex-components]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build ${{ matrix.app_name }}
        run: npm run dc-${{ matrix.app_name }}:build-prod

      - name: Create version.json file
        run: echo '{"version":"${{ github.ref_name }}" }' > dist/apps/dc-dashboard-components/${{ matrix.app_name }}/gws_plugin/version.json

      - name: Zip the build artifacts
        run: cd dist/apps/dc-dashboard-components/${{ matrix.app_name }}/gws_plugin && zip -r ../../../../../${{ matrix.app_name }}.zip ./*

      - name: Release ${{ matrix.app_name }}
        uses: softprops/action-gh-release@v3.0.0
        with:
          files: ${{ matrix.app_name }}.zip
          repository: Constellab/dashboard-components
          tag_name: ${{ github.ref_name }}
          # This secret holds the github token 'release-dashbord-components' with permissions to create releases
          # in the Constellab/dashboard-components repository
          # This token is stored in bmaisonneuve account.
          token: ${{ secrets.RELEASE_DASHBOARD_COMPONENTS }}
