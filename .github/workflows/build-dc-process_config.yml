name: Build process config dashboard component

on:
  push:
    tags:
      - 'dc_process_config_*'

jobs:
  call_reusable_workflow:
    uses: ./.github/workflows/build-dashboard-components.yml
    with:
      app_name: process-config
      github_ref: ${{ github.ref_name }}
    secrets:
      release_dashboard_components: ${{ secrets.RELEASE_DASHBOARD_COMPONENTS }}
