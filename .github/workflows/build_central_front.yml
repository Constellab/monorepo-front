name: Main Workflow central front

on:
  push:
    tags:
      - 'ca_*'

jobs:
  call_reusable_workflow:
    uses: ./.github/workflows/build_github_package.yml
    with:
      registry: ghcr.io
      image_name: ghcr.io/constellab/central-front
      github_ref: ${{ github.ref }}
      tag_prefix: ca_
      dockerfile_path: ./apps/ca-central-front/Dockerfile
    secrets:
      registry_username: ${{ github.actor }}
      registry_password: ${{ secrets.GITHUB_TOKEN }}
