name: Main Workflow hub front

on:
  push:
    tags:
      - 'ha_*'

jobs:
  call_reusable_workflow:
    uses: ./.github/workflows/build_github_package.yml
    with:
      registry: ghcr.io
      image_name: ghcr.io/constellab/community-front
      github_ref: ${{ github.ref }}
      tag_prefix: ha_
      dockerfile_path: ./apps/ha-hub/Dockerfile
    secrets:
      registry_username: ${{ github.actor }}
      registry_password: ${{ secrets.GITHUB_TOKEN }}
