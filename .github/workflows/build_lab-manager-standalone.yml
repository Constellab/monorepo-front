name: Main Workflow lab manager standalone

on:
  push:
    tags:
      - "lms_*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  call_reusable_workflow:
    uses: ./.github/workflows/build_github_package.yml
    with:
      registry: docker.io
      image_name: constellab/lab-manager-standalone
      github_ref: ${{ github.ref }}
      tag_prefix: lms_
      dockerfile_path: ./apps/lab-manager-standalone/Dockerfile
    secrets:
      registry_username: ${{ secrets.DOCKER_USERNAME }}
      registry_password: ${{ secrets.DOCKER_PASSWORD }}

  update_readme:
    needs: call_reusable_workflow
    uses: ./.github/workflows/update_dockerhub_readme.yml
    with:
      repository: constellab/lab-manager-standalone
      readme_filepath: ./apps/lab-manager-standalone/README.md
    secrets:
      docker_username: ${{ secrets.DOCKER_USERNAME }}
      docker_password: ${{ secrets.DOCKER_PASSWORD }}
